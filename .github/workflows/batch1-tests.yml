name: SAHM Batch 1 Tests

on:
  push:
    branches:
      - feature/sahm-final-preview-product
      - fix/sahm-node-ci-test-command
  pull_request:
    branches:
      - main

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run batch 1 tests
        run: node --test tests/*.test.js
