name: SAHM Node Tests

on:
  push:
    branches:
      - main
      - SAHM-SUPABASE
      - 'SAHM-LAB-*'
  pull_request:
    branches:
      - main
      - SAHM-SUPABASE
      - 'SAHM-LAB-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show runtime
        run: node --version
      - name: Run all Node tests
        run: node --test tests/*.test.js
