<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3158d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=DM+Sans:wght@400..700&display=swap" rel="stylesheet">
<title>سهم | إدارة الجمعيات</title>
<style>
:root{
  --ink:#10283f;--ink-2:#29445c;--muted:#78899a;--blue:#2856a5;--blue-2:#183f83;
  --gold:#9a6c25;--gold-2:#c2913f;--gold-pale:#f5eddf;--bg:#f3f7fa;--paper:#fff;
  --line:#e1e8ed;--line-2:#d5e0e7;--soft:#eef3f7;--soft-blue:#eaf1f8;
  --shadow:0 10px 28px rgba(24,49,73,.08),0 2px 7px rgba(24,49,73,.045);
  --shadow-gold:0 15px 30px rgba(115,79,25,.22),0 3px 8px rgba(87,64,27,.13);
  --danger:#b94b4b;--danger-soft:#fff0ef;--success:#38765e;--success-soft:#eaf5ef;
  --radius:19px;--radius-sm:13px;--radius-xs:10px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font-ui);color:var(--ink);background:#eaf0f4}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.48}
.preview-shell{min-height:100vh;display:grid;grid-template-columns:304px minmax(0,1fr);gap:22px;padding:20px;max-width:1480px;margin:auto}
.inspector{background:#fff;border:1px solid #e0e7ed;border-radius:22px;box-shadow:0 8px 30px rgba(23,48,72,.06);display:flex;flex-direction:column;min-height:calc(100vh - 40px);max-height:calc(100vh - 40px);overflow:hidden}
.inspector-head{padding:20px 18px 15px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfcfd)}
.brand-line{display:flex;align-items:center;gap:11px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#173e7b,#2f62b3);color:#fff;display:grid;place-items:center;box-shadow:0 5px 12px #244d872c}
.brand-mark svg{width:21px;height:21px}
.brand-title{font-size:18px;font-weight:900;letter-spacing:.1px}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.preview-state{margin-top:15px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.preview-pill{font-size:10px;font-weight:800;border:1px solid #d9e3eb;border-radius:30px;padding:5px 9px;background:#f7fafc;color:#536b7e}
.preview-pill.warn{border-color:#ead9ba;background:#faf4e9;color:#866022}
.summary-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}
.summary-count{border:1px solid var(--line);border-radius:11px;padding:8px 5px;text-align:center;background:#fbfcfd}
.summary-count strong{font-size:16px;display:block;line-height:1.3}
.summary-count span{font-size:9px;color:var(--muted)}
.index-tools{padding:12px 14px 9px;border-bottom:1px solid var(--line);background:#fcfdfe}
.search-index{width:100%;height:39px;border:1px solid var(--line-2);border-radius:11px;background:#f7fafc;padding:0 12px;color:var(--ink);outline:none;font-size:12px}
.search-index:focus{border-color:#9eb7d5;box-shadow:0 0 0 3px #dbe7f4}
.index-scroll{overflow:auto;padding:8px 10px 14px;flex:1}
.index-section{margin:10px 4px 7px;font-size:10px;font-weight:900;color:#8a9aa9;letter-spacing:.2px}
.index-item{display:flex;align-items:center;gap:9px;width:100%;text-align:right;border:1px solid transparent;background:transparent;padding:8px 8px;border-radius:11px;color:var(--ink);margin:2px 0;min-height:42px}
.index-item:hover{background:#f5f8fb}
.index-item.active{background:#edf3fa;border-color:#d9e5f0}
.index-item.retired{opacity:.48;cursor:not-allowed;text-decoration:line-through}
.index-num{width:30px;height:27px;display:grid;place-items:center;border-radius:8px;background:#f1f5f8;color:#52697c;font-size:10px;font-weight:900;flex-shrink:0;direction:ltr}
.index-item.active .index-num{background:#dce8f6;color:#1e4d91}
.index-name{font-size:11px;font-weight:700;line-height:1.5;flex:1}
.index-status{font-size:9px;color:#8a9aa8;white-space:nowrap}
.index-status.a{color:#27609e}.index-status.p{color:#96712e}
.index-foot{border-top:1px solid var(--line);padding:12px 14px;font-size:10px;color:#718395;line-height:1.7;background:#fbfcfd}
.index-foot strong{color:#3b566e}
.demo-actions{display:flex;gap:6px;margin-top:8px}
.demo-actions button{flex:1;border:1px solid #dce5ec;background:#fff;border-radius:9px;padding:7px 5px;font-size:10px;color:#38536b}
.app{height:100%;width:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative}
.app.dark{--ink:#edf3f9;--ink-2:#c4d0dc;--muted:#94a3b2;--bg:#101b27;--paper:#172533;--line:#2b3b4a;--line-2:#34495b;--soft:#1d2c3b;--soft-blue:#1d344b;--gold-pale:#3e3424;--shadow:0 12px 28px rgba(0,0,0,.25);}
.app.dark .app-top,.app.dark .bottom-nav{background:#142230;border-color:#344657;box-shadow:0 -5px 17px rgba(0,0,0,.2)}
.app.dark .card,.app.dark .form-card,.app.dark .info-card,.app.dark .record-card,.app.dark .list-row,.app.dark .tile,.app.dark .section-box,.app.dark .modal-card{background:var(--paper);border-color:var(--line)}
.app.dark input,.app.dark select,.app.dark textarea{background:var(--surface-2);color:var(--ink);border-color:var(--line-2)}
.app.dark .auth-card{background:var(--paper);border-color:var(--line)}
.app.dark .empty-state,.app.dark .record-details,.app.dark .inline-note{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.icon-btn{border:0;background:transparent;color:var(--blue);padding:4px;display:grid;place-items:center;position:relative}
.icon-btn .notice-dot{position:absolute;top:1px;right:1px;width:7px;height:7px;background:#d65352;border-radius:50%;border:1px solid #fff}
.connection-strip{background:#fff6e9;color:#8a6327;padding:7px 14px;font-size:11px;display:flex;align-items:center;gap:7px;border-bottom:1px solid #ead8b7;flex-shrink:0}
.connection-strip svg{width:16px;height:16px}
.screen-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:16px 16px 24px;scrollbar-width:thin;scrollbar-color:#cad5df transparent}
.screen-body.no-pad{padding:0}
.bottom-item.active{color:var(--blue);font-weight:900}
.bottom-item.active svg{stroke-width:2.25}
.mock-label{position:absolute;top:74px;left:12px;z-index:3;pointer-events:none;font-size:9px;color:#59718a;background:#fffdf3d9;border:1px solid #eadfca;padding:4px 7px;border-radius:20px;opacity:.92}
.app:not(.has-top) .mock-label{top:12px}
/* common components */
.page-intro{margin:2px 0 16px}
.page-intro h2{font-size:20px;margin:0 0 5px;font-weight:900}
.page-intro p{font-size:12px;color:var(--muted);margin:0;line-height:1.8}
.card,.form-card,.info-card,.section-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.form-card{padding:17px;margin-bottom:14px}
.info-card{padding:15px;margin-bottom:12px}
.section-box{padding:15px;margin-bottom:13px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 1px 12px}
.section-head h3{font-size:17px;font-weight:900;margin:0}
.section-title-wrap{display:flex;align-items:center;gap:9px}
.section-head svg{width:23px;height:23px;color:var(--blue)}
.section-sub{font-size:10px;color:var(--muted);font-weight:500}
.field{margin:0 0 14px;min-width:0}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;font-weight:800;color:var(--ink-2);margin:0 0 7px}
.field input,.field select,.field textarea,.filter-select{width:100%;height:43px;border:1px solid var(--line-2);border-radius:var(--radius-control);background:var(--surface-2);color:var(--ink);padding:0 12px;outline:none;font-size:13px;min-width:0;transition:border-color .16s ease,background .16s ease,box-shadow .16s ease}
.field textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#9bb5d7;background:var(--paper);box-shadow:0 0 0 2px rgba(49,88,214,.10)}
.field .hint{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.7}
.field .error{font-size:10px;color:var(--danger);margin-top:5px;display:none}
.field.invalid input,.field.invalid select{border-color:#c96969;background:#fffafa}
.field.invalid .error{display:block}
.row-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-row{display:flex;align-items:center;gap:9px}
.field-row>*{min-width:0}
.btn{border:1px solid transparent;border-radius:12px;min-height:43px;padding:10px 15px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s ease;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 5px 12px #224d9027}
.btn.primary:hover{background:var(--blue-2)}
.btn.gold{background:linear-gradient(135deg,#9b6c27,#c08f3d);color:#fff;box-shadow:0 5px 12px #9265232b}
.btn.secondary{background:var(--soft);border-color:var(--line-2);color:var(--ink-2)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink-2)}
.btn.danger{background:#fff2f1;border-color:#f1d8d6;color:#a84646}
.btn.block{width:100%}
.btn.small{min-height:34px;padding:6px 11px;font-size:11px;border-radius:9px}
.text-link{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:800;padding:7px 4px}
.helper-links{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:0 3px}
.muted{color:var(--muted)}
.small-note{font-size:10px;line-height:1.75;color:var(--muted)}
.inline-note{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-control);padding:10px 12px;font-size:12px;color:var(--ink-2);line-height:1.8}
.unresolved{border:1px dashed #d7c39e;background:#fcf8ef;color:#84652f;border-radius:11px;padding:10px 11px;font-size:11px;line-height:1.75}
.status{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;border-radius:25px;padding:5px 9px;background:#f0f4f7;color:#65798a;white-space:nowrap}
.status.blue{background:#edf3fa;color:#2b5a96}.status.gold{background:#f8f1e5;color:#8d672d}.status.green{background:#eaf4ee;color:#39735c}.status.red{background:#fff0ef;color:#ad4f4a}
.list-search{position:relative;display:flex;align-items:center;min-height:43px;margin:-8px 0 14px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}
.list-search input{width:100%;height:43px;border:1px solid var(--line-2);border-radius:var(--radius-control);padding:0 42px 0 12px;background:var(--surface-2);color:var(--ink);outline:none;font-size:13px;box-shadow:inset 0 1px 2px rgba(26,48,73,.045);transition:border-color .16s ease,background .16s ease,box-shadow .16s ease}
.list-search input:focus{border-color:#9bb5d7;background:var(--paper);box-shadow:0 0 0 2px rgba(49,88,214,.10)}
.list-search svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted);pointer-events:none}
.list-stack{display:flex;flex-direction:column;gap:9px}
.list-row{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-card);min-height:64px;display:flex;align-items:center;gap:11px;padding:12px 14px;box-shadow:var(--shadow-card);color:var(--ink);width:100%;text-align:right}
.list-row .row-icon{width:32px;height:32px;flex-shrink:0;display:grid;place-items:center;color:var(--blue)}
.list-row .row-icon.gold{color:var(--gold)}
.list-row .row-icon svg{width:26px;height:26px}
.list-row .row-main{flex:1;min-width:0}
.list-row .row-title{font-size:13px;font-weight:850;line-height:1.5}
.list-row .row-meta{font-size:10px;color:var(--muted);margin-top:3px}
.list-row .row-arrow{width:17px;height:17px;color:#71879b;flex-shrink:0}
.relationship-list{gap:12px}
.relationship-card{
 position:relative;isolation:isolate;display:flex;align-items:center;gap:14px;width:100%;min-height:78px;padding:14px 16px;
 overflow:hidden;border:1px solid #e8edf3;border-radius:18px;
 background:#fff;color:var(--ink);text-align:right;
 box-shadow:0 1px 2px rgba(19,39,62,.025),0 7px 20px rgba(19,39,62,.055);
 transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
.relationship-card:before{content:"";position:absolute;z-index:-1;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,#6f91c5,#3158a8);opacity:.9}
.relationship-card.is-member:before{background:linear-gradient(180deg,#d9b878,#a87835)}
.relationship-card:after{content:"";position:absolute;z-index:-1;left:-30px;top:-48px;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,rgba(49,88,168,.065),transparent 68%);pointer-events:none}
.relationship-card:hover{transform:translateY(-2px);border-color:#d5e0ed;box-shadow:0 4px 9px rgba(19,39,62,.045),0 13px 26px rgba(19,39,62,.09)}
.relationship-card:active{transform:scale(.99);background:#f9fbfe}
.relationship-card:focus-visible{outline:3px solid rgba(49,88,214,.22);outline-offset:3px}
.relationship-icon{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border-radius:14px;
 color:#3158a8;background:linear-gradient(145deg,#f0f5fc,#e7eef8);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 5px rgba(38,72,119,.07)}
.relationship-icon svg{width:24px;height:24px;stroke-width:1.85}
.relationship-card.is-member .relationship-icon{color:#98702f;background:linear-gradient(145deg,#faf4e9,#f1e6d2);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 5px rgba(126,91,39,.07)}
.relationship-name{flex:1;min-width:0;font-size:15px;line-height:1.5;font-weight:800;letter-spacing:-.15px;color:var(--ink);overflow-wrap:anywhere}
.relationship-arrow{width:30px;height:30px;flex:0 0 30px;padding:7px;border:1px solid #edf1f5;border-radius:11px;color:#71849b;background:#f8fafc}
.app.dark .relationship-card{background:#172635;border-color:#2b3d4e;color:var(--ink);box-shadow:0 5px 16px rgba(0,0,0,.2)}
.app.dark .relationship-card:after{background:radial-gradient(circle,rgba(107,145,202,.13),transparent 68%)}
.app.dark .relationship-card:hover{background:#1b2d3f;border-color:#40566c}
.app.dark .relationship-icon{color:#a9c1e7;background:linear-gradient(145deg,#263b52,#203248);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.app.dark .relationship-card.is-member .relationship-icon{color:#dfbd82;background:linear-gradient(145deg,#443923,#342e24)}
.app.dark .relationship-arrow{color:#a4b4c5;border-color:#33485b;background:#203244}
.tile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;min-height:144px;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--paper);box-shadow:var(--shadow-card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:15px 12px 22px;text-align:center;color:var(--ink);width:100%}
.tile:hover{transform:translateY(-1px);box-shadow:0 13px 24px rgba(20,48,74,.1)}
.tile .tile-icon{display:grid;place-items:center;height:42px;color:var(--blue)}
.tile .tile-icon.gold{color:var(--gold)}
.tile .tile-icon svg{width:43px;height:43px;stroke-width:1.9}
.tile .tile-label{font-size:15px;font-weight:900;line-height:1.55}
.tile .tile-arrow{position:absolute;left:13px;bottom:10px;background:#eef4f8;color:#506e89;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.tile .tile-arrow svg{width:17px;height:17px}
.empty-state{border:1px dashed var(--line-2);border-radius:var(--radius-card);padding:25px 14px;text-align:center;color:var(--muted);background:var(--surface-2);font-size:12px;line-height:1.8}
.empty-state svg{width:29px;height:29px;color:#9aabba;margin-bottom:8px}
.kv-list{display:flex;flex-direction:column}
.kv-row{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;padding:11px 1px;border-bottom:1px solid var(--line);font-size:12px}
.kv-row:last-child{border-bottom:0}
.kv-row .k{color:var(--muted);font-weight:650}
.kv-row .v{font-weight:800;text-align:left;max-width:60%;overflow-wrap:anywhere}
.pill-tabs{display:flex;gap:6px;background:#eef3f6;padding:4px;border-radius:11px;margin-bottom:14px}
.pill-tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;color:#6e8293;font-size:11px;font-weight:800}
.pill-tabs button.active{background:#fff;color:var(--blue);box-shadow:0 1px 4px #1c3c5a18}
.filter-row{display:flex;align-items:center;gap:8px;overflow-x:auto;min-height:43px;padding:0;margin:-8px 0 14px;border:0;border-radius:0;background:transparent;box-shadow:none;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-select{width:auto;min-width:110px;flex:1 0 110px;height:43px;padding:0 12px;font-size:12px;border:1px solid var(--line-2);border-radius:var(--radius-control);flex-shrink:0;background:var(--surface-2);color:var(--ink);box-shadow:inset 0 1px 2px rgba(26,48,73,.045);transition:border-color .16s ease,background .16s ease,box-shadow .16s ease}
.filter-select:focus{outline:none;border-color:#9bb5d7;background:var(--paper);box-shadow:0 0 0 2px rgba(49,88,214,.10)}
.record-section-title{font-size:13px;font-weight:900;margin:16px 2px 9px;display:flex;align-items:center;justify-content:space-between}
.record-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:9px}
.record-summary{width:100%;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;gap:11px;padding:13px 13px;text-align:right;min-height:65px}
.record-symbol{width:30px;height:30px;display:grid;place-items:center;flex-shrink:0;color:var(--blue)}
.record-symbol svg{width:24px;height:24px}
.record-title{font-size:12px;font-weight:900;line-height:1.5}
.record-subtitle{font-size:10px;color:var(--muted);margin-top:3px}
.record-value{margin-right:auto;font-size:12px;font-weight:900;white-space:nowrap;text-align:left}
.record-chevron{width:17px;height:17px;color:#8b9aaa;flex-shrink:0;transition:transform .18s}
.record-card.open .record-chevron{transform:rotate(180deg)}
.record-details{border-top:1px solid var(--line);padding:12px 13px 14px;background:var(--surface-2)}
.record-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.record-actions .btn{flex:1}
.progress-line{height:7px;border-radius:20px;background:#e8eef2;overflow:hidden;margin-top:7px}
.progress-line span{height:100%;display:block;background:linear-gradient(90deg,#2856a5,#6791c7);border-radius:20px}
/* home */
.home-body{padding:12px 14px 8px}
.summary-carousel{position:relative;margin-bottom:12px}
.summary-window{position:relative;height:124px;overflow:hidden;border:1px solid rgba(255,255,255,.72);border-radius:18px;background:rgba(224,234,249,.48);box-shadow:0 10px 20px rgba(19,42,83,.18),0 22px 36px rgba(19,42,83,.12),inset 0 1px 0 rgba(255,255,255,.9)}
.summary-track{position:relative;width:100%;height:100%;direction:rtl;touch-action:pan-y}
.summary-slide{position:absolute;isolation:isolate;inset:0;display:flex;align-items:center;gap:15px;width:100%;min-width:0;height:100%;padding:16px 18px;overflow:hidden;border:1px solid rgba(255,255,255,.58);border-radius:18px;color:#fff;opacity:0;visibility:hidden;transform:translateX(16px) scale(.985);pointer-events:none;backdrop-filter:blur(12px) saturate(145%);-webkit-backdrop-filter:blur(12px) saturate(145%);box-shadow:inset 0 1px 0 rgba(255,255,255,.62),inset 0 -2px 0 rgba(5,18,43,.24),0 8px 18px rgba(7,22,48,.22);transition:transform .22s ease,filter .22s ease,box-shadow .22s ease}
.summary-slide.active{opacity:1;visibility:visible;transform:translateX(0) scale(1);pointer-events:auto}
.summary-slide:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(125deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.08) 30%,rgba(4,17,39,.22) 100%);border-radius:inherit;pointer-events:none}

/* Visual tokens and component styling borrowed from the published SAHM reference.

   and navigation remain unchanged. */
:root{--font-ui:'IBM Plex Sans Arabic',sans-serif;--font-numeric:'DM Sans',sans-serif;--ink:#172338;--ink-2:#2b3d59;--muted:#68778d;--blue:#3158d6;--blue-2:#2345b5;--gold:#a67532;--gold-2:#c18a2d;--gold-pale:#fff3dc;--bg:#f4f6fa;--paper:#fff;--line:#e3e9f1;--line-2:#d4deea;--soft:#f0f3f8;--soft-blue:#eaf0fc;--surface:#fff;--surface-2:#edf1f6;--primary:#3158d6;--primary-dark:#2345b5;--shadow:0 7px 24px rgba(25,44,78,.06);--shadow-card:0 2px 5px rgba(25,44,78,.035),0 7px 18px rgba(25,44,78,.05);--shadow-gold:0 12px 26px rgba(115,79,25,.18),0 2px 7px rgba(87,64,27,.09);--danger:#b42318;--danger-soft:#fbecee;--success:#18744f;--success-soft:#e5f5ed;--radius:14px;--radius-sm:11px;--radius-xs:9px;--radius-shell:18px;--radius-card:14px;--radius-control:11px;--radius-small:9px;--font-page-title:22px;--font-section-title:18px;--font-card-title:16px;--font-body:15px;--font-secondary:13px;--font-helper:12px;--weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;--leading-title:1.35;--leading-body:1.6}
html,body,button,input,select,textarea{font-family:var(--font-ui)}
body{background:var(--bg);color:var(--ink)}
.app{font-family:var(--font-ui);font-size:var(--font-body);line-height:var(--leading-body);color:var(--ink);background:var(--bg)}
.app :is([dir="ltr"],.numeric,[data-numeric],.amount,.record-value,input[type="number"],input[inputmode="numeric"],input[inputmode="decimal"],input[inputmode="tel"]){font-family:var(--font-numeric);font-variant-numeric:tabular-nums}
.app.dark{--ink:#edf3f9;--ink-2:#c4d0dc;--muted:#94a3b2;--bg:#101b27;--paper:#172533;--line:#2b3b4a;--line-2:#34495b;--soft:#1d2c3b;--soft-blue:#1d344b;--surface:var(--paper);--surface-2:#1d2c3b;--gold-pale:#3e3424;--shadow:0 12px 28px rgba(0,0,0,.25);--shadow-card:0 3px 8px rgba(0,0,0,.16),0 8px 18px rgba(0,0,0,.12)}

function copyText(value,label){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(()=>showToast(`تم نسخ ${label}`)).catch(()=>openModal(`نسخ ${label}`,`<p>تعذر الوصول إلى الحافظة في هذه البيئة. يمكنك نسخ النص يدوياً:</p><textarea readonly style="width:100%;direction:ltr;text-align:left">${esc(value)}</textarea>`))}else{openModal(`نسخ ${label}`,`<p>انسخ النص:</p><textarea readonly style="width:100%;direction:ltr;text-align:left">${esc(value)}</textarea>`)}}
function openContactsPicker(){selectedContacts=[];const opts=contactsFixture.map(c=>`<label class="contact-option"><input type="checkbox" data-contact-check="${c.id}"><div><strong>${esc(c.name)}</strong><small dir="ltr">${esc(c.phone)}</small></div></label>`).join('');openModal('اختيار جهات الاتصال',`<p>اختر جهات الاتصال التي تريد إضافتها.</p><div style="border:1px solid var(--line);border-radius:12px;overflow:hidden">${opts}</div>`,`<button class="btn secondary" data-action="modal-close">إلغاء</button><button class="btn primary" data-action="contacts-confirm">تأكيد الاختيار</button>`)}
function renderContactRows(){const selected=contactsFixture.filter(c=>selectedContacts.includes(c.id));contactRecords=selected.length?selected:[];}
function updateJoinCalc(){const total=1200*Math.max(1,Math.floor(Number(joinShares)||1));const t=document.getElementById('joinTotal');if(t)t.textContent=total.toLocaleString('en-US')+' ر.ي';const p=document.getElementById('joinPlan');if(p)p.innerHTML=Array.from({length:6},(_,i)=>`<div class="installment-line"><span>القسط ${i+1}</span><strong>${(200*Math.max(1,Math.floor(Number(joinShares)||1))).toLocaleString('en-US')} ر.ي</strong></div>`).join('')}
function saveRegistrationFromDom(){const e=document.getElementById('regEmail'),p=document.getElementById('regPass'),c=document.getElementById('regConfirm'),a=document.getElementById('regTerms');if(e)registration.email=e.value;if(p)registration.pass=p.value;if(c)registration.confirm=c.value;if(a)registration.accepted=a.checked}
function submitCreateGroup(){
 const name=String(form.name||'').trim(),start=form.start,first=form.first,share=Number(form.share),installments=getInstallments();
 const okName=name.length>=2,okStart=!!start,okFirst=!!first&&!!start&&new Date(first+'T00:00:00')>new Date(start+'T00:00:00'),okShare=Number.isFinite(share)&&share>0;
 const okPlan=form.mode==='count'?(Number.isInteger(Number(form.count))&&Number(form.count)>0):(Number(form.installment)>0&&Number(form.installment)<=share);
 const okManager=form.managerRole!=='manager-member'||(Number.isInteger(Number(form.managerShares))&&Number(form.managerShares)>0);
 setFieldError('errName',!okName);setFieldError('errStart',!okStart);setFieldError('errFirst',!okFirst);setFieldError('errShare',!okShare);setFieldError(form.mode==='count'?'errCount':'errInstallment',!okPlan);if(form.managerRole==='manager-member')setFieldError('errManagerShares',!okManager);
 if(!(okName&&okStart&&okFirst&&okShare&&okPlan&&okManager)){showToast('راجع الحقول المحددة قبل المتابعة');return}
 if(!online){showToast('إنشاء الجمعية يتطلب الاتصال بالإنترنت');return}
 groupResult={...form,name,share:String(share),count:String(installments.length)};
 go('015');
}
function searchFilter(input){filterVisible(input)}
function applyListFilters(){
 const body=document.querySelector('#app .screen-body');if(!body)return;
 const search=body.querySelector('[data-search-input],.list-search input');const q=(search?.value||'').trim().toLowerCase();
 const selectors=[...body.querySelectorAll('[data-list-filter]')];
 const chosen=selectors.map(s=>({key:s.dataset.listFilter,value:s.value})).filter(x=>x.value&&x.value!=='all');
 const items=[...body.querySelectorAll('[data-filter-text],.record-card')];let shown=0;
 items.forEach(el=>{const text=(el.dataset.filterText||el.textContent||'').toLowerCase();let ok=!q||text.includes(q);for(const f of chosen){const val=String(el.dataset[f.key]||'');if(!val||val!==f.value)ok=false;}el.style.display=ok?'':'none';if(ok)shown++});
 const emptyEl=body.querySelector('[data-search-empty]');if(emptyEl)emptyEl.style.display=shown?'none':'';
}

/* Click delegation keeps the prototype lightweight and works after every local render. */
document.addEventListener('click',e=>{
 const actionEl=e.target.closest('[data-action]');
 if(!actionEl)return;
 const action=actionEl.dataset.action,id=actionEl.dataset.id,value=actionEl.dataset.value;
 if(action==='modal-close'){closeModal();return}
 if(action==='open-index'){document.getElementById('inspector').classList.add('open');return}
 if(action==='close-index'){document.getElementById('inspector').classList.remove('open');return}
 if(action==='index-go'){go(id);document.getElementById('inspector').classList.remove('open');return}
 if(action==='nav'){if(id==='005')saveRegistrationFromDom();go(id);return}
 if(action==='back'){back(actionEl.dataset.fallback||'008');return}
 if(action==='profile'){go('013');return}
 if(action==='notifications'){go('012');return}
 if(action==='activity'){const ev=recentEvents.find(x=>x.id===id);if(ev?.route==='012'){go('012')}else{activeGroup=groupFixtures.find(g=>g.name===ev?.group)||groupFixtures[0];go('021')}return}
 if(action==='open-group'){activeGroup=groupFixtures.find(g=>g.id===id)||groupFixtures[0];go(activeGroup.kind==='manager'?'021':'032');return}
 if(action==='open-chat'){activeGroup=groupFixtures.find(g=>g.id===id)||groupFixtures[0];go(activeGroup.kind==='manager'?'027':'038');return}
 if(action==='carousel'){setCarouselSlide(Number(actionEl.dataset.index)||0);return}
 if(action==='country-picker'){openModal('اختيار الدولة','اليمن','<button class="btn primary" data-action="modal-close">إغلاق</button>');return}
 if(action==='toggle-pass'){const input=document.getElementById(actionEl.dataset.target);if(input)input.type=input.type==='password'?'text':'password';return}
 if(action==='login'){
   const email=document.getElementById('loginEmail')?.value.trim()||'',pass=document.getElementById('loginPass')?.value||'';setInvalid('loginEmailWrap',!validEmail(email));setInvalid('loginPassWrap',!pass);
   if(!validEmail(email)||!pass){showToast('تحقق من البريد الإلكتروني وكلمة المرور');return}
   if(!online){showToast('تحقق من اتصالك بالإنترنت');return}
   accountEmail=email;showToast('تعذر تسجيل الدخول. تحقق من بياناتك وحاول مجدداً.');go('008');setTimeout(()=>showToast('مرحباً بك في سهم'),30);return;
 }
 if(action==='recover-find'){
   const email=document.getElementById('recEmail')?.value.trim()||'',phone=document.getElementById('recPhone')?.value.trim()||'';setInvalid('recEmailWrap',!validEmail(email));setInvalid('recPhoneWrap',!phone);
   if(!validEmail(email)||!phone){showToast('أكمل البريد الإلكتروني ورقم الهاتف');return}if(!online){showToast('استعادة الحساب تتطلب الاتصال بالإنترنت');return}recoverStep=2;go('003');showToast('تم العثور على الحساب');return;
 }
 if(action==='recover-reset'){
   const account=document.getElementById('recId')?.value.trim()||'',p=document.getElementById('recNew')?.value||'',c=document.getElementById('recConfirm')?.value||'';
   setInvalid('recIdWrap',account!=='SHM-2481-0001');setInvalid('recNewWrap',p.length<6);setInvalid('recConfirmWrap',!c||c!==p);
   if(account!=='SHM-2481-0001'||p.length<6||c!==p){showToast('تحقق من معرّف الحساب وكلمتي المرور');return}if(!online){showToast('استعادة الحساب تتطلب الاتصال بالإنترنت');return}recoverStep=1;go('002');showToast('تم تحديث كلمة المرور');return;
 }
 if(action==='register'){
   saveRegistrationFromDom();const okE=validEmail(registration.email),okP=registration.pass.length>=6,okC=registration.confirm===registration.pass&&!!registration.confirm,okA=registration.accepted;
   setInvalid('regEmailWrap',!okE);setInvalid('regPassWrap',!okP);setInvalid('regConfirmWrap',!okC);setInvalid('regTermsWrap',!okA);
   if(!(okE&&okP&&okC&&okA)){showToast('راجع بيانات التسجيل والموافقة على الشروط');return}if(!online){showToast('إنشاء الحساب يتطلب الاتصال بالإنترنت');return}accountEmail=registration.email;go('006');showToast('أكمل بيانات الملف الشخصي');return;
 }
 if(action==='complete-profile'){
   const name=document.getElementById('profileName')?.value.trim()||'',phone=document.getElementById('profilePhone')?.value.trim()||'';setInvalid('profileNameWrap',!name);setInvalid('profilePhoneWrap',!phone);
   if(!name||!phone){showToast('أدخل الاسم ورقم الهاتف');return}if(!online){showToast('استكمال البيانات يتطلب الاتصال بالإنترنت');return}profileName=name;accountPhone=phone;go('008');showToast('تم تحديث بيانات الملف الشخصي');return;
 }
 if(action==='avatar'){profileAvatar=value||'user';document.querySelectorAll('.avatar-option').forEach(b=>b.classList.toggle('active',b.dataset.value===profileAvatar));return}
 if(action==='toggle-lock'){showToast('');return}
 if(action==='edit-name'){openModal('تعديل الاسم',`<div class="field"><label>الاسم</label><input id="editNameInput" value="${esc(profileName)}"></div>`,`<button class="btn secondary" data-action="modal-close">إلغاء</button><button class="btn primary" data-action="save-name">حفظ</button>`);return}
 if(action==='save-name'){const v=document.getElementById('editNameInput')?.value.trim()||'';if(!v){showToast('الاسم مطلوب');return}profileName=v;closeModal();render();showToast('تم تحديث الاسم');return}
 if(action==='change-password'){openModal('تغيير كلمة المرور',`<div class="field"><label>كلمة المرور الحالية</label><input id="oldPassword" type="password"></div><div class="field"><label>كلمة المرور الجديدة</label><input id="newPassword" type="password"></div><div class="field"><label>تأكيد كلمة المرور الجديدة</label><input id="confirmPassword" type="password"></div>`,`<button class="btn secondary" data-action="modal-close">إلغاء</button><button class="btn primary" data-action="save-password">متابعة</button>`);return}
 if(action==='save-password'){const old=document.getElementById('oldPassword')?.value||'',p=document.getElementById('newPassword')?.value||'',c=document.getElementById('confirmPassword')?.value||'';if(!old||p.length<6||p!==c){showToast('تحقق من الحقول ومطابقة كلمة المرور');return}closeModal();showToast(' فقط — تم تحديث كلمة المرور');return}
 if(action==='copy-id'){copyText('SHM-2481-0001','معرّف الحساب');return}
 if(action==='logout-open'){openModal('تسجيل الخروج','هل تريد إنهاء الجلسة الحالية؟ لا يؤدي ذلك إلى حذف أي بيانات أو تفضيلات.','<button class="btn secondary" data-action="modal-close">إلغاء</button><button class="btn danger" data-action="logout-confirm">تسجيل الخروج</button>');return}
 if(action==='logout-confirm'){closeModal();historyStack=[];go('002');showToast('تم تسجيل الخروج');return}
 if(action==='install-mode'){form.mode=value;previewOpen=false;render();return}
 if(action==='manager-role'){form.managerRole=value;render();return}
 if(action==='toggle-preview'){previewOpen=!previewOpen;updateAssociationCalc();return}
 if(action==='create-group'){submitCreateGroup();return}
 if(action==='copy-link'){const link=String(groupResult.joinLink||'').trim();if(!link){showToast('رابط الانضمام غير متاح حالياً');return}copyText(link,'رابط الانضمام');return}
 if(action==='share-link'){const link=String(groupResult.joinLink||'').trim();if(!link){showToast('رابط الانضمام غير متاح حالياً');return}openModal('مشاركة رابط الانضمام',`<div class="inline-note" dir="ltr" style="text-align:left">${esc(link)}</div>`,`<button class="btn secondary" data-action="modal-close">إغلاق</button><button class="btn primary" data-action="copy-link">نسخ النص</button>`);return}
 if(action==='contacts-picker'){openContactsPicker();return}
 if(action==='retry-join-link'){showToast('خدمة تجهيز رابط الانضمام غير متصلة بهذه المعاينة');return}
 if(action==='contacts-confirm'){renderContactRows();if(!contactRecords.length){showToast('اختر جهة اتصال واحدة على الأقل');return}closeModal();go('040');return}
 if(action==='contact-invite'){openModal('دعوة للجمعية','','<button class="btn secondary" data-action="modal-close">إغلاق</button><button class="btn primary" data-action="modal-close">مفهوم</button>');return}
 if(action==='contact-share'){openModal('دعوة للتثبيت','','<button class="btn primary" data-action="modal-close">إغلاق</button>');return}
 if(action==='verify-link'){
   const raw=document.getElementById('joinLink')?.value.trim()||'';linkValue=raw;let valid=false;try{const u=new URL(raw);valid=u.protocol==='https:'&&!!u.hostname}catch{}setInvalid('joinLinkWrap',!valid);if(!valid){showToast('أدخل رابطاً عاماً بصيغة HTTPS صحيحة');return}if(!online){showToast('التحقق يتطلب الاتصال بالإنترنت');return}joinShares=1;joinAck=false;joinSubmitted=false;joinType='public';go('017');showToast('تم التحقق من الرابط');return;
 }
 if(action==='send-join'){
   const n=Number(document.getElementById('joinShares')?.value||joinShares);joinShares=n;setInvalid('joinSharesWrap',!Number.isInteger(n)||n<1);joinAck=!!document.getElementById('joinAck')?.checked;
   if(!Number.isInteger(n)||n<1||!joinAck){showToast('حدد عدد الأسهم وأكد الاطلاع على الالتزامات');return}if(!online){showToast('إرسال طلب الانضمام يتطلب الاتصال بالإنترنت');return}joinSubmitted=true;render();showToast('تم إرسال طلب الانضمام');return;
 }
 if(action==='notice-open'){
   noticeCurrent=notifications.find(n=>n.id===id)||notifications[0];noticeCurrent.read=true;render();const n=noticeCurrent;const cta=n.type==='invite'?`<button class="btn primary" data-action="notice-action" data-id="${n.id}">تفاصيل الدعوة ومتابعة الطلب</button>`:`<button class="btn primary" data-action="notice-action" data-id="${n.id}">فتح الوجهة المرتبطة</button>`;openModal('تفاصيل الإشعار',`<div class="row-icon-box" style="margin-bottom:12px">${icon(n.type==='invite'?'gift':'activity')}<strong>${esc(n.title)}</strong></div><div class="small-note">${esc(n.group)} · ${esc(n.time)} · مقروء</div><p>${esc(n.body)}</p>`,n.type==='invite'?`<button class="btn secondary" data-action="modal-close">إغلاق</button>${cta}`:`<button class="btn secondary" data-action="modal-close">إغلاق</button>${cta}`);return;
 }
 if(action==='notice-action'){const n=notifications.find(x=>x.id===id)||noticeCurrent;closeModal();if(n?.type==='invite'){joinType='invite';joinSubmitted=false;joinShares=1;joinAck=false;go('018')}else{activeGroup=groupFixtures[0];go('021')}return}
 if(action==='expand'){if(expanded.has(id))expanded.delete(id);else expanded.add(id);render();return}
 if(action==='collect-start'){confirmCollectId=id;expanded.add(id);render();return}
 if(action==='collect-cancel'){confirmCollectId=null;render();return}
 if(action==='collect-confirm'){confirmCollectId=null;render();showToast('تم تحديث حالة التحصيل');return}
 if(action==='remind'){openModal('تذكير بالقسط',`إرسال تذكير بالقسط إلى العضو؟${collectionRecords.find(x=>x.id===id)?.reminded?'<p class="small-note">سبق إرسال تذكير لهذا العضو.</p>':''}`,`<button class="btn secondary" data-action="modal-close">إلغاء</button><button class="btn primary" data-action="remind-confirm">تأكيد</button>`);return}
 if(action==='remind-confirm'){closeModal();showToast('تم إرسال التذكير');return}
});

document.addEventListener('input',e=>{
 const t=e.target;
 if(t.matches('[data-form-field]')){form[t.dataset.formField]=t.value;updateAssociationCalc()}
 if(t.id==='joinLink'){linkValue=t.value;setInvalid('joinLinkWrap',false)}
 if(t.id==='joinShares'){joinShares=Math.max(1,Number(t.value)||1);updateJoinCalc()}
 if(t.id==='regEmail')registration.email=t.value;if(t.id==='regPass')registration.pass=t.value;if(t.id==='regConfirm')registration.confirm=t.value;
 if(t.matches('[data-search-input],.list-search input'))filterVisible(t);
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='themeSelect'){theme=t.value==='dark'?'dark':'light';const a=document.getElementById('app');a.classList.toggle('dark',theme==='dark');showToast('تم تطبيق السمة محلياً');}
 if(t.id==='regTerms')registration.accepted=t.checked;
 if(t.id==='joinAck')joinAck=t.checked;
 if(t.matches('[data-contact-check]')){const cid=t.dataset.contactCheck;if(t.checked&&!selectedContacts.includes(cid))selectedContacts.push(cid);if(!t.checked)selectedContacts=selectedContacts.filter(x=>x!==cid)}
 if(t.matches('[data-list-filter]'))applyListFilters();
});
document.getElementById('indexSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.index-item').forEach(el=>el.style.display=(el.textContent+' '+el.dataset.id).toLowerCase().includes(q)?'':'none');document.querySelectorAll('.index-section').forEach(section=>{let next=section.nextElementSibling,show=false;while(next&&!next.classList.contains('index-section')){if(next.style.display!=='none')show=true;next=next.nextElementSibling}section.style.display=show?'':'none'})});
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.id==='modalRoot')closeModal()});

render();
if(current==='001')setTimeout(()=>{if(current==='001'){go('002');showToast('مرحباً بك في سهم')}} ,1450);
</script>
