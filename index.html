/* Administrative lottery wheel */
.room-screen-body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:16px 14px 22px;overflow-y:auto}
.room-wheel-heading{text-align:center;margin:0}
.room-wheel-heading h2{font-size:20px;line-height:1.4;font-weight:900;margin:0;color:var(--ink)}
.room-wheel-shell{position:relative;width:min(82vw,360px);max-width:100%;aspect-ratio:1;display:grid;place-items:center;margin:4px auto 0;filter:drop-shadow(0 15px 20px rgba(19,45,78,.20))}
.room-wheel-rotor{width:100%;height:100%;border-radius:50%;transform:rotate(0deg);will-change:transform;overflow:hidden;border:8px solid #f8fafc;box-shadow:0 0 0 2px rgba(40,86,165,.30),inset 0 0 0 2px rgba(255,255,255,.58);background:#2856a5}
.room-wheel-rotor svg{display:block;width:100%;height:100%;overflow:visible}
.room-wheel-rotor .wheel-sector{stroke:rgba(255,255,255,.94);stroke-width:2}
.room-wheel-rotor .wheel-name{font-family:var(--font-ui);font-weight:850;fill:#fff;paint-order:stroke;stroke:rgba(15,35,65,.34);stroke-width:1.7px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle}
.room-wheel-rotor .wheel-center{fill:#fff;stroke:#d5e0ed;stroke-width:4}
.room-wheel-rotor .wheel-center-label{font-family:var(--font-ui);font-size:16px;font-weight:950;fill:#2856a5;text-anchor:middle;dominant-baseline:middle}
.room-wheel-pointer{position:absolute;z-index:3;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid #b1813b;filter:drop-shadow(0 3px 3px rgba(35,42,52,.28))}
.room-wheel-count{font-size:12px;color:var(--muted);font-weight:750;text-align:center}
.room-session-panel{width:min(100%,430px);display:flex;flex-direction:column;gap:12px;margin:2px auto 0}
.room-session-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.room-session-title{font-size:14px;font-weight:900;color:var(--ink)}
.room-session-hint{font-size:10px;color:var(--muted);line-height:1.65;margin-top:3px}
.room-attendance-card{width:100%;border:1px solid var(--line);border-radius:15px;background:var(--paper);padding:12px 13px;box-shadow:var(--shadow-card)}
.room-attendance-summary{display:flex;align-items:center;justify-content:space-between;gap:10px}
.room-attendance-number{display:flex;align-items:center;gap:9px}
.room-attendance-number strong{font-size:22px;line-height:1;color:var(--blue);font-weight:950}
.room-attendance-number span{font-size:11px;color:var(--muted);font-weight:750}
.room-attendee-list{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.room-attendee-row{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;background:var(--surface-2);font-size:12px}
.room-attendee-row .room-person-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--soft-blue);color:var(--blue)}
.room-attendee-row .room-person-name{flex:1;font-weight:800}
.room-attendee-row .room-person-state{font-size:10px;color:var(--success);font-weight:800}
.room-attendee-row button{border:1px solid var(--line-2);border-radius:8px;background:var(--paper);color:var(--blue);font-size:10px;font-weight:800;padding:6px 8px}
.room-invite-list{display:flex;flex-direction:column;gap:7px;max-height:48vh;overflow:auto}
.room-invite-option{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--paper)}
.room-invite-option input{width:17px;height:17px;accent-color:var(--blue)}
.room-invite-option strong{font-size:12px}
.room-invite-option small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.room-wheel-spin{width:min(100%,310px);min-height:52px;border-radius:15px;font-size:15px;font-weight:850;letter-spacing:.1px;box-shadow:0 6px 15px rgba(40,86,165,.20)}
.room-wheel-spin:disabled{opacity:.72;cursor:default}
.lottery-winner-modal{position:relative;overflow:hidden;text-align:center;border:1px solid rgba(190,151,77,.36);box-shadow:0 22px 65px rgba(10,25,48,.28)}
.lottery-celebration{position:relative;isolation:isolate;overflow:hidden;padding:15px 8px 8px;text-align:center}
.lottery-confetti{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.lottery-confetti i{position:absolute;top:-18px;left:calc(var(--i) * 2.9%);width:7px;height:12px;border-radius:2px;background:#bd8b43;opacity:0;animation:lottery-confetti-fall 2.8s ease-out var(--delay) forwards;transform:rotate(var(--rot))}
.lottery-confetti i:nth-child(3n){background:#3158a5}
.lottery-confetti i:nth-child(3n + 1){background:#d4ad68}
.lottery-confetti i:nth-child(4n){background:#7d9cc9;width:5px;height:8px}
.lottery-winner-medal{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f5e4bd,#d3a65d);color:#704d1b;box-shadow:0 8px 22px rgba(174,130,57,.25),inset 0 2px 0 rgba(255,255,255,.8)}
.lottery-winner-medal svg{width:36px;height:36px;stroke-width:1.9}
.lottery-winner-caption{font-size:13px;font-weight:750;color:var(--muted);margin:0 0 7px}
.lottery-winner-name{font-size:23px;line-height:1.45;font-weight:950;color:var(--ink);overflow-wrap:anywhere;margin:0}
.lottery-winner-subtitle{font-size:12px;line-height:1.7;color:var(--muted);margin:9px 0 0}
@keyframes lottery-confetti-fall{0%{opacity:0;transform:translate3d(0,-12px,0) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate3d(20px,330px,0) rotate(620deg)}}
.app.dark .room-wheel-rotor{border-color:#dbe4ed;box-shadow:0 0 0 2px rgba(129,164,211,.38),inset 0 0 0 2px rgba(255,255,255,.5)}
.app.dark .lottery-winner-modal{background:#172635;border-color:#765d36}
.app.dark .lottery-winner-name{color:#f1f5fa}

}function setCarouselSlide(index){
 const track=document.getElementById('summaryTrack');
 if(!track)return;
 const slides=Array.from(track.querySelectorAll('.summary-slide'));
 if(!slides.length)return;
 carouselIndex=(index%slides.length+slides.length)%slides.length;
 slides.forEach((slide,i)=>{const active=i===carouselIndex;slide.classList.toggle('active',active);slide.setAttribute('aria-hidden',String(!active))});
 const carousel=track.closest('.summary-carousel');
 if(carousel)carousel.querySelectorAll('.carousel-dot').forEach((dot,i)=>{dot.classList.toggle('active',i===carouselIndex);dot.setAttribute('aria-pressed',String(i===carouselIndex))});
}

<script>
(() => {
  const buildMeta = document.querySelector('meta[name="sahm-build"]');
  const notice = document.getElementById('updateNotice');
  const updateButton = document.getElementById('updateAppButton');
  const laterButton = document.getElementById('laterAppButton');
  if (!buildMeta || !notice || !updateButton || !laterButton) return;

  const currentBuild = buildMeta.content;
  let checkTimer = null;
  let checking = false;
  let updateFound = false;

  async function checkForPublishedUpdate() {
    if (checking || updateFound || document.visibilityState === 'hidden') return;
    checking = true;
    try {
      const response = await fetch('./index.html?__sahm_update_check=' + Date.now(), {
        method: 'GET',
        cache: 'no-store',
        credentials: 'same-origin'
      });
      if (!response.ok) return;
      const html = await response.text();
      const match = html.match(/<meta\s+name=["']sahm-build["']\s+content=["']([^"']+)["']/i);
      if (match && match[1] !== currentBuild) {
        updateFound = true;
        clearInterval(checkTimer);
        notice.classList.add('visible');
      }
    } catch (_) {
      // Keep the current app usable when the connection is unavailable.
    } finally {
      checking = false;
    }
  }

  // Check immediately, then keep checking while the app remains open.
  checkForPublishedUpdate();
  checkTimer = setInterval(checkForPublishedUpdate, 5000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForPublishedUpdate();
  });

  laterButton.addEventListener('click', () => {
    notice.classList.remove('visible');
  });

  updateButton.addEventListener('click', () => {
    updateButton.disabled = true;
    updateButton.textContent = 'جارٍ التحديث...';
    window.location.reload();
  });
})();
</script>
