<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fb">
<title>سهم | إدارة الجمعيات</title>
<style>
:root{
  --ink:#10283f;--ink-2:#29445c;--muted:#78899a;--blue:#2856a5;--blue-2:#183f83;
  --gold:#9a6c25;--gold-2:#c2913f;--gold-pale:#f5eddf;--bg:#f3f7fa;--paper:#fff;
  --line:#e1e8ed;--line-2:#d5e0e7;--soft:#eef3f7;--soft-blue:#eaf1f8;
  --shadow:0 10px 28px rgba(24,49,73,.08),0 2px 7px rgba(24,49,73,.045);
  --shadow-gold:0 15px 30px rgba(115,79,25,.22),0 3px 8px rgba(87,64,27,.13);
  --danger:#b94b4b;--danger-soft:#fff0ef;--success:#38765e;--success-soft:#eaf5ef;
  --radius:19px;--radius-sm:13px;--radius-xs:10px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif;color:var(--ink);background:#eaf0f4}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.48}
.preview-shell{min-height:100vh;display:grid;grid-template-columns:304px minmax(0,1fr);gap:22px;padding:20px;max-width:1480px;margin:auto}
.inspector{background:#fff;border:1px solid #e0e7ed;border-radius:22px;box-shadow:0 8px 30px rgba(23,48,72,.06);display:flex;flex-direction:column;min-height:calc(100vh - 40px);max-height:calc(100vh - 40px);overflow:hidden}
.inspector-head{padding:20px 18px 15px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfcfd)}
.brand-line{display:flex;align-items:center;gap:11px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#173e7b,#2f62b3);color:#fff;display:grid;place-items:center;box-shadow:0 5px 12px #244d872c}
.brand-mark svg{width:21px;height:21px}
.brand-title{font-size:18px;font-weight:900;letter-spacing:.1px}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.preview-state{margin-top:15px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.preview-pill{font-size:10px;font-weight:800;border:1px solid #d9e3eb;border-radius:30px;padding:5px 9px;background:#f7fafc;color:#536b7e}
.preview-pill.warn{border-color:#ead9ba;background:#faf4e9;color:#866022}
.summary-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}
.summary-count{border:1px solid var(--line);border-radius:11px;padding:8px 5px;text-align:center;background:#fbfcfd}
.summary-count strong{font-size:16px;display:block;line-height:1.3}
.summary-count span{font-size:9px;color:var(--muted)}
.index-tools{padding:12px 14px 9px;border-bottom:1px solid var(--line);background:#fcfdfe}
.search-index{width:100%;height:39px;border:1px solid var(--line-2);border-radius:11px;background:#f7fafc;padding:0 12px;color:var(--ink);outline:none;font-size:12px}
.search-index:focus{border-color:#9eb7d5;box-shadow:0 0 0 3px #dbe7f4}
.index-scroll{overflow:auto;padding:8px 10px 14px;flex:1}
.index-section{margin:10px 4px 7px;font-size:10px;font-weight:900;color:#8a9aa9;letter-spacing:.2px}
.index-item{display:flex;align-items:center;gap:9px;width:100%;text-align:right;border:1px solid transparent;background:transparent;padding:8px 8px;border-radius:11px;color:var(--ink);margin:2px 0;min-height:42px}
.index-item:hover{background:#f5f8fb}
.index-item.active{background:#edf3fa;border-color:#d9e5f0}
.index-item.retired{opacity:.48;cursor:not-allowed;text-decoration:line-through}
.index-num{width:30px;height:27px;display:grid;place-items:center;border-radius:8px;background:#f1f5f8;color:#52697c;font-size:10px;font-weight:900;flex-shrink:0;direction:ltr}
.index-item.active .index-num{background:#dce8f6;color:#1e4d91}
.index-name{font-size:11px;font-weight:700;line-height:1.5;flex:1}
.index-status{font-size:9px;color:#8a9aa8;white-space:nowrap}
.index-status.a{color:#27609e}.index-status.p{color:#96712e}
.index-foot{border-top:1px solid var(--line);padding:12px 14px;font-size:10px;color:#718395;line-height:1.7;background:#fbfcfd}
.index-foot strong{color:#3b566e}
.demo-actions{display:flex;gap:6px;margin-top:8px}
.demo-actions button{flex:1;border:1px solid #dce5ec;background:#fff;border-radius:9px;padding:7px 5px;font-size:10px;color:#38536b}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;min-width:0}
.stage-head{width:min(100%,560px);display:flex;align-items:center;justify-content:space-between;padding:1px 4px;color:#667b8d;font-size:11px}
.stage-head strong{font-size:13px;color:#233e56}
.stage-badges{display:flex;gap:6px;align-items:center}
.stage-badge{padding:5px 9px;background:#fff;border:1px solid #dfe7ed;border-radius:30px;font-size:10px;color:#667b8d}
.stage-badge.partial{background:#fbf5e9;border-color:#ead9b8;color:#8a662c}
.device-frame{width:min(100%,470px);height:min(890px,calc(100vh - 112px));min-height:650px;background:#fff;border:7px solid #dce4ea;border-radius:34px;box-shadow:0 22px 60px rgba(19,45,68,.17),0 2px 8px rgba(19,45,68,.06);overflow:hidden;position:relative}
.app{height:100%;width:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative}
.app.dark{--ink:#edf3f9;--ink-2:#c4d0dc;--muted:#94a3b2;--bg:#101b27;--paper:#172533;--line:#2b3b4a;--line-2:#34495b;--soft:#1d2c3b;--soft-blue:#1d344b;--gold-pale:#3e3424;--shadow:0 12px 28px rgba(0,0,0,.25);}
.app.dark .app-top,.app.dark .bottom-nav{background:#142230;border-color:#293948}
.app.dark .card,.app.dark .form-card,.app.dark .info-card,.app.dark .record-card,.app.dark .list-row,.app.dark .tile,.app.dark .section-box,.app.dark .modal-card{background:var(--paper);border-color:var(--line)}
.app.dark input,.app.dark select,.app.dark textarea{background:#101d2a;color:var(--ink);border-color:#35485a}
.app-top{height:auto;min-height:64px;background:var(--paper);border-bottom:1px solid #e8edf1;display:flex;align-items:center;padding:11px 18px;gap:12px;flex-shrink:0;z-index:2}
.app-top.home-top{height:67px;justify-content:space-between;padding:0 21px}
.top-actions{display:flex;align-items:center;gap:20px}
.icon-btn{border:0;background:transparent;color:var(--blue);padding:4px;display:grid;place-items:center;position:relative}
.icon-btn svg{width:28px;height:28px}
.icon-btn .notice-dot{position:absolute;top:1px;right:1px;width:7px;height:7px;background:#d65352;border-radius:50%;border:1px solid #fff}
.top-back{width:38px;height:38px;border:0;background:transparent;color:var(--blue);display:grid;place-items:center;flex-shrink:0}
.top-back svg{width:24px;height:24px}
.top-title{font-size:16px;font-weight:900;line-height:1.35;flex:1}
.connection-strip{background:#fff6e9;color:#8a6327;padding:7px 14px;font-size:11px;display:flex;align-items:center;gap:7px;border-bottom:1px solid #ead8b7;flex-shrink:0}
.connection-strip svg{width:16px;height:16px}
.screen-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:17px 17px 24px;scrollbar-width:thin;scrollbar-color:#cad5df transparent}
.screen-body.no-pad{padding:0}
.bottom-nav{height:73px;flex-shrink:0;border-top:1px solid #e5ebef;background:#fff;display:flex;align-items:stretch;justify-content:space-around;padding:7px 11px max(7px,env(safe-area-inset-bottom));z-index:3}
.bottom-item{border:0;background:transparent;color:#8796a3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:84px;font-size:11px;font-weight:700;padding:1px 8px}
.bottom-item svg{width:25px;height:25px;stroke-width:1.9}
.bottom-item.active{color:var(--blue);font-weight:900}
.bottom-item.active svg{stroke-width:2.25}
.mock-label{position:absolute;top:74px;left:12px;z-index:3;pointer-events:none;font-size:9px;color:#59718a;background:#fffdf3d9;border:1px solid #eadfca;padding:4px 7px;border-radius:20px;opacity:.92}
.app:not(.has-top) .mock-label{top:12px}
/* common components */
.page-intro{margin:2px 0 16px}
.page-intro h2{font-size:20px;margin:0 0 5px;font-weight:900}
.page-intro p{font-size:12px;color:var(--muted);margin:0;line-height:1.8}
.card,.form-card,.info-card,.section-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.form-card{padding:17px;margin-bottom:14px}
.info-card{padding:15px;margin-bottom:12px}
.section-box{padding:15px;margin-bottom:13px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 1px 12px}
.section-head h3{font-size:17px;font-weight:900;margin:0}
.section-title-wrap{display:flex;align-items:center;gap:9px}
.section-head svg{width:23px;height:23px;color:var(--blue)}
.section-sub{font-size:10px;color:var(--muted);font-weight:500}
.field{margin:0 0 14px;min-width:0}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;font-weight:800;color:var(--ink-2);margin:0 0 7px}
.field input,.field select,.field textarea,.filter-select{width:100%;height:43px;border:1px solid var(--line-2);border-radius:11px;background:#fbfcfd;color:var(--ink);padding:0 12px;outline:none;font-size:13px;min-width:0}
.field textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#9bb5d4;box-shadow:0 0 0 3px #dbe7f4}
.field .hint{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.7}
.field .error{font-size:10px;color:var(--danger);margin-top:5px;display:none}
.field.invalid input,.field.invalid select{border-color:#c96969;background:#fffafa}
.field.invalid .error{display:block}
.row-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-row{display:flex;align-items:center;gap:9px}
.field-row>*{min-width:0}
.btn{border:1px solid transparent;border-radius:12px;min-height:43px;padding:10px 15px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s ease;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 5px 12px #224d9027}
.btn.primary:hover{background:var(--blue-2)}
.btn.gold{background:linear-gradient(135deg,#9b6c27,#c08f3d);color:#fff;box-shadow:0 5px 12px #9265232b}
.btn.secondary{background:#f3f7fa;border-color:#dce5eb;color:#39556c}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink-2)}
.btn.danger{background:#fff2f1;border-color:#f1d8d6;color:#a84646}
.btn.block{width:100%}
.btn.small{min-height:34px;padding:6px 11px;font-size:11px;border-radius:9px}
.text-link{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:800;padding:7px 4px}
.helper-links{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:0 3px}
.muted{color:var(--muted)}
.small-note{font-size:10px;line-height:1.75;color:var(--muted)}
.inline-note{background:#f6f9fb;border:1px solid #e5edf2;border-radius:11px;padding:10px 12px;font-size:11px;color:#62788a;line-height:1.8}
.unresolved{border:1px dashed #d7c39e;background:#fcf8ef;color:#84652f;border-radius:11px;padding:10px 11px;font-size:11px;line-height:1.75}
.status{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;border-radius:25px;padding:5px 9px;background:#f0f4f7;color:#65798a;white-space:nowrap}
.status.blue{background:#edf3fa;color:#2b5a96}.status.gold{background:#f8f1e5;color:#8d672d}.status.green{background:#eaf4ee;color:#39735c}.status.red{background:#fff0ef;color:#ad4f4a}
.list-search{position:relative;margin-bottom:13px}
.list-search input{width:100%;height:42px;border:1px solid var(--line-2);border-radius:11px;padding:0 42px 0 12px;background:#fff;color:var(--ink);outline:none;font-size:12px}
.list-search svg{position:absolute;right:13px;top:11px;width:19px;height:19px;color:#8497a8}
.list-stack{display:flex;flex-direction:column;gap:9px}
.list-row{background:#fff;border:1px solid var(--line);border-radius:14px;min-height:64px;display:flex;align-items:center;gap:11px;padding:12px 13px;box-shadow:0 3px 10px rgba(23,46,68,.035);color:var(--ink);width:100%;text-align:right}
.list-row .row-icon{width:32px;height:32px;flex-shrink:0;display:grid;place-items:center;color:var(--blue)}
.list-row .row-icon.gold{color:var(--gold)}
.list-row .row-icon svg{width:26px;height:26px}
.list-row .row-main{flex:1;min-width:0}
.list-row .row-title{font-size:13px;font-weight:850;line-height:1.5}
.list-row .row-meta{font-size:10px;color:var(--muted);margin-top:3px}
.list-row .row-arrow{width:17px;height:17px;color:#71879b;flex-shrink:0}
.tile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;min-height:144px;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:15px 12px 22px;text-align:center;color:var(--ink);width:100%}
.tile:hover{transform:translateY(-1px);box-shadow:0 13px 24px rgba(20,48,74,.1)}
.tile .tile-icon{display:grid;place-items:center;height:42px;color:var(--blue)}
.tile .tile-icon.gold{color:var(--gold)}
.tile .tile-icon svg{width:43px;height:43px;stroke-width:1.9}
.tile .tile-label{font-size:15px;font-weight:900;line-height:1.55}
.tile .tile-arrow{position:absolute;left:13px;bottom:10px;background:#eef4f8;color:#506e89;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.tile .tile-arrow svg{width:17px;height:17px}
.empty-state{border:1px dashed #d6e0e7;border-radius:15px;padding:25px 14px;text-align:center;color:#7c8d9b;background:#fbfcfd;font-size:12px;line-height:1.8}
.empty-state svg{width:29px;height:29px;color:#9aabba;margin-bottom:8px}
.kv-list{display:flex;flex-direction:column}
.kv-row{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;padding:11px 1px;border-bottom:1px solid var(--line);font-size:12px}
.kv-row:last-child{border-bottom:0}
.kv-row .k{color:var(--muted);font-weight:650}
.kv-row .v{font-weight:800;text-align:left;max-width:60%;overflow-wrap:anywhere}
.pill-tabs{display:flex;gap:6px;background:#eef3f6;padding:4px;border-radius:11px;margin-bottom:14px}
.pill-tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;color:#6e8293;font-size:11px;font-weight:800}
.pill-tabs button.active{background:#fff;color:var(--blue);box-shadow:0 1px 4px #1c3c5a18}
.filter-row{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:0 0 11px;margin-bottom:4px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-select{width:auto;min-width:110px;height:36px;padding:0 9px;font-size:10px;border-radius:10px;flex-shrink:0;background:#fff}
.record-section-title{font-size:13px;font-weight:900;margin:16px 2px 9px;display:flex;align-items:center;justify-content:space-between}
.record-card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 4px 13px rgba(18,42,64,.045);overflow:hidden;margin-bottom:9px}
.record-summary{width:100%;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;gap:11px;padding:13px 13px;text-align:right;min-height:65px}
.record-symbol{width:30px;height:30px;display:grid;place-items:center;flex-shrink:0;color:var(--blue)}
.record-symbol svg{width:24px;height:24px}
.record-title{font-size:12px;font-weight:900;line-height:1.5}
.record-subtitle{font-size:10px;color:var(--muted);margin-top:3px}
.record-value{margin-right:auto;font-size:12px;font-weight:900;white-space:nowrap;text-align:left}
.record-chevron{width:17px;height:17px;color:#8b9aaa;flex-shrink:0;transition:transform .18s}
.record-card.open .record-chevron{transform:rotate(180deg)}
.record-details{border-top:1px solid var(--line);padding:12px 13px 14px;background:#fcfdfe}
.record-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.record-actions .btn{flex:1}
.progress-line{height:7px;border-radius:20px;background:#e8eef2;overflow:hidden;margin-top:7px}
.progress-line span{height:100%;display:block;background:linear-gradient(90deg,#2856a5,#6791c7);border-radius:20px}
/* home */
.home-body{padding:17px 17px 26px}
.summary-carousel{position:relative;margin-bottom:12px}
.summary-window{overflow:hidden;border-radius:21px}
.summary-track{display:flex;direction:rtl;transition:transform .3s ease;touch-action:pan-y}
.summary-slide{min-width:100%;height:148px;border-radius:21px;position:relative;padding:26px 24px;background:linear-gradient(118deg,#73501d 0%,#9c6b27 46%,#c18a37 100%);box-shadow:var(--shadow-gold);color:#fff;display:flex;align-items:center;justify-content:space-between;overflow:hidden}
.summary-slide:before{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff25;border-radius:50%;left:-75px;top:-128px}
.summary-slide:after{content:"";position:absolute;width:160px;height:160px;border:1px solid #ffffff19;border-radius:50%;left:5px;bottom:-122px}
.summary-info{display:flex;align-items:center;gap:13px;z-index:1}
.summary-symbol svg{width:42px;height:42px;stroke-width:1.8}
.summary-title{font-size:18px;font-weight:900;line-height:1.4;text-shadow:0 1px 3px #3e2b145e}
.summary-number{font-size:32px;line-height:1.15;font-weight:950;margin-top:5px}
.summary-index{position:absolute;left:23px;bottom:19px;font-size:13px;letter-spacing:1.5px;font-weight:800;color:#ffffffd9;direction:ltr}
.carousel-controls{height:27px;display:flex;align-items:center;justify-content:center;gap:8px}
.carousel-dot{width:9px;height:9px;border-radius:20px;border:0;background:#b7c7d4;padding:0;transition:.2s}
.carousel-dot.active{width:34px;background:#2b5aa7;box-shadow:0 2px 5px #1b4c9838}
.home-tiles{margin-top:13px}
.home-section{border-top:1px solid #e1e8ed;margin-top:28px;padding-top:20px}
.home-section .section-head{margin:4px 2px 14px}
.home-section .section-head h3{font-size:20px}
.activity-list{display:flex;flex-direction:column;gap:8px}
.activity-item{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;text-align:right;width:100%;color:var(--ink)}
.activity-icon{width:30px;height:30px;color:var(--blue);display:grid;place-items:center;flex-shrink:0}
.activity-icon svg{width:23px;height:23px}
.activity-copy{flex:1;min-width:0}
.activity-copy strong{display:block;font-size:11px;line-height:1.6}
.activity-copy span{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.activity-time{font-size:9px;color:#8b9aa6;white-space:nowrap}
/* auth */
.auth-body{display:flex;flex-direction:column;justify-content:center;padding:24px 21px 26px;background:linear-gradient(180deg,#f7f9fb,#edf3f7)}
.auth-heading{text-align:center;font-size:23px;font-weight:900;margin:0 0 18px}
.auth-card{padding:20px 18px 17px;border-radius:20px;box-shadow:0 14px 35px rgba(26,55,80,.09);background:#fff;border:1px solid #e0e8ee}
.auth-card .btn{margin-top:4px}
.auth-card .btn+.btn{margin-top:8px}
.auth-note{text-align:center;color:#728597;font-size:11px;margin-top:15px}
.auth-description{text-align:center;font-size:12px;color:#7a8a99;margin:-8px 0 18px;line-height:1.8}
.country-code{width:57px;height:43px;border:1px solid var(--line-2);border-radius:11px;background:#f7fafc;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.icon-chooser{display:flex;gap:8px;overflow:auto;padding:5px 1px 10px}
.avatar-option{min-width:43px;height:43px;border-radius:12px;border:1px solid #dce5ec;background:#f8fafc;color:#6b8091;display:grid;place-items:center}
.avatar-option svg{width:23px;height:23px}
.avatar-option.active{border-color:#9db8d8;background:#eaf1f9;color:#22539b}
/* notices and modal */

 if(action==='logout-open'){openModal('تسجيل الخروج','هل تريد إنهاء الجلسة الحالية؟ لا يؤدي ذلك إلى حذف أي بيانات أو تفضيلات.','<button class="btn secondary" data-action="modal-close">إلغاء</button><button class="btn danger" data-action="logout-confirm">تسجيل الخروج</button>');return}
 if(action==='logout-confirm'){closeModal();historyStack=[];go('002');showToast('تم تسجيل الخروج');return}
 if(action==='install-mode'){form.mode=value;previewOpen=false;render();return}
 if(action==='manager-role'){form.managerRole=value;render();return}
 if(action==='toggle-preview'){previewOpen=!previewOpen;updateAssociationCalc();return}
 if(action==='create-group'){submitCreateGroup();return}
 if(action==='copy-link'){copyText('https://sahm.app/join/SAHM-2481','رابط الانضمام');return}
 if(action==='share-link'){openModal('مشاركة رابط الانضمام',`<div class="inline-note" dir="ltr" style="text-align:left">https://sahm.app/join/SAHM-2481</div><p></p>`,`<button class="btn secondary" data-action="modal-close">إغلاق</button><button class="btn primary" data-action="copy-link">نسخ النص</button>`);return}
 if(action==='contacts-picker'){openContactsPicker();return}
 if(action==='contacts-confirm'){renderContactRows();if(!contactRecords.length){showToast('اختر جهة اتصال واحدة على الأقل');return}closeModal();go('040');return}
 if(action==='contact-invite'){openModal('دعوة للجمعية','','<button class="btn secondary" data-action="modal-close">إغلاق</button><button class="btn primary" data-action="modal-close">مفهوم</button>');return}
 if(action==='contact-share'){openModal('دعوة للتثبيت','','<button class="btn primary" data-action="modal-close">إغلاق</button>');return}
 if(action==='verify-link'){
   const raw=document.getElementById('joinLink')?.value.trim()||'';linkValue=raw;let valid=false;try{const u=new URL(raw);valid=u.protocol==='https:'&&!!u.hostname}catch{}setInvalid('joinLinkWrap',!valid);if(!valid){showToast('أدخل رابطاً عاماً بصيغة HTTPS صحيحة');return}if(!online){showToast('التحقق يتطلب الاتصال بالإنترنت');return}joinShares=1;joinAck=false;joinSubmitted=false;joinType='public';go('017');showToast('تم التحقق من الرابط');return;
 }
 if(action==='send-join'){
   const n=Number(document.getElementById('joinShares')?.value||joinShares);joinShares=n;setInvalid('joinSharesWrap',!Number.isInteger(n)||n<1);joinAck=!!document.getElementById('joinAck')?.checked;
   if(!Number.isInteger(n)||n<1||!joinAck){showToast('حدد عدد الأسهم وأكد الاطلاع على الالتزامات');return}if(!online){showToast('إرسال طلب الانضمام يتطلب الاتصال بالإنترنت');return}joinSubmitted=true;render();showToast('تم إرسال طلب الانضمام');return;
 }
 if(action==='notice-open'){
   noticeCurrent=notifications.find(n=>n.id===id)||notifications[0];noticeCurrent.read=true;render();const n=noticeCurrent;const cta=n.type==='invite'?`<button class="btn primary" data-action="notice-action" data-id="${n.id}">تفاصيل الدعوة ومتابعة الطلب</button>`:`<button class="btn primary" data-action="notice-action" data-id="${n.id}">فتح الوجهة المرتبطة</button>`;openModal('تفاصيل الإشعار',`<div class="row-icon-box" style="margin-bottom:12px">${icon(n.type==='invite'?'gift':'activity')}<strong>${esc(n.title)}</strong></div><div class="small-note">${esc(n.group)} · ${esc(n.time)} · مقروء</div><p>${esc(n.body)}</p>`,n.type==='invite'?`<button class="btn secondary" data-action="modal-close">إغلاق</button>${cta}`:`<button class="btn secondary" data-action="modal-close">إغلاق</button>${cta}`);return;
 }
 if(action==='notice-action'){const n=notifications.find(x=>x.id===id)||noticeCurrent;closeModal();if(n?.type==='invite'){joinType='invite';joinSubmitted=false;joinShares=1;joinAck=false;go('018')}else{activeGroup=groupFixtures[0];go('021')}return}
 if(action==='expand'){if(expanded.has(id))expanded.delete(id);else expanded.add(id);render();return}
 if(action==='collect-start'){confirmCollectId=id;expanded.add(id);render();return}
 if(action==='collect-cancel'){confirmCollectId=null;render();return}
 if(action==='collect-confirm'){confirmCollectId=null;render();showToast('تم تحديث حالة التحصيل');return}
 if(action==='remind'){openModal('تذكير بالقسط',`إرسال تذكير بالقسط إلى العضو؟${collectionRecords.find(x=>x.id===id)?.reminded?'<p class="small-note">سبق إرسال تذكير لهذا العضو.</p>':''}`,`<button class="btn secondary" data-action="modal-close">إلغاء</button><button class="btn primary" data-action="remind-confirm">تأكيد</button>`);return}
 if(action==='remind-confirm'){closeModal();showToast('تم إرسال التذكير');return}
});

document.addEventListener('input',e=>{
 const t=e.target;
 if(t.matches('[data-form-field]')){form[t.dataset.formField]=t.value;updateAssociationCalc()}
 if(t.id==='joinLink'){linkValue=t.value;setInvalid('joinLinkWrap',false)}
 if(t.id==='joinShares'){joinShares=Math.max(1,Number(t.value)||1);updateJoinCalc()}
 if(t.id==='regEmail')registration.email=t.value;if(t.id==='regPass')registration.pass=t.value;if(t.id==='regConfirm')registration.confirm=t.value;
 if(t.matches('[data-search-input],.list-search input'))filterVisible(t);
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='themeSelect'){theme=t.value==='dark'?'dark':'light';const a=document.getElementById('app');a.classList.toggle('dark',theme==='dark');showToast('تم تطبيق السمة محلياً');}
 if(t.id==='regTerms')registration.accepted=t.checked;
 if(t.id==='joinAck')joinAck=t.checked;
 if(t.matches('[data-contact-check]')){const cid=t.dataset.contactCheck;if(t.checked&&!selectedContacts.includes(cid))selectedContacts.push(cid);if(!t.checked)selectedContacts=selectedContacts.filter(x=>x!==cid)}
 if(t.matches('[data-list-filter]'))applyListFilters();
});
document.getElementById('indexSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.index-item').forEach(el=>el.style.display=(el.textContent+' '+el.dataset.id).toLowerCase().includes(q)?'':'none');document.querySelectorAll('.index-section').forEach(section=>{let next=section.nextElementSibling,show=false;while(next&&!next.classList.contains('index-section')){if(next.style.display!=='none')show=true;next=next.nextElementSibling}section.style.display=show?'':'none'})});
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.id==='modalRoot')closeModal()});
document.getElementById('brandMark').innerHTML=icon('users');document.getElementById('menuIcon').innerHTML=icon('menu');
render();
if(current==='001')setTimeout(()=>{if(current==='001'){go('002');showToast('مرحباً بك في سهم')}} ,1450);
</script>
