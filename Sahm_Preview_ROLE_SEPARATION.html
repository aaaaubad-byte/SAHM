.invitee-choice{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer}
.invitee-choice>input[type=checkbox]{width:19px;height:19px;flex:0 0 19px;accent-color:var(--teal)}
.invitee-details{display:block;min-width:0;flex:1}
.invitee-name{width:100%;min-width:0;border:0!important;background:transparent!important;color:var(--ink);font:inherit;font-weight:700;padding:2px 0;outline:none}
.invitee-name:focus{box-shadow:inset 0 -1px var(--teal)}
.invitee-details small{direction:ltr;text-align:right;overflow-wrap:anywhere}
.invitee-result-actions{display:flex;gap:6px;flex:none}
.invitee-result-actions .btn{min-width:48px;padding-inline:8px}
.invitee-link{direction:ltr;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis}

@media(max-width:370px){.invitee-row{flex-wrap:wrap}.invitee-result-actions{margin-inline-start:auto}}


/* Application shell — one source of truth for sizing and scroll ownership. */
html,
body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
}
.workspace {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--bg);
}
.phone,
#app.phone {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  width: 100%;
  max-width: none;
  height: auto;
  max-height: none;
  margin: 0;
  position: relative;
  overflow: hidden;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  background: var(--bg);
}
#topbar.topbar {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  min-width: 0;
  min-height: 56px;
  padding: 0 18px;
  box-sizing: border-box;
  position: relative;
  z-index: 30;
  background: #fff;
  color: var(--ink);
  border: 0;
  border-bottom: 1px solid var(--line);
  box-shadow: none;
}
#topbar[hidden] {
  display: none !important;
}
#screen.screen,
#screen.auth-screen {
  display: block;
  flex: 1 1 0%;
  min-width: 0;
  min-height: 0;
  width: 100%;
  height: auto;
  max-height: none;
  box-sizing: border-box;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
}
#screen.screen {
  padding: 15px;
  scrollbar-width: thin;
  scrollbar-color: #cad3e1 transparent;
}
#screen.screen::-webkit-scrollbar { width: 3px; }
#screen.screen::-webkit-scrollbar-thumb {
  background: #cad3e1;
  border-radius: var(--radius-small);
}
#screen.auth-screen { padding: 18px 16px; }
#screen.home-screen {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  gap: 0;
  min-width: 0;
  min-height: 0;
  height: auto;
  max-height: none;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  padding: 12px 15px 8px;
}
#screen.home-screen .latest-activity {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  max-height: none;
  overflow: visible;
  margin-top: 10px;
  padding: 12px 1px 8px;
  border-top: 1px solid var(--line);
}
#screen.home-screen .latest-activity h2 {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 7px;
  margin: 0 2px 9px;
  color: var(--ink);
  font-weight: 800;
}
#screen.home-screen .activity-list {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  min-height: 104px;
  height: clamp(104px, 28dvh, 210px);
  max-height: min(34dvh, 210px);
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  scrollbar-width: thin;
  scrollbar-color: #aebbd0 transparent;
  padding: 1px 3px 8px;
}
#screen.home-screen .activity-list::-webkit-scrollbar { width: 4px; }
#screen.home-screen .activity-list::-webkit-scrollbar-thumb {
  background: #aebbd0;
  border-radius: 8px;
}
#screen.home-screen .activity-card { flex: 0 0 auto; }
#bottomnav.bottomnav:not([hidden]) {
  display: flex !important;
  flex: 0 0 auto;
  align-self: stretch;
  align-items: stretch;
  justify-content: space-around;
  gap: 4px;
  width: 100%;
  height: auto;
  min-height: calc(64px + env(safe-area-inset-bottom, 0px));
  max-height: none;
  box-sizing: border-box;
  margin: 0;
  padding: 4px 12px calc(4px + env(safe-area-inset-bottom, 0px));
  position: relative;
  inset: auto;
  z-index: 60;
  overflow: visible;
  visibility: visible;
  opacity: 1;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
  background: #fff;
  box-shadow: 0 -4px 12px rgba(24,41,75,.035);
}
#bottomnav[hidden] { display: none !important; }
#bottomnav .navitem,
#bottomnav .navitem.active,
#bottomnav .navitem[aria-current="page"] {
  display: flex;
  flex: 1 1 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  min-height: 52px;
  height: auto;
  max-height: none;
  align-self: stretch;
  margin: 0;
  padding: 2px 0;
  border: 0;
  border-radius: 10px;
  background: transparent;
  box-shadow: none;
  color: #8793a6;
  font-weight: 600;
  transform: none;
}
#bottomnav .navitem.active,
#bottomnav .navitem[aria-current="page"] {
  color: var(--primary);
  background: transparent;
  font-weight: 800;
}
#bottomnav .navitem{-webkit-tap-highlight-color:transparent}
#bottomnav .navitem:focus,#bottomnav .navitem:focus-visible{outline:none;box-shadow:none}
#bottomnav .navitem .ni {
  display: grid;
  flex: 0 0 25px;
  place-items: center;
  width: 25px;
  height: 25px;
  padding: 0;
  line-height: 1;
  color: currentColor;
  background: transparent;
  border: 0;
  box-shadow: none;
  transform: none;
}
#bottomnav .navitem .ni svg {
  display: block;
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#bottomnav .navitem > span:last-child {
  display: block;
  line-height: 1.25;
  white-space: nowrap;
  color: inherit;
}
@media (max-width: 600px) {
  #topbar.topbar {
    min-height: calc(56px + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) 15px 0;
  }
  #screen.screen { padding: 14px 14px 16px; }
  #screen.home-screen { padding: 12px 14px 8px; }
  #bottomnav.bottomnav:not([hidden]) { padding-inline: 8px; }
}
@media (max-width: 360px) {
  #screen.home-screen { padding-inline: 12px; }
  #bottomnav.bottomnav:not([hidden]) { padding-inline: 5px; }
}

/* Association creation flow: built from the app's own card, field and button components. */
.cg-step[hidden],.cg-form [hidden]{display:none!important}
.cg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 4px}
.cg-head h3{margin:0;color:var(--ink);font-weight:800}
/* Association creation: single-page form, consistent home-style line icons and high-contrast fields. */
.cg-form .cg-section{margin:0 0 14px}
.cg-form .cg-section:last-of-type{margin-bottom:8px}
.cg-form .cg-head{justify-content:flex-start;gap:9px;margin:0 0 9px}
.cg-form .cg-head h3{font-size:15px;color:#111827;font-weight:800}
.cg-form .cg-section-icon{width:20px;height:20px;flex:0 0 20px;display:inline-flex;align-items:center;justify-content:center;color:var(--primary)}
.cg-form .cg-section-icon svg{width:20px;height:20px;display:block;stroke:currentColor;stroke-width:1.8;fill:none}
.cg-form .field{margin:9px 0}
.cg-form .field>label{margin:0 0 5px;color:#111827;font-size:14px;font-weight:750;line-height:1.4}
.cg-form .field input,.cg-form .field select{border:1.5px solid #344054;background:#fff;color:#111827;border-radius:var(--radius-control);min-height:43px;font-size:15px}
.cg-form .field input:focus,.cg-form .field select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(49,88,214,.14)}
.cg-form .cg-seg label{border:1.5px solid #344054;background:#fff;color:#111827;font-size:14px;font-weight:700}
.cg-form .cg-seg label:has(input:checked){border-color:var(--primary);background:var(--mint);color:var(--primary-dark)}
.cg-form #create-final-submit{margin-top:12px}

.cg-row{display:grid;grid-template-columns:58fr 42fr;gap:8px}
.cg-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 12px}
.cg-seg label{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius-control);background:#fafbfd;color:var(--ink2);font-weight:700;text-align:center;cursor:pointer}
.cg-seg input{position:absolute;opacity:0;pointer-events:none}
.cg-seg label:has(input:checked){border-color:var(--primary);background:var(--mint);color:var(--primary-dark)}
.cg-result{display:flex;flex-direction:column;gap:2px;margin:0 0 12px;padding:10px 12px;border-radius:var(--radius-control);background:var(--mint);color:var(--primary-dark)}
.cg-card>.btn{margin-top:14px}
.cg-card~.btn{margin-top:10px}
.cg-success{display:flex;flex-direction:column;align-items:center;margin-bottom:12px;text-align:center}
.cg-success-icon{display:grid;place-items:center;margin-bottom:8px;color:var(--primary)}
.cg-success-icon svg{width:58px;height:58px;stroke-width:1.5}
.cg-success h1{margin:0 0 2px;color:var(--ink);font-weight:800}
.cg-success strong{color:var(--ink2)}
.invitee-selection-bar{position:sticky;bottom:0;z-index:5;box-shadow:0 -5px 18px rgba(18,32,48,.06)}
/* Line-icon system: monoline glyphs, never inside bubbles. Inner screens only; home, top bar and bottom bar are excluded. */
#screen:not(.home-screen):not(.auth-screen) svg.ic,#modal-root svg.ic{flex:0 0 auto;stroke-width:1.75}
#screen:not(.home-screen):not(.auth-screen) svg.hd{width:20px;height:20px;color:var(--primary)}

#screen:not(.home-screen):not(.auth-screen) .avatar.dark{color:var(--ink)!important}

<style id="sahm-typography-system-6-sizes">

/* Approved typography: IBM Plex Sans Arabic for Arabic; DM Sans for Latin and numerals. */
#app{
  --sahm-font-page-title: 22px;
  --sahm-font-section-title: 18px;
  --sahm-font-card-title: 16px;
  --sahm-font-body: 15px;
  --sahm-font-secondary: 13px;
  --sahm-font-helper: 12px;
  font-family: 'IBM Plex Sans Arabic',sans-serif;
  font-size: var(--sahm-font-body) !important;
}
#app *:not(.ni):not(.brand-mark):not(.receipt-mark):not(.shortcut-arrow):not(.icon):not(.material-symbols-outlined):not(.manager-action-icon):not(.member-action-icon){
  font-size: var(--sahm-font-body) !important;
}
#app :is(h1,.topbar-screen-title,.dialog h3,.auth-brand h1){
  font-size: var(--sahm-font-page-title) !important;
}
#app :is(h2,h3,.section-head h3){
  font-size: var(--sahm-font-section-title) !important;
}
#app :is(h4,.empty b,.summary-copy strong,.home-shortcut strong,.home-screen .home-action-card strong){
  font-size: var(--sahm-font-card-title) !important;
}
#app :is(small,.eyebrow,.pill,.role-chip,.stat span,.listrow small,.manager-action small,.member-action small,.group-card-metrics span,.member-summary span,.progress-caption,.group-card-footer,.summary-index,.activity-copy small,#bottomnav .navitem > span:last-child){
  font-size: var(--sahm-font-secondary) !important;
}
#app :is(.field-hint,.invitee-link){
  font-size: var(--sahm-font-helper) !important;
}
#app :is(.hero-num,.stat b,.member-summary b,.summary-copy b){
  font-size: var(--sahm-font-page-title) !important;
}
/* Standard type scale for inner screens and dialogs, applied by element role.
   Home, top bar and bottom bar keep the approved scale above.
   Sizes: 20 page title and key figures, 16 section title, 15 card title, 14 body, 12 secondary, 11 helper.
   Weights: 400 regular, 500 medium, 600 semibold, 700 bold. Families: IBM Plex Sans Arabic, DM Sans for numerals. */
#screen:not(.home-screen),#modal-root{
  --sahm-font-page-title: 20px;
  --sahm-font-section-title: 16px;
  --sahm-font-card-title: 15px;
  --sahm-font-body: 14px;
  --sahm-font-secondary: 12px;
  --sahm-font-helper: 11px;
  --sahm-weight-regular: 400;
  --sahm-weight-medium: 500;
  --sahm-weight-semibold: 600;
  --sahm-weight-bold: 700;
  --sahm-leading-title: 1.35;
  --sahm-leading-body: 1.6;
}
:is(#screen:not(.home-screen),#modal-root) :is(p,small,.field-hint){
  font-weight: var(--sahm-weight-regular);
  line-height: var(--sahm-leading-body);
}
:is(#screen:not(.home-screen),#modal-root) :is(strong,b,.btn,.tabs button,.segmented button,.pill,.role-chip){
  font-weight: var(--sahm-weight-semibold);
}
:is(#screen:not(.home-screen),#modal-root) :is(.field label,.eyebrow,.keyvalue span,.stat span,.member-summary span,.group-card-metrics span){
  font-weight: var(--sahm-weight-medium);
}
:is(#screen:not(.home-screen),#modal-root) :is(.field input,.field select,.field textarea,.searchbox){
  font-weight: var(--sahm-weight-regular);
}
:is(#screen:not(.home-screen),#modal-root) :is(h1,h2,h3,h4,.hero-num,.stat b,.member-summary b){
  font-weight: var(--sahm-weight-bold);
  line-height: var(--sahm-leading-title);
}
/* Icon and brand glyph sizing remains independent from the text scale. */
#app .navitem .ni{ font-size: 21px !important; }
#app .manager-action span, #app .member-action span{ font-size: 19px !important; }
#app .brand-mark{ font-size: 18px !important; }
#app .auth-brand .brand-mark{ font-size: 30px !important; }
#app .receipt-mark{ font-size: 22px !important; }
#app .shortcut-arrow{ font-size: 19px !important; }
#app #bottomnav .navitem .ni{ font-size: 0 !important; }

</style>

const IC_EMPTY={wall:'messages',chat:'messages',notifications:'bell',news:'wall',audit:'scroll',installments:'receipt',members:'users',invites:'send','join-requests':'inbox',receipts:'file-text','draw-history':'trophy',groups:'landmark','managed-groups':'landmark','joined-groups':'landmark'};
function icPick(rules,text){const t=String(text||'').trim();for(const r of rules)if(r[0].test(t))return r[1];return ''}
function icSvg(name,size,cls){return name?uiIcon(name,size).replace('<svg ','<svg class="ic '+cls+'" '):''}
function decorateIcons(){
 const screen=document.getElementById('screen');
 if(!screen||screen.classList.contains('home-screen')||screen.classList.contains('auth-screen'))return;
 const roots=[screen,document.getElementById('modal-root')].filter(Boolean);
 roots.forEach(root=>{
  root.querySelectorAll('.avatar').forEach(el=>{
   if(el.querySelector('svg'))return;
   const t=el.textContent.trim();
   const name=IC_GLYPH[t]||(/^[0-9٠-٩]+$/.test(t)?'layers':(el.closest('.group-card,.chat-list-row')?'landmark':'user'));
   el.innerHTML=icSvg(name,22,'av');
  });
  root.querySelectorAll('.receipt-mark').forEach(el=>{
   if(el.querySelector('svg'))return;
   const bad=el.textContent.trim()==='!';
   el.innerHTML=icSvg(bad?'alert':'check-circle',46,'rm'+(bad?' warn':''));
  });
  root.querySelectorAll('h3, .card>.between>b:first-child, .card>b:first-child').forEach(el=>{
   if(el.querySelector('svg')||el.closest('.group-card'))return;
   const name=icPick(IC_HEAD,el.textContent);
   if(name)el.insertAdjacentHTML('afterbegin',icSvg(name,20,'hd'));
  });
  root.querySelectorAll('.btn').forEach(el=>{
   if(el.querySelector('svg'))return;
   const act=el.dataset.action,go=el.dataset.go;
   const name=(act&&IC_ACTION[act])||(go&&IC_GO[go])||icPick(IC_TEXT,el.textContent);
   if(!name)return;
   const svg=icSvg(name,18,'bt');
   if(act&&IC_TRAILING.includes(act))el.insertAdjacentHTML('beforeend',svg);else el.insertAdjacentHTML('afterbegin',svg);
  });
  root.querySelectorAll('.keyvalue>span:first-child, .stat>span:first-child, .member-summary>div>span:first-child, .group-card-metrics>div>span:first-child, .field>label:first-child').forEach(el=>{
   if(el.querySelector('svg')||el.closest('.cg-seg'))return;
   const name=icPick(IC_LABEL,el.textContent);
   if(name)el.insertAdjacentHTML('afterbegin',icSvg(name,16,'lb'));
  });
  root.querySelectorAll('.empty').forEach(el=>{
   if(el.querySelector('.big,svg'))return;
   el.insertAdjacentHTML('afterbegin','<div class="big">'+icSvg(IC_EMPTY[screenName]||'inbox',34,'em')+'</div>');
  });
 });
}
(function(){

 let queued=false;
 new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;decorateIcons()})}).observe(app,{childList:true,subtree:true});
})();

function load(){
 const prefs=SahmApp.prefs(),appStore=SahmApp.store(),mine=SahmApp.myGroups(),rawGroups=[...(mine.managed||[]),...(mine.joined||[])];
 const groups=[];
 rawGroups.forEach(g=>{
  const detail=SahmApp.groupDetail(g.id);if(!detail||!detail.ok)return;
  const memberResult=SahmApp.memberList(g.id),memberRows=memberResult&&memberResult.ok?memberResult.members:[];
  const minor=(SahmCore.CURRENCIES[g.currency]||SahmCore.CURRENCIES.YER).minor;
  const actualShares=memberRows.reduce((n,m)=>n+(Number(m.shares)||0),0);
  const perShare=SahmCore.shareAmounts(g).map(v=>v/minor);
  const phaseStatus={pending:'PENDING_MEMBERS',open:'READY_FOR_DRAW',running:'ACTIVE_REVOLVING',completed:'COMPLETED'};
  groups.push({
   id:g.id,name:g.name,currency:g.currency,share:g.shareAmount/minor,installmentAmount:perShare[0]||0,total:g.targetShares,maxPer:g.maxPerMember,
   start:g.startDate,first:detail.plan&&detail.plan.firstDraw||SahmCore.firstDrawDate(g),
   period:SahmCore.cycleLabel(g)+' · '+g.installments+' '+(g.installments===1?'قسط':'أقساط'),
   cycleType:g.cycleType,cycleDays:g.cycleDays,installments:g.installments,shareAmountMinor:g.shareAmount,
   role:detail.role.manager?'manager':'member',myShares:detail.role.shares,status:phaseStatus[detail.phase]||'PENDING_MEMBERS',
   members:memberRows.length,shares:actualShares,paid:detail.counts?detail.counts.paid:0,cycle:detail.cycle||1,
   admin:g.managerName,contrib:g.shareAmount/minor,publicLink:null,
   inviteCode:g.inviteCode,rules:g.rules,locked:!!detail.agreementLocked,detail:detail,counts:detail.counts||null
  });
 });
 const notifResult=SahmApp.notificationList();
 return {
  user:Object.assign({name:'',phone:'',city:'',notifications:true,biometric:false},prefs.user||{},{
   notifications:prefs.notifications!==false,biometric:!!prefs.biometric
  }),
  session:!!prefs.session,verified:!!prefs.verified,groups,
  joinRequests:Array.isArray(appStore.joinRequests)?appStore.joinRequests.slice():[],

 };

function applyNavigationState(state,fromPop=false){

 let next=state;

 else if(db.session&&next.screenName==='profile-setup'&&activeProfile&&activeProfile.completed)next=navigation.reset(routeSnapshot('home',{}));
 else if(!db.session&&!isAuth)next=navigation.reset(routeSnapshot('logged-out',{}));
 screenName=next.screenName;params=next.params||{};
 currentGroupId=db.groups.some(g=>g.id===next.currentGroupId)?next.currentGroupId:((db.groups[0]||{}).id||null);
 groupTab=next.groupTab||'all';groupDetailTab=next.groupDetailTab||'overview';
 const view=next.viewState||{};

 joinRequestFilter=['pending','approved','rejected','cancelled','all'].includes(view.joinRequestFilter)?view.joinRequestFilter:joinRequestFilter;
 createWizardStep=Math.max(1,Math.min(CREATE_STEP_COUNT,Number(view.createWizardStep)||1));
 createFormSnapshot=Object.assign({},view.createFormSnapshot||{});
 const sameScreen=previous.screenName===next.screenName&&JSON.stringify(previous.params||{})===JSON.stringify(next.params||{})&&previous.currentGroupId===next.currentGroupId&&previous.groupTab===next.groupTab&&previous.groupDetailTab===next.groupDetailTab;

function validateCreateStep(step){
 const f=document.getElementById('createForm');if(!f)return false;
 const root='#create-step-'+step,invalid=Array.from(f.querySelectorAll(root+' input, '+root+' select, '+root+' textarea'))
  .find(x=>x.required&&!x.disabled&&!x.checkValidity());
 if(invalid){invalid.reportValidity();return false}
 const d=createDraft(f);
 if(step===1){
  if(!d.name||d.name.length<2||d.name.length>120){toast('أدخل اسم الجمعية');return false}
  if(!SahmCore.isValidDate(d.startDate)){toast('حدد تاريخ بداية الجمعية');return false}
  if(!SahmCore.isValidDate(d.firstDrawOn)){toast('حدد موعد أول قرعة');return false}
  if(d.firstDrawOn<=d.startDate){toast('موعد أول قرعة يجب أن يكون بعد تاريخ البداية');return false}
  if(d.durationDays<1||d.durationDays>3650){toast('مدة الدورة بين يوم واحد و3650 يومًا');return false}
  if(!SahmCore.CURRENCIES[d.currency]){toast('اختر العملة');return false}
  if(!d.shareAmountMinor||d.shareAmountMinor<1){toast('أدخل قيمة حصة السهم');return false}
 }
 if(step===2){
  if(d.installmentMode==='count'){
   if(!Number.isInteger(d.installments)||d.installments<1||d.installments>d.durationDays){toast('عدد الأقساط غير صالح أو يتجاوز مدة الدورة');return false}
  }else if(d.installmentMode==='amount'){
   if(!d.installmentAmountMinor||d.installmentAmountMinor<1||d.installmentAmountMinor>d.shareAmountMinor){toast('قيمة القسط يجب أن تكون موجبة ولا تتجاوز حصة السهم');return false}
   if(Math.ceil(d.shareAmountMinor/d.installmentAmountMinor)>d.durationDays){toast('عدد الأقساط الناتج يتجاوز مدة الدورة');return false}
  }else{toast('اختر طريقة السداد');return false}
  if(d.managerMode==='both'&&(!Number.isInteger(d.managerShares)||d.managerShares<1)){toast('أدخل عدد أسهم المدير');return false}
 }
 return true;
}

let pendingInvitees=[];
function invitePhoneKey(value){
 let v=String(value||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
 v=v.trim().replace(/[()\s.-]/g,'');
 if(v.startsWith('00'))v='+'+v.slice(2);
 if(v.startsWith('+'))return v.replace(/\D/g,'');
 let digits=v.replace(/\D/g,'').replace(/^0+/,'');
 return digits.startsWith('967')?digits:'967'+digits;
}
function activeInvitationForPhone(groupId,phone){
 const key=invitePhoneKey(phone);
 const list=SahmApp.inviteList(groupId),invites=list&&list.ok?list.invites:[];
  return !!key&&invites.some(i=>i.status==='pending'&&
  ['pending_response','interested','deferred'].includes(i.responseStatus||'pending_response')&&
  (!i.expiresAt||new Date(i.expiresAt).getTime()>Date.now())&&invitePhoneKey(i.phone)===key);
}

 const duplicate=activeInvitationForPhone(currentGroupId,cleanPhone);
 pendingInvitees.push({name:cleanName,phone:cleanPhone,selected:!duplicate,duplicate:duplicate});
 return true;
}

function joinInstallmentPreview(info,requestedShares){

}

async function copyText(value,successMessage){
 const text=String(value||'');if(!text){toast('لا يوجد نص متاح للنسخ');return false}
 try{
  if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){
   await navigator.clipboard.writeText(text);toast(successMessage||'تم النسخ');return true;
  }
 }catch(_){}
 let box=null;
 try{
  box=document.createElement('textarea');box.value=text;box.setAttribute('readonly','');
  box.style.position='fixed';box.style.opacity='0';box.style.pointerEvents='none';
  document.body.appendChild(box);box.focus();box.select();box.setSelectionRange(0,box.value.length);
  const copied=!!(document.execCommand&&document.execCommand('copy'));
  box.remove();box=null;
  if(copied){toast(successMessage||'تم النسخ');return true}
 }catch(_){if(box)box.remove()}
 toast('تعذر النسخ تلقائيًا؛ حدد الرابط وانسخه يدويًا');return false;
}

let modalReturnFocus=null;
function showModal(title,body,buttons=[['إغلاق','close','outline']]){
 if(navigation)navigation.openModal();
 if(!$('#modal-root .dialog'))modalReturnFocus=document.activeElement;
 $('#modal-root').innerHTML=`<div class="overlay" data-action="overlay-close"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1" onclick="event.stopPropagation()"><h3 id="modal-title">${title}</h3><div class="dialog-body">${body}</div><div class="dialog-actions">${buttons.map(([label,act,style='primary'])=>`<button class="btn ${style}" data-action="${act}">${label}</button>`).join('')}</div></div></div>`;
 const dialog=$('#modal-root .dialog');
 if(dialog){
  dialog.addEventListener('click',function(event){const actionButton=event.target.closest('[data-action]');if(actionButton){event.preventDefault();event.stopPropagation();handleAppAction(actionButton.dataset.action,actionButton);}});
  const first=dialog.querySelector('input:not([disabled]),select:not([disabled]),textarea:not([disabled]),button:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])');
  (first||dialog).focus();
 }
}
function closeModal(){
 if(navigation)navigation.dismissModal();
 $('#modal-root').innerHTML='';
 if(modalReturnFocus&&document.contains(modalReturnFocus))modalReturnFocus.focus();
 modalReturnFocus=null;
}
document.addEventListener('keydown',e=>{
 const dialog=$('#modal-root .dialog');
 if(dialog){
  if(e.key==='Escape'){e.preventDefault();closeModal();return}
  if(e.key==='Tab'){
   const focusable=Array.from(dialog.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'))
    .filter(el=>!el.hidden&&el.getAttribute('aria-hidden')!=='true');
   if(!focusable.length){e.preventDefault();dialog.focus();return}
   const first=focusable[0],last=focusable[focusable.length-1];
   if(!dialog.contains(document.activeElement)){e.preventDefault();first.focus();return}
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();return}
   if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();return}
  }
 }
 const card=e.target.closest?.('.group-card[role="button"]');
 if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();card.click()}
});
async function handleAppAction(action,el){
 const g=currentGroup();
 if(action==='pick-device-contacts'){
  if(!navigator.contacts||typeof navigator.contacts.select!=='function'){
   toast('اختيار جهات الاتصال غير مدعوم في هذا المتصفح؛ أضف الاسم والرقم يدويًا');return;
  }
  try{
   const contacts=await navigator.contacts.select(['name','tel'],{multiple:true});
   let added=0,skipped=0;
   for(const contact of contacts||[]){
    const name=Array.isArray(contact.name)?(contact.name[0]||''):String(contact.name||'');
    const tel=Array.isArray(contact.tel)?(contact.tel.find(Boolean)||''):String(contact.tel||'');
    if(!tel){skipped++;continue}
    if(pendingInvitees.length>=50){skipped++;continue}
    if(addInviteeToSelection(name,tel))added++;else skipped++;
   }
   renderInviteeSelection();
   toast(added?'أُضيفت '+added+' جهة اتصال إلى القائمة':(skipped?'لم تُضف جهات اتصال جديدة':'لم يتم اختيار جهات اتصال'));
  }catch(error){if(error&&error.name!=='AbortError')toast('تعذر فتح جهات الاتصال؛ يمكنك الإضافة يدويًا')}
  return;
 }
 if(action==='remove-invitee'){
  const index=Number(el.dataset.index);
  if(Number.isInteger(index)&&index>=0&&index<pendingInvitees.length){pendingInvitees.splice(index,1);renderInviteeSelection()}
  return;
 }
 if(action==='submit-bulk-invites'){
  if(bulkInvitesBusy)return;
  if(!g||!isManager()){toast('إرسال الدعوات متاح لمدير الجمعية فقط');return}
  const selected=pendingInvitees.filter(x=>x.selected&&!x.duplicate);
  if(!selected.length){toast('حدد جهة اتصال واحدة على الأقل');return}
  if(selected.length>50){toast('لا يمكن إرسال أكثر من 50 دعوة في العملية الواحدة');return}
  const invalid=selected.find(x=>String(x.name||'').trim().length<2||!String(x.phone||'').trim());
  if(invalid){toast('أكمل اسم ورقم كل جهة اتصال محددة');return}
  bulkInvitesBusy=true;el.disabled=true;const oldLabel=el.textContent;el.textContent='جارٍ إنشاء الدعوات...';
  try{
   const result=await SahmApp.createInvitationsBulk(g.id,selected.map(x=>({name:x.name.trim(),phone:x.phone.trim()})));
   if(!result||!result.ok){toast(result&&result.message||'تعذر إنشاء الدعوات');return}
   refreshData();
   const rows=(result.results||[]).map(item=>item.status==='sent'
    ?'<div class="listrow"><div class="grow"><strong>'+escapeHtml(item.name)+'</strong><small>تم إنشاء الدعوة؛ شارك الرابط مع الشخص ليتمكن من فتحها</small><input class="field invitee-link" readonly value="'+escapeHtml(item.url||'')+'"></div><div class="invitee-result-actions"><button class="btn outline small" data-action="copy-bulk-invite-link" data-link="'+escapeHtml(item.url||'')+'">نسخ</button><button class="btn soft small" data-action="share-bulk-invite-link" data-link="'+escapeHtml(item.url||'')+'">مشاركة</button></div></div>'
    :'<div class="listrow"><div class="grow"><strong>'+escapeHtml(item.name||'جهة اتصال')+'</strong><small>'+escapeHtml(item.message||'تعذر إرسال الدعوة')+'</small></div><span class="pill red">لم تُرسل</span></div>'
   ).join('');
   const failedContacts = new Set();
   (result.results||[]).forEach((item,index)=>{if(item.status!=='sent'&&selected[index])failedContacts.add(selected[index]);});
   pendingInvitees = pendingInvitees.filter(item=>!selected.includes(item)||failedContacts.has(item));

<script>
/* Sahm PWA: detect published builds quickly and notify before activation. */
if ('serviceWorker' in navigator) {
  let sahmReloading = false;
  let sahmUpdateNoticeShown = false;
  let sahmRegistration = null;

  const showSahmUpdateNotice = () => {
    if (sahmUpdateNoticeShown || !document.body) return;
    sahmUpdateNoticeShown = true;
    const notice = document.createElement('div');
    notice.setAttribute('role', 'status');
    notice.setAttribute('aria-live', 'polite');
    notice.style.cssText = 'position:fixed;z-index:99999;top:12px;left:12px;right:12px;max-width:430px;margin:auto;padding:13px 14px;background:#172338;color:#fff;border:1px solid #52617b;border-radius:12px;box-shadow:0 8px 28px #0003;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 15px "IBM Plex Sans Arabic",sans-serif;direction:rtl';
    const message = document.createElement('span');
    message.textContent = 'يتوفر تحديث جديد لتطبيق سهم';
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = 'تحديث الآن';
    button.style.cssText = 'flex:none;border:0;border-radius:8px;padding:9px 13px;background:#fff;color:#2345b5;font:700 13px "IBM Plex Sans Arabic",sans-serif;cursor:pointer';
    button.addEventListener('click', () => {
      button.disabled = true;
      button.textContent = 'جارٍ التحديث…';
      const waiting = sahmRegistration && sahmRegistration.waiting;
      if (waiting) waiting.postMessage({ type: 'SKIP_WAITING' });
      else if (sahmRegistration) sahmRegistration.update().catch(() => {});
    });
    notice.append(message, button);
    document.body.appendChild(notice);
  };

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (sahmReloading) return;
    sahmReloading = true;
    try { sessionStorage.setItem('sahm-build-updated', '1'); } catch (_) {}
    window.location.reload();
  });

  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('/sw.js', {
        scope: '/',
        updateViaCache: 'none'
      });
      sahmRegistration = registration;

      try {
        if (sessionStorage.getItem('sahm-build-updated') === '1') {
          sessionStorage.removeItem('sahm-build-updated');
          const confirmation = document.createElement('div');
          confirmation.textContent = 'تم تحديث سهم بنجاح';
          confirmation.setAttribute('role', 'status');
          confirmation.style.cssText = 'position:fixed;z-index:99999;top:12px;left:12px;right:12px;max-width:430px;margin:auto;padding:12px;background:#176b4b;color:#fff;border-radius:10px;text-align:center;font:600 13px "IBM Plex Sans Arabic",sans-serif';
          document.body.appendChild(confirmation);
          window.setTimeout(() => confirmation.remove(), 3500);
        }

        if (registration.waiting && navigator.serviceWorker.controller) showSahmUpdateNotice();
      };

            showSahmUpdateNotice();
          }
        });
      });

      await registration.update();
      inspectUpdate();
      window.setInterval(() => {
        if (document.visibilityState === 'visible') {
          registration.update().catch(error => console.warn('Sahm update check failed:', error));
        }
      }, 10000);
      window.addEventListener('focus', () => registration.update().catch(() => {}));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') registration.update().catch(() => {});
      });
    } catch (error) {
      console.warn('Sahm service worker registration failed:', error);

  });
