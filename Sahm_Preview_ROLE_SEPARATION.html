<title>سهم | إدارة الجمعيات التساهمية</title>
<style>

/* Consolidated Sahm CSS — one current theme and one authoritative layout. */
* {
  box-sizing: border-box;
}
button {
  cursor: pointer;
  border: 0;
}
.phone {
  max-width: 430px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.brand-mark {
  display: grid;
  place-items: center;
  font-weight: 800;
}
.dot {
  position: absolute;
  border-radius: 50%;
}
.screen {
  overflow: auto;
  flex: 1;
  min-height: 0;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}
.screen::-webkit-scrollbar {
  width: 3px;
}
.screen::-webkit-scrollbar-thumb {
  border-radius: var(--radius-small);
}
.bottomnav {
  display: flex;
  justify-content: space-around;
}
.navitem {
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.navitem .ni {
  font-size: 21px;
}
.navitem.active {
  font-weight: 700;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-head h3 {
  margin: 0;
}
.link-btn {
  background: transparent;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.stat b {
  display: block;
}
.progress {
  overflow: hidden;
}
.progress i {
  height: 100%;
  display: block;
  border-radius: var(--radius-small);
}
.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  background: var(--ink);
  color: #fff;
}
.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.row {
  display: flex;
  align-items: center;
}
.between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.avatar {
  display: grid;
  place-items: center;
  font-weight: 800;
  flex: none;
}
.listrow {
  display: flex;
  align-items: center;
  border-bottom: 1px solid #eff2f1;
}
.listrow:last-child {
  border: 0;
  padding-bottom: 0;
}
.listrow:first-child {
  padding-top: 0;
}
.grow {
  flex: 1;
  min-width: 0;
}
.listrow strong {
  display: block;
}
.listrow small {
  display: block;
  margin-top: 3px;
}
.amount {
  white-space: nowrap;
}
.field label {
  display: block;
}
.field input {
  width: 100%;
  outline: none;
}
.field select {
  width: 100%;
  outline: none;
}
.field textarea {
  width: 100%;
  outline: none;
}
.searchbox {
  width: 100%;
  outline: none;
}
.field textarea {
  resize: vertical;
  line-height: 1.8;
}
.formgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.segmented {
  display: flex;
}
.segmented button {
  flex: 1;
  background: transparent;
  color: #697b7d;
  font-weight: 700;
}
.segmented button.active {
  background: #fff;
}
.tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
}
.tabs button {
  background: none;
  border-bottom: 2px solid transparent;
}
.tabs button.active {
  font-weight: 800;
}
.toolbar {
  display: flex;
  align-items: center;
}
.searchbox {
  flex: 1;
}
.keyvalue {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid #eff2f1;
}
.keyvalue:last-child {
  border: 0;
}
.wheel-wrap {
  display: grid;
  place-items: center;
}
.wheel {
  width: 190px;
  height: 190px;
  border: 9px solid #e9efec;
  border-radius: 50%;
  background: conic-gradient(#1b827a 0 45deg,#d7a54c 45deg 90deg,#244d59 90deg 135deg,#87b8aa 135deg 180deg,#e6c27d 180deg 225deg,#32616a 225deg 270deg,#9bc8ba 270deg 315deg,#c38e39 315deg);
  box-shadow: inset 0 0 0 5px #fff,0 5px 14px #173b4318;
  display: grid;
  place-items: center;
  position: relative;
}
.wheel::before {
  content: 'سهم';
  background: white;
  border-radius: 50%;
  width: 66px;
  height: 66px;
  display: grid;
  place-items: center;
  font-weight: 800;
  color: var(--ink);
  box-shadow: 0 2px 8px #102d351c;
}
.wheel.spin {
  animation: spin 2s cubic-bezier(.13,.72,.22,1);
}
@keyframes spin{to{transform:rotate(1440deg)}}
.receipt {
  border: 1px dashed #afc1bc;
  border-radius: var(--radius-card);
}
.chatbubble {
  border-radius: var(--radius-control) var(--radius-control) 3px var(--radius-control);
  line-height: 1.8;
  max-width: 85%;
  margin: 5px 0 5px auto;
}
.chatbubble.mine {
  border-radius: var(--radius-control) var(--radius-control) var(--radius-control) 3px;
  margin-right: auto;
  margin-left: 0;
}
.empty {
  text-align: center;
  color: var(--muted);
}
.empty .big {
  margin-bottom: 8px;
}
.empty b {
  color: var(--ink);
  display: block;
  margin-bottom: 4px;
}
.empty p {
  margin: 0 0 12px;
}
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
}
.dialog {
  background: #fff;
  width: 100%;
  overflow: auto;
  box-shadow: 0 15px 50px #061b2255;
}
.dialog h3 {
  margin: 0 0 6px;
}
.dialog .dialog-body {
  color: #4d6267;
}
.dialog-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.dialog-actions>* {
  flex: 1;
}
.toast {
  position: absolute;
  left: 50%;
  transform: translate(-50%,20px);
  background: #173941;
  color: white;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  box-shadow: var(--shadow);
}
.toast.show {
  opacity: 1;
  transform: translate(-50%,0);
}
.auth-screen {
  color: white;
  flex: 1;
  overflow: auto;
}
.auth-brand {
  text-align: center;
}
.auth-brand .brand-mark {
  margin: auto;
}
.auth-brand h1 {
  margin: 13px 0 3px;
}
.auth-brand p {
  font-size: 10px;
  color: #d2e0dc;
}
.auth-card {
  background: white;
  color: var(--ink);
}
.auth-card .field input {
  background: #f8fbfa;
}
.role-chip {
  display: inline-flex;
  align-items: center;
  border-radius: var(--radius-small);
  font-weight: 800;
}


.manager-action-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
}
.member-action-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
}
.manager-action {
  text-align: right;
  display: flex;
  flex-direction: column;
}
.member-action {
  text-align: right;
  display: flex;
  flex-direction: column;
}
:root {
  --ink: #172338;
  --ink2: #2b3d59;
  --teal: #3158d6;
  --mint: #edf2ff;
  --gold: #f1c56b;
  --bg: #f4f6fa;
  --card: #fff;
  --muted: #68778d;
  --line: #e5eaf1;
  --red: #b5434a;
  --blue: #41658d;

  --radius: var(--radius-card);
  --primary: #3158d6;
  --primary-dark: #2345b5;
  --surface: #fff;
  --surface-2: #f8f9fc;
  --radius-card: 12px;
  --radius-control: 10px;
  --radius-small: 8px;
  --radius-shell: 16px;
}
html {
  background: #e9edf4;
  color: var(--ink);
}
body {
  background: #e9edf4;
  color: var(--ink);
}
button {
  font: inherit;
}
input {
  font: inherit;
}
select {
  font: inherit;
}
textarea {
  font: inherit;
}
button {
  touch-action: manipulation;
}
.workspace {
  background: radial-gradient(ellipse at 50% 0%,#e4eaf7 0,#e9edf4 48%,#e9edf4 100%);
}
.phone {
  border: 1px solid #d8dfeb;
  border-radius: var(--radius-shell);
  background: var(--bg);
  box-shadow: 0 28px 90px rgba(23,38,69,.18);
}

.topbar {
  height: 70px;
  background: #fff;
  color: var(--ink);
  border-bottom: 1px solid var(--line);

}

}
.dot {
  width: 8px;

}
.screen {
  background: var(--bg);
  scrollbar-color: #cad3e1 transparent;
}
.screen::-webkit-scrollbar-thumb {

}
.bottomnav {
  height: 78px;
  min-height: 78px;
  flex: 0 0 auto;
  position: relative;
  z-index: 10;
  visibility: visible;
  background: #fff;
  border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  gap: 4px;

}
.navitem {
  min-height: 54px;
  border-radius: 0;

}
.navitem .ni {

}

  stroke-linejoin: round;
}
.navitem.active {
  color: var(--primary);
  background: #edf2ff;
}

  transform: none;
}
.section-head h3 {

}
.link-btn {

}

}

}
.stat {
  background: #fff;
  border: 1px solid var(--line);

}

}

}

}
.btn {
  min-height: 46px;

}

}
.btn.soft {

}

}
.btn:disabled {

.row {

}

}

}
.segmented {

.tabs {

  background: var(--bg);
}

  box-shadow: none;
}

    padding-inline: 17px;

    height: calc(76px + env(safe-area-inset-bottom));

function createInput(form,name){return form.elements[name]&&form.elements[name].value?String(form.elements[name].value).trim():''}
function createDraft(form){
 const currency=createInput(form,'currency'),mode=createInput(form,'installmentMode')||'count';
 const startDate=createInput(form,'startDate'),firstDrawOn=createInput(form,'firstDrawOn');
 const durationDays=SahmCore.isValidDate(startDate)&&SahmCore.isValidDate(firstDrawOn)&&firstDrawOn>startDate?SahmCore.diffDays(firstDrawOn,startDate):0;
 return {
  startDate,firstDrawOn,durationDays,
  name:createInput(form,'name'),currency,shareAmount:createInput(form,'shareAmount'),
  shareAmountMinor:SahmCore.CURRENCIES[currency]?SahmCore.parseMoney(createInput(form,'shareAmount'),currency):null,
  installmentMode:mode,installments:mode==='count'?Number(createInput(form,'installments')):0,
  installmentAmount:createInput(form,'installmentAmount'),
  installmentAmountMinor:mode==='amount'&&SahmCore.CURRENCIES[currency]?SahmCore.parseMoney(createInput(form,'installmentAmount'),currency):null,
  managerMode:createInput(form,'managerMode')==='both'?'both':'only',
  managerShares:createInput(form,'managerMode')==='both'?Number(createInput(form,'managerShares')):0,
  quorum:Number(createInput(form,'quorum')||66),tz:createInput(form,'tz')||'Asia/Aden',
  inviteOpensOn:createInput(form,'inviteOpensOn')||undefined,
  inviteClosesOn:createInput(form,'inviteClosesOn')||undefined,
  rules:createInput(form,'rules')
 };
}
function validateCreateStep(step){
 const f=document.getElementById('createForm');if(!f)return false;
 const root='#create-step-'+step,invalid=Array.from(f.querySelectorAll(root+' input, '+root+' select, '+root+' textarea'))
  .find(x=>x.required&&!x.disabled&&!x.checkValidity());
 if(invalid){invalid.reportValidity();return false}
 const d=createDraft(f);
 if(step===1){
  if(!SahmCore.isValidDate(d.startDate)){toast('حدد تاريخ بداية الجمعية');return false}
  if(!SahmCore.isValidDate(d.firstDrawOn)){toast('حدد موعد أول قرعة');return false}
  if(d.firstDrawOn<=d.startDate){toast('موعد أول قرعة يجب أن يكون بعد تاريخ البداية');return false}
  if(d.durationDays<1||d.durationDays>3650){toast('مدة الدورة بين يوم واحد و3650 يومًا');return false}
  if(!SahmCore.isValidTimeZone(d.tz)){toast('المنطقة الزمنية غير صحيحة');return false}
 }
 if(step===2){
  if(!d.name||d.name.length<2||d.name.length>120){toast('أدخل اسم الجمعية');return false}
  if(!SahmCore.CURRENCIES[d.currency]){toast('اختر العملة');return false}
  if(!d.shareAmountMinor||d.shareAmountMinor<1){toast('أدخل قيمة حصة السهم');return false}
  if(d.installmentMode==='count'){
   if(!Number.isInteger(d.installments)||d.installments<1||d.installments>d.durationDays){toast('عدد الأقساط غير صالح أو يتجاوز مدة الدورة');return false}
  }else if(d.installmentMode==='amount'){
   if(!d.installmentAmountMinor||d.installmentAmountMinor<1||d.installmentAmountMinor>d.shareAmountMinor){toast('قيمة القسط يجب أن تكون موجبة ولا تتجاوز حصة السهم');return false}
   if(Math.ceil(d.shareAmountMinor/d.installmentAmountMinor)>d.durationDays){toast('عدد الأقساط الناتج يتجاوز مدة الدورة');return false}
  }else{toast('اختر طريقة السداد');return false}
  if(d.managerMode==='both'&&(!Number.isInteger(d.managerShares)||d.managerShares<1)){toast('أدخل عدد أسهم المدير');return false}
  if(!Number.isInteger(d.quorum)||d.quorum<1||d.quorum>100){toast('نصاب الحضور بين 1 و100');return false}
  if(d.inviteOpensOn&&!SahmCore.isValidDate(d.inviteOpensOn)){toast('تاريخ فتح الانضمام غير صحيح');return false}
  if(d.inviteClosesOn&&!SahmCore.isValidDate(d.inviteClosesOn)){toast('تاريخ إغلاق الانضمام غير صحيح');return false}
  if(d.inviteOpensOn&&d.inviteClosesOn&&d.inviteClosesOn<d.inviteOpensOn){toast('تاريخ إغلاق الانضمام يسبق تاريخ فتحه');return false}
 }
 return true;
}
function createPreview(form){
 const d=createDraft(form),currency=d.currency||'YER',minor=d.shareAmountMinor,duration=d.durationDays||0;
 const count=d.installmentMode==='count'?d.installments:(d.installmentAmountMinor?Math.ceil(minor/d.installmentAmountMinor):0);
 let amounts=[];
 if(minor&&count>0){
  if(d.installmentMode==='count')amounts=SahmCore.splitAmount(minor,count);
  else{let left=minor;for(let i=0;i<count;i++){const value=Math.min(d.installmentAmountMinor,left);amounts.push(value);left-=value}}
 }
 let periods=[];
 if(duration>0&&count>0&&count<=duration){
  const ranges=SahmCore.periods(duration,count);
  periods=ranges.map((r,i)=>({no:i+1,start:SahmCore.addDays(d.startDate,r.from-1),end:SahmCore.addDays(d.startDate,r.to-1),amount:amounts[i]||0}));
 }
 const put=(id,value)=>{const node=document.getElementById(id);if(node)node.textContent=value};
 put('cg-duration-preview',duration?duration+' يومًا':'—');
 put('cg-first-draw-preview',d.firstDrawOn?dateLabel(d.firstDrawOn):'—');
 put('cs-start',d.startDate?dateLabel(d.startDate):'—');
 put('cs-first',d.firstDrawOn?dateLabel(d.firstDrawOn):'—');
 put('cs-duration',duration?duration+' يومًا':'—');
 put('cs-share',minor?minorMoney(minor,currency):'—');
 put('cs-installments',count?count+' أقساط':'—');
 put('cs-manager',d.managerMode==='both'?'مدير ومشارك · '+d.managerShares+' أسهم':'مدير فقط');
 const list=document.getElementById('cg-installment-preview');
 if(list)list.innerHTML=periods.length?periods.map(p=>'<div class="keyvalue"><span>القسط '+p.no+' · '+dateLabel(p.start)+' إلى '+dateLabel(p.end)+'</span><b>'+minorMoney(p.amount,currency)+'</b></div>').join(''):'<small>أدخل تاريخي الجمعية وطريقة السداد لعرض مواعيد الأقساط.</small>';
}

let pendingInvitees=[];
function invitePhoneKey(value){
 let v=String(value||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
 v=v.trim().replace(/[()\s.-]/g,'');
 if(v.startsWith('00'))v='+'+v.slice(2);
 if(v.startsWith('+'))return v.replace(/\D/g,'');
 let digits=v.replace(/\D/g,'').replace(/^0+/,'');
 return digits.startsWith('967')?digits:'967'+digits;
}
function activeInvitationForPhone(groupId,phone){
 const key=invitePhoneKey(phone);
 const list=SahmApp.inviteList(groupId),invites=list&&list.ok?list.invites:[];
  return !!key&&invites.some(i=>i.status==='pending'&&
  ['pending_response','interested','deferred'].includes(i.responseStatus||'pending_response')&&
  (!i.expiresAt||new Date(i.expiresAt).getTime()>Date.now())&&invitePhoneKey(i.phone)===key);
}
function addInviteeToSelection(name,phone){
 const cleanName=String(name||'').trim(),cleanPhone=String(phone||'').trim();
 if(!cleanPhone){toast('جهة الاتصال لا تحتوي رقم هاتف؛ أضف الرقم يدويًا');return false}
 const key=invitePhoneKey(cleanPhone);
 if(pendingInvitees.some(x=>invitePhoneKey(x.phone)===key)){toast('جهة الاتصال موجودة بالفعل في القائمة');return false}
 const duplicate=activeInvitationForPhone(currentGroupId,cleanPhone);
 pendingInvitees.push({name:cleanName,phone:cleanPhone,selected:!duplicate,duplicate:duplicate});
 return true;
}
function renderInviteeSelection(){

 const visible=pendingInvitees.map((item,index)=>({item,index})).filter(({item})=>
  !search||(item.name+' '+item.phone).toLowerCase().includes(search));
 list.innerHTML=visible.length?visible.map(({item,index})=>
  '<div class="listrow invitee-row"><label class="grow invitee-choice">'+
   '<input type="checkbox" class="invitee-selected" data-index="'+index+'" '+(item.selected&&!item.duplicate?'checked ':'')+(item.duplicate?'disabled':'')+'>'+

 ).join(''):'<div class="empty"><b>'+(pendingInvitees.length?'لا توجد نتائج مطابقة':'لم تضف جهات اتصال بعد')+'</b><small>اختر من جهات اتصال هاتفك أو أضف الاسم والرقم يدويًا.</small></div>';
 list.querySelectorAll('.invitee-selected').forEach(input=>input.addEventListener('change',()=>{
  const item=pendingInvitees[Number(input.dataset.index)];if(item&&!item.duplicate)item.selected=input.checked;

function joinInstallmentPreview(info,requestedShares){

let modalReturnFocus=null;
function showModal(title,body,buttons=[['إغلاق','close','outline']]){
 if(navigation)navigation.openModal();
 if(!$('#modal-root .dialog'))modalReturnFocus=document.activeElement;
 $('#modal-root').innerHTML=`<div class="overlay" data-action="overlay-close"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1" onclick="event.stopPropagation()"><h3 id="modal-title">${title}</h3><div class="dialog-body">${body}</div><div class="dialog-actions">${buttons.map(([label,act,style='primary'])=>`<button class="btn ${style}" data-action="${act}">${label}</button>`).join('')}</div></div></div>`;
 const dialog=$('#modal-root .dialog');
 if(dialog){
  dialog.addEventListener('click',function(event){const actionButton=event.target.closest('[data-action]');if(actionButton){event.preventDefault();event.stopPropagation();handleAppAction(actionButton.dataset.action,actionButton);}});
  const first=dialog.querySelector('input:not([disabled]),select:not([disabled]),textarea:not([disabled]),button:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])');
  (first||dialog).focus();
 }
}
function closeModal(){
 if(navigation)navigation.dismissModal();
 $('#modal-root').innerHTML='';
 if(modalReturnFocus&&document.contains(modalReturnFocus))modalReturnFocus.focus();
 modalReturnFocus=null;
}
document.addEventListener('keydown',e=>{
 const dialog=$('#modal-root .dialog');
 if(dialog){
  if(e.key==='Escape'){e.preventDefault();closeModal();return}
  if(e.key==='Tab'){
   const focusable=Array.from(dialog.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'))
    .filter(el=>!el.hidden&&el.getAttribute('aria-hidden')!=='true');
   if(!focusable.length){e.preventDefault();dialog.focus();return}
   const first=focusable[0],last=focusable[focusable.length-1];
   if(!dialog.contains(document.activeElement)){e.preventDefault();first.focus();return}
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();return}
   if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();return}
  }
 }
 const card=e.target.closest?.('.group-card[role="button"]');
 if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();card.click()}
});
async function handleAppAction(action,el){
 const g=currentGroup();
 if(action==='pick-device-contacts'){
  if(!navigator.contacts||typeof navigator.contacts.select!=='function'){
   toast('اختيار جهات الاتصال غير مدعوم في هذا المتصفح؛ أضف الاسم والرقم يدويًا');return;
  }
  try{
   const contacts=await navigator.contacts.select(['name','tel'],{multiple:true});
   let added=0,skipped=0;
   for(const contact of contacts||[]){
    const name=Array.isArray(contact.name)?(contact.name[0]||''):String(contact.name||'');
    const tel=Array.isArray(contact.tel)?(contact.tel.find(Boolean)||''):String(contact.tel||'');
    if(!tel){skipped++;continue}
    if(pendingInvitees.length>=50){skipped++;continue}
    if(addInviteeToSelection(name,tel))added++;else skipped++;

 if(el.id==='installmentCycle'){selectedInstallmentCycle=Number(el.value)||1;syncNavigationContext();installments();return}
 if(el.dataset.action==='mute-toggle'){const g=currentGroup();if(!g)return;const prefs=SahmApp.prefs(),old=prefs.mute&&prefs.mute[g.id]||{},patch={};patch[el.dataset.kind]=el.checked;const r=await SahmApp.setMute(g.id,Object.assign({},old,patch));if(r&&r.ok){refreshData();groupDetail()}return}
 if(el.dataset.action==='notify-toggle'){const g=currentGroup();if(!g||!isManager())return;const r=await SahmApp.setNotifyType(g.id,el.dataset.type,el.checked);if(r&&r.ok){refreshData();groupDetail()}return}
});
document.addEventListener('submit',async e=>{
 const form=e.target;
 if(!['loginForm','registerForm','setupForm','updatePasswordForm','createForm','inviteeManualForm','joinForm','joinRequestForm','chatForm','profileForm'].includes(form.id))return;
 e.preventDefault();
 const setBusy=(on,label)=>{const b=form.querySelector('button[type="submit"]');if(b){b.disabled=!!on;if(on){b.dataset.oldLabel=b.textContent;b.textContent=label||'جارٍ التنفيذ...'}else if(b.dataset.oldLabel){b.textContent=b.dataset.oldLabel;delete b.dataset.oldLabel}}};
 if(form.id==='loginForm'){
  if(authBusy)return;const d=Object.fromEntries(new FormData(form));
  if(!d.email||!d.password){toast('أدخل البريد الإلكتروني وكلمة المرور');return}
  authBusy=true;setBusy(true,'جارٍ تسجيل الدخول...');
  try{
   const signed=await SahmSupabase.signIn(d.email,d.password);
   activeProfile=await SahmSupabase.profile(signed.user.id);
   selectedAvatarKey=activeProfile.avatarKey||'avatar-01';
   await SahmSupabaseData.init(activeProfile);SahmSupabaseData.install();db=load();currentGroupId=(db.groups[0]||{}).id||null;startRemoteRealtime();
   db.session=true;db.verified=!!signed.user.email_confirmed_at;db.user=Object.assign(db.user,{id:signed.user.id,email:signed.user.email,name:activeProfile.fullName,phone:activeProfile.phone,city:activeProfile.city});
   if(!activeProfile.completed){resetNavigation('profile-setup',{});}
   else{resetNavigation((new URLSearchParams(location.search).get('invite')||new URLSearchParams(location.search).get('join'))?'join-group':'home',{});toast('تم تسجيل الدخول بنجاح');}
  }catch(err){toast(SahmSupabase.friendlyError(err));}
  finally{authBusy=false;setBusy(false);}
  return;
 }
 if(form.id==='registerForm'){
  if(authBusy)return;const d=Object.fromEntries(new FormData(form));
  if(!d.terms){toast('يجب الموافقة على الشروط والأحكام');return}
  if(String(d.password||'').length<8){toast('كلمة المرور يجب ألا تقل عن 8 أحرف');return}
  if(d.password!==d.confirmPassword){toast('كلمتا المرور غير متطابقتين');return}
  authBusy=true;setBusy(true,'جارٍ إنشاء الحساب...');
  try{
   const created=await SahmSupabase.signUp(d.email,d.password,true);
   if(created.session){
    activeProfile=await SahmSupabase.profile(created.user.id);
    await SahmSupabaseData.init(activeProfile);SahmSupabaseData.install();db=load();currentGroupId=(db.groups[0]||{}).id||null;startRemoteRealtime();
    db.session=true;db.user=Object.assign(db.user,{id:created.user.id,email:created.user.email});
    selectedAvatarKey=activeProfile.avatarKey||'avatar-01';resetNavigation('profile-setup',{});
   }else{
    toast('تم إنشاء الحساب. افتح رسالة التأكيد التي أرسلناها إلى بريدك الإلكتروني، ثم ارجع لتسجيل الدخول.');
    resetNavigation('welcome',{});
   }
  }catch(err){toast(SahmSupabase.friendlyError(err));}
  finally{authBusy=false;setBusy(false);}
  return;
 }
 if(form.id==='updatePasswordForm'){
  if(authBusy)return;const d=Object.fromEntries(new FormData(form));
  if(String(d.password||'').length<8){toast('كلمة المرور يجب ألا تقل عن 8 أحرف');return}
  if(d.password!==d.confirmPassword){toast('كلمتا المرور غير متطابقتين');return}
  authBusy=true;setBusy(true,'جارٍ حفظ كلمة المرور...');
  try{
   await SahmSupabase.updatePassword(d.password);
   const cleanUrl=new URL(location.href);cleanUrl.searchParams.delete('auth_action');cleanUrl.searchParams.delete('code');cleanUrl.hash='';history.replaceState(null,'',cleanUrl.pathname+cleanUrl.search);
   toast('تم تحديث كلمة المرور بنجاح');
   if(!activeProfile)activeProfile=await SahmSupabase.profile();
   if(!SahmSupabaseData.isRemote()){await SahmSupabaseData.init(activeProfile);SahmSupabaseData.install();db=load();startRemoteRealtime();}
   resetNavigation(activeProfile.completed?((new URLSearchParams(location.search).get('invite')||new URLSearchParams(location.search).get('join'))?'join-group':'home'):'profile-setup',{});
  }catch(err){toast(SahmSupabase.friendlyError(err));}
  finally{authBusy=false;setBusy(false);}
  return;
 }
 if(form.id==='setupForm'){
  if(authBusy)return;const d=Object.fromEntries(new FormData(form));
  const parts=String(d.fullName||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length<3){toast('أدخل الاسم الثلاثي على الأقل');return}
  const rawPhone=String(d.phone||'').trim().replace(/[٠-٩]/g,ch=>'٠١٢٣٤٥٦٧٨٩'.indexOf(ch)).replace(/[۰-۹]/g,ch=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(ch));
  const compactPhone=rawPhone.replace(/[\s().-]/g,'');
  let phoneE164='';
  if(compactPhone.startsWith('+')||compactPhone.startsWith('00')){
   let internationalDigits=compactPhone.replace(/\D/g,'');
   if(compactPhone.startsWith('00'))internationalDigits=internationalDigits.slice(2);
   phoneE164='+'+internationalDigits;
  }else{
   let national=compactPhone.replace(/\D/g,'').replace(/^0+/,'');
   const dialDigits=String(d.country||'+967').replace(/\D/g,'');
   if(national.startsWith(dialDigits))national=national.slice(dialDigits.length);
   phoneE164='+'+dialDigits+national;
  }
  if(!/^\+[1-9][0-9]{7,14}$/.test(phoneE164)){toast('أدخل رقم هاتف صحيحاً مع اختيار الدولة المناسبة');return}
  authBusy=true;setBusy(true,'جارٍ حفظ بياناتك...');
  try{
   await SahmSupabase.completeProfile(d.fullName,phoneE164,selectedAvatarKey);
   activeProfile=await SahmSupabase.profile();
   db.session=true;db.verified=true;db.user=Object.assign(db.user,{id:activeProfile.id,name:activeProfile.fullName,phone:activeProfile.phone,city:activeProfile.city,avatarKey:activeProfile.avatarKey});
   resetNavigation((new URLSearchParams(location.search).get('invite')||new URLSearchParams(location.search).get('join'))?'join-group':'home',{});
   toast('اكتمل ملفك الشخصي');
  }catch(err){toast(SahmSupabase.friendlyError(err));}
  finally{authBusy=false;setBusy(false);}
  return;
 }
 e.preventDefault();
 if(form.id==='createForm'){
  if(createWizardStep<2){if(validateCreateStep(createWizardStep))setCreateWizardStep(createWizardStep+1);return}
  if(createGroupBusy)return;
  if(!validateCreateStep(1)||!validateCreateStep(2))return;
  createGroupBusy=true;
  const submit=$('#create-final-submit'),oldLabel=submit?submit.textContent:'';
  if(submit){submit.disabled=true;submit.textContent='جارٍ إنشاء الجمعية...'}
  try{
   const result=await SahmApp.createGroup(createDraft(form));
   if(result&&result.ok){
    refreshData();currentGroupId=result.groupId;createdGroupId=result.groupId;
    createdGroupLink=result.publicLink||null;createdLinkWarning=result.linkWarning||null;
    resetNavigation('created-group',{});toast('تم إنشاء الجمعية وحفظ بياناتها');
   }else toast(result&&result.message||'تعذر إنشاء الجمعية');
  }catch(error){toast(SahmSupabase.friendlyError(error));}
  finally{createGroupBusy=false;if(submit&&submit.isConnected){submit.disabled=false;submit.textContent=oldLabel;}}
  return;
 }
 if(form.id==='inviteeManualForm'){
  const d=Object.fromEntries(new FormData(form));
  if(String(d.name||'').trim().length<2){toast('أدخل اسم جهة الاتصال');return}
  if(!String(d.phone||'').trim()){toast('أدخل رقم الهاتف');return}
  if(pendingInvitees.length>=50){toast('يمكن إضافة 50 جهة اتصال كحد أقصى في العملية الواحدة');return}
  if(addInviteeToSelection(d.name,d.phone)){form.reset();renderInviteeSelection();toast('أضيفت جهة الاتصال إلى القائمة')}
  return;
 }
 if(form.id==='joinForm'){
  const d=new FormData(form),raw=String(d.get('code')||'').trim();
  let token=raw,source='invitation';
  try{const url=new URL(raw,location.origin);if(url.searchParams.get('join')){token=url.searchParams.get('join');source='public_link'}else if(url.searchParams.get('invite'))token=url.searchParams.get('invite');}catch(_){}
  if(source==='public_link'){
   const preview=await SahmSupabaseData.previewPublicJoinLink(token);
   if(!preview||!preview.ok){toast(preview&&preview.message||'رابط الانضمام العام غير متاح');return}
   showJoinRequestForm(preview.link,'public_link',token);return;
  }
  const preview=await SahmSupabaseData.previewInvite(token);
  if(!preview||!preview.ok){toast(preview&&preview.message||'رابط الدعوة غير صحيح أو منتهي');return}
  const info=preview.invite;pendingJoinCode=token;
  if(info.isLegacyInvitation){
   showModal('دعوة قديمة','<b>'+escapeHtml(info.name)+'</b><div class="keyvalue"><span>المدير</span><b>'+escapeHtml(info.managerName)+'</b></div><div class="keyvalue"><span>أسهم الدعوة القديمة</span><b>'+Number(info.sharesRequested||0)+'</b></div><p>هذه دعوة سابقة وفق النظام القديم. قبولها يحافظ على مسار التوافق القديم ويعتمد العضوية مباشرة.</p>',[['قبول الدعوة القديمة','join-confirm','primary'],['إغلاق','close','outline']]);
   $('#modal-root').dataset.invitationId=info.invitationId;return;
  }
  pendingJoinContext={source:'invitation',token:token,info:info,invitationId:info.invitationId};
  const body='<b>'+escapeHtml(info.name)+'</b><div class="keyvalue"><span>المدير</span><b>'+escapeHtml(info.managerName)+'</b></div><div class="keyvalue"><span>بداية الجمعية</span><b>'+dateLabel(info.startDate)+'</b></div><div class="keyvalue"><span>أول قرعة</span><b>'+dateLabel(info.firstDrawOn)+'</b></div><div class="keyvalue"><span>مدة الدورة</span><b>'+info.cycleDays+' يومًا</b></div><div class="keyvalue"><span>حصة السهم</span><b>'+minorMoney(info.shareAmountMinor,info.currency)+'</b></div><div class="keyvalue"><span>عدد الأقساط</span><b>'+info.installments+'</b></div><p>اختيار «نعم» يفتح نموذج تحديد الأسهم فقط، ولا ينشئ عضوية أو التزامًا نهائيًا.</p>';
  showModal('دعوة للانضمام إلى جمعية',body,[['نعم، أرغب بالانضمام','invitation-interested','primary'],['لا، أرفض الدعوة','invitation-declined','outline'],['ليس الآن','invitation-deferred','outline']]);
  return;
 }
 if(form.id==='joinRequestForm'){
  if(joinRequestBusy)return;
  const d=new FormData(form),shares=Number(d.get('requestedShares'));
  if(!Number.isInteger(shares)||shares<1){toast('أدخل عدد أسهم صحيحًا وموجبًا');return}
  if(!d.get('confirmCommitment')){toast('أكد مراجعة عدد الأسهم والالتزام المالي');return}
  if(!pendingJoinContext){toast('انتهت جلسة رابط الانضمام؛ افتح الرابط مجددًا');return}
  joinRequestBusy=true;
  const submit=form.querySelector('button[type="submit"]'),oldLabel=submit?submit.textContent:'';
  if(submit){submit.disabled=true;submit.textContent='جارٍ إرسال الطلب...'}
  try{
   const context=pendingJoinContext;
   const result=context.source==='invitation_id'
    ?await SahmSupabaseData.submitJoinRequestByInvitation(context.invitationId,shares)
    :await SahmSupabaseData.submitJoinRequest(context.source,context.token,shares);
   if(result&&result.ok){
    lastSubmittedRequestId=result.request_id;pendingJoinContext=null;pendingJoinCode=null;
    refreshData();toast('تم إرسال طلب الانضمام إلى المدير');go('join-request-status',{id:result.request_id,groupName:context.info&&context.info.name||''});
   }else toast(result&&result.message||'تعذر إرسال طلب الانضمام');
  }catch(error){toast(SahmSupabase.friendlyError(error));}
  finally{
   joinRequestBusy=false;
   if(submit){submit.disabled=false;submit.textContent=oldLabel;}
  }
  return;
 }
 if(form.id==='chatForm'){
  const txt=String(new FormData(form).get('text')||'').trim();if(!txt||txt.length>SahmApp.maxMessage()){toast('الحد الأقصى للرسالة '+SahmApp.maxMessage()+' حرفًا');return}
  const g=currentGroup(),r=await SahmApp.sendMessage(g.id,txt);if(r&&r.ok){refreshData();chat();toast('تم إرسال الرسالة')}return;
 }
 if(form.id==='profileForm'){
  const d=Object.fromEntries(new FormData(form)),r=await SahmSupabaseData.updateMyProfile(d.name,d.city||'');
  if(r&&r.ok){activeProfile=await SahmSupabase.profile();refreshData();profile();toast('تم تحديث بيانات الملف الشخصي');}
  return;
 }
});
navigation=SahmNavigation.create({window:window,onChange:(state)=>applyNavigationState(state,true)});
async function bootSahm(){
 try{
  const session=await SahmSupabase.session();
  if(session&&session.user){
   activeProfile=await SahmSupabase.profile(session.user.id);
   await SahmSupabaseData.init(activeProfile);SahmSupabaseData.install();db=load();currentGroupId=(db.groups[0]||{}).id||null;startRemoteRealtime();
   db.session=true;db.verified=!!session.user.email_confirmed_at;
   db.user=Object.assign(db.user,{id:session.user.id,email:session.user.email,name:activeProfile.fullName,phone:activeProfile.phone,city:activeProfile.city,avatarKey:activeProfile.avatarKey});
   selectedAvatarKey=activeProfile.avatarKey||'avatar-01';
   screenName=(location.hash.includes('reset-password')||new URLSearchParams(location.search).get('auth_action')==='reset-password')?'reset-password':(activeProfile.completed?((new URLSearchParams(location.search).get('invite')||new URLSearchParams(location.search).get('join'))?'join-group':'home'):'profile-setup');
  }else{db.session=false;screenName='welcome'}
  SahmSupabase.onAuthStateChange((event,sess)=>{
   if(event==='PASSWORD_RECOVERY'){resetNavigation('reset-password',{});return;}
   if(event==='SIGNED_OUT'){SahmSupabaseData.clear();db={session:false,verified:false,user:{id:null,name:'',phone:'',city:'',email:'',avatarKey:'avatar-01',notifications:true,biometric:false},groups:[],unread:0};currentGroupId=null;screenName='welcome';resetNavigation('welcome',{});}
  });
 }catch(err){
  db.session=false;screenName='welcome';
  console.warn('SAHM authentication bootstrap:',err);
  setTimeout(()=>toast(SahmSupabase.friendlyError(err)),350);
 }
 navigation.start(routeSnapshot());
 try{render()}catch(err){document.querySelector('#screen').className='auth-screen';document.querySelector('#screen').innerHTML='<div style="background:white;color:#142f39;border-radius:18px;padding:20px;margin-top:35px"><h2>تعذر تشغيل المعاينة</h2><p>حدث خطأ أثناء تشغيل الواجهة. أعد فتح الملف في متصفح Chrome.</p><small>'+String(err&&err.message||err)+'</small></div>';console.error(err)}
}
bootSahm();
</script>
<script>
/* Sahm PWA: automatic activation and network-first app documents. */
if ('serviceWorker' in navigator) {
  let sahmReloading = false;
  const activateWaitingWorker = registration => {
    if (registration && registration.waiting) {
      registration.waiting.postMessage({ type: 'SKIP_WAITING' });
    }
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (sahmReloading) return;
    sahmReloading = true;
    window.location.reload();
  });
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('/sw.js', {
        scope: '/',
        updateViaCache: 'none'
      });
      activateWaitingWorker(registration);
      registration.addEventListener('updatefound', () => {
        const worker = registration.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed') activateWaitingWorker(registration);
        });
      });
      await registration.update();
      activateWaitingWorker(registration);
      window.setInterval(() => {
        if (document.visibilityState === 'visible') {
          registration.update().catch(error => console.warn('Sahm update check failed:', error));
        }
      }, 300000);
      window.addEventListener('focus', () => registration.update().catch(() => {}));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') registration.update().catch(() => {});
      });
    } catch (error) {
      console.warn('Sahm service worker registration failed:', error);
    }
  });
}</script></div></body></html>
