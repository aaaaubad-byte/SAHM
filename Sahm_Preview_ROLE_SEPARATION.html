<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#3158d6">
<meta name="application-name" content="سهم">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سهم">

<link rel="manifest" href="/manifest.webmanifest">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>سهم | إدارة الجمعيات التساهمية</title>
<style>

/* Consolidated Sahm CSS — one current theme and one authoritative layout. */
* {
  box-sizing: border-box;
}
button {
  cursor: pointer;
  border: 0;
}
.phone {
  max-width: 430px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.brand-mark {
  display: grid;
  place-items: center;
  font-weight: 800;
}
.dot {
  position: absolute;
  border-radius: 50%;
}
.screen {
  overflow: auto;
  flex: 1;
  min-height: 0;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}
.screen::-webkit-scrollbar {
  width: 3px;
}
.screen::-webkit-scrollbar-thumb {
  border-radius: var(--radius-small);
}
.bottomnav {
  display: flex;
  justify-content: space-around;
}
.navitem {
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.navitem .ni {
  font-size: 21px;
}
.navitem.active {
  font-weight: 700;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-head h3 {
  margin: 0;
}
.link-btn {
  background: transparent;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.stat b {
  display: block;
}
.progress {
  overflow: hidden;
}
.progress i {
  height: 100%;
  display: block;
  border-radius: var(--radius-small);
}
.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  background: var(--ink);
  color: #fff;
}
.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.row {
  display: flex;
  align-items: center;
}
.between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.avatar {
  display: grid;
  place-items: center;
  font-weight: 800;
  flex: none;
}
.listrow {
  display: flex;
  align-items: center;
  border-bottom: 1px solid #eff2f1;
}
.listrow:last-child {
  border: 0;
  padding-bottom: 0;
}
.listrow:first-child {
  padding-top: 0;
}
.grow {
  flex: 1;
  min-width: 0;
}
.listrow strong {
  display: block;
}
.listrow small {
  display: block;
  margin-top: 3px;
}
.amount {
  white-space: nowrap;
}
.field label {
  display: block;
}
.field input {
  width: 100%;
  outline: none;
}
.field select {
  width: 100%;
  outline: none;
}
.field textarea {
  width: 100%;
  outline: none;
}
.searchbox {
  width: 100%;
  outline: none;
}
.field textarea {
  resize: vertical;
  line-height: 1.8;
}
.formgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.segmented {
  display: flex;
}
.segmented button {
  flex: 1;
  background: transparent;
  color: #697b7d;
  font-weight: 700;
}
.segmented button.active {
  background: #fff;
}
.tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
}
.tabs button {
  background: none;
  border-bottom: 2px solid transparent;
}
.tabs button.active {
  font-weight: 800;
}
.toolbar {
  display: flex;
  align-items: center;
}
.searchbox {
  flex: 1;
}
.keyvalue {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid #eff2f1;
}
.keyvalue:last-child {
  border: 0;
}
.wheel-wrap {
  display: grid;
  place-items: center;
}
.wheel {
  width: 190px;
  height: 190px;
  border: 9px solid #e9efec;
  border-radius: 50%;
  background: conic-gradient(#1b827a 0 45deg,#d7a54c 45deg 90deg,#244d59 90deg 135deg,#87b8aa 135deg 180deg,#e6c27d 180deg 225deg,#32616a 225deg 270deg,#9bc8ba 270deg 315deg,#c38e39 315deg);
  box-shadow: inset 0 0 0 5px #fff,0 5px 14px #173b4318;
  display: grid;
  place-items: center;
  position: relative;
}
.wheel::before {
  content: 'سهم';
  background: white;
  border-radius: 50%;
  width: 66px;
  height: 66px;
  display: grid;
  place-items: center;
  font-weight: 800;
  color: var(--ink);
  box-shadow: 0 2px 8px #102d351c;
}
.wheel.spin {
  animation: spin 2s cubic-bezier(.13,.72,.22,1);
}
@keyframes spin{to{transform:rotate(1440deg)}}
.receipt {
  border: 1px dashed #afc1bc;
  border-radius: var(--radius-card);
}
.chatbubble {
  border-radius: var(--radius-control) var(--radius-control) 3px var(--radius-control);
  line-height: 1.8;
  max-width: 85%;
  margin: 5px 0 5px auto;
}
.chatbubble.mine {
  border-radius: var(--radius-control) var(--radius-control) var(--radius-control) 3px;
  margin-right: auto;
  margin-left: 0;
}
.empty {
  text-align: center;
  color: var(--muted);
}
.empty .big {
  margin-bottom: 8px;
}
.empty b {
  color: var(--ink);
  display: block;
  margin-bottom: 4px;
}
.empty p {
  margin: 0 0 12px;
}
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
}
.dialog {
  background: #fff;
  width: 100%;
  overflow: auto;
  box-shadow: 0 15px 50px #061b2255;
}
.dialog h3 {
  margin: 0 0 6px;
}
.dialog .dialog-body {
  color: #4d6267;
}
.dialog-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.dialog-actions>* {
  flex: 1;
}
.toast {
  position: absolute;
  left: 50%;
  transform: translate(-50%,20px);
  background: #173941;
  color: white;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  box-shadow: var(--shadow);
}
.toast.show {
  opacity: 1;
  transform: translate(-50%,0);
}
.auth-screen {
  color: white;
  flex: 1;
  overflow: auto;
}
.auth-brand {
  text-align: center;
}
.auth-brand .brand-mark {
  margin: auto;
}
.auth-brand h1 {
  margin: 13px 0 3px;
}
.auth-brand p {
  font-size: 10px;
  color: #d2e0dc;
}
.auth-card {
  background: white;
  color: var(--ink);
}
.auth-card .field input {
  background: #f8fbfa;
}
.role-chip {
  display: inline-flex;
  align-items: center;
  border-radius: var(--radius-small);
  font-weight: 800;
}


.manager-action-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
}
.member-action-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
}
.manager-action {
  text-align: right;
  display: flex;
  flex-direction: column;
}
.member-action {
  text-align: right;
  display: flex;
  flex-direction: column;
}
:root {
  --ink: #172338;
  --ink2: #2b3d59;
  --teal: #3158d6;
  --mint: #edf2ff;
  --gold: #f1c56b;
  --bg: #f4f6fa;
  --card: #fff;
  --muted: #68778d;
  --line: #e5eaf1;
  --red: #b5434a;
  --blue: #41658d;
  --shadow: 0 8px 28px rgba(25,44,78,.07);
  --radius: var(--radius-card);
  --primary: #3158d6;
  --primary-dark: #2345b5;
  --surface: #fff;
  --surface-2: #f8f9fc;
  --radius-card: 12px;
  --radius-control: 10px;
  --radius-small: 8px;
  --radius-shell: 16px;
}
html {
  background: #e9edf4;
  color: var(--ink);
}
body {
  background: #e9edf4;
  color: var(--ink);
}
button {
  font: inherit;
}
input {
  font: inherit;
}
select {
  font: inherit;
}
textarea {
  font: inherit;
}
button {
  touch-action: manipulation;
}
.workspace {
  background: radial-gradient(ellipse at 50% 0%,#e4eaf7 0,#e9edf4 48%,#e9edf4 100%);
}
.phone {
  border: 1px solid #d8dfeb;
  border-radius: var(--radius-shell);
  background: var(--bg);
  box-shadow: 0 28px 90px rgba(23,38,69,.18);
}

.topbar {
  height: 70px;
  background: #fff;
  color: var(--ink);
  border-bottom: 1px solid var(--line);
  box-shadow: none;
}
.brand-mark {
  height: 38px;
  width: 38px;
  border-radius: var(--radius-control);
  background: var(--primary);
  color: #fff;
  font-size: 18px;
  box-shadow: 0 5px 12px #3158d626;
}
.dot {
  width: 8px;
  height: 8px;
  background: #e25d67;
  border: 2px solid #fff;
  top: 7px;
  left: 7px;
}
.screen {
  background: var(--bg);
  scrollbar-color: #cad3e1 transparent;
}
.screen::-webkit-scrollbar-thumb {
  background: #cad3e1;
}
.bottomnav {
  height: 78px;
  min-height: 78px;
  flex: 0 0 auto;
  position: relative;
  z-index: 10;
  visibility: visible;
  background: #fff;
  border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  gap: 4px;
  box-shadow: 0 -8px 22px rgba(24,41,75,.035);
}
.navitem {
  min-height: 54px;
  border-radius: 0;
  color: #8792a4;
  font-weight: 650;
  transition: background .18s,color .18s;
}
.navitem .ni {
  line-height: 24px;
}
.navitem .ni svg {
  stroke: currentColor;
  stroke-width: 1.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.navitem.active {
  color: var(--primary);
  background: #edf2ff;
}
.navitem.active .ni {
  transform: none;
}
.section-head h3 {
  font-size: 13px;
  font-weight: 850;
}
.link-btn {
  font-size: 11px;
  color: var(--primary);
  font-weight: 800;
  padding: 8px 4px;
  min-height: 32px;
}
.card {
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: 0 3px 10px rgba(23,43,79,.025);
}
.hero-num {
  font-size: 29px;
  font-weight: 850;
  letter-spacing: -.7px;
  margin-top: 7px;
}
.eyebrow {
  color: #7c899c;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0;
}
.pill {
  padding: 6px 10px;
  border-radius: var(--radius-small);
  font-size: 10px;
  font-weight: 750;
  background: #f0f2f6;
  color: #5d6b80;
}
.pill.green {
  background: #e5f5ed;
  color: #18744f;
}
.pill.gold {
  background: #fff3dc;
  color: #93641b;
}
.pill.red {
  background: #fbecee;
  color: #a83f4a;
}
.pill.blue {
  background: #eaf1ff;
  color: #3158a6;
}
.pill.dark {
  background: #e9edfa;
  color: #344a8c;
}
.stat {
  background: #fff;
  border: 1px solid var(--line);
  min-width: 0;
}
.stat b {
  font-size: 23px;
  font-weight: 850;
  color: var(--ink);
  margin: 5px 0 2px;
  letter-spacing: -.4px;
}
.stat span {
  font-size: 10px;
  color: var(--muted);
}
.progress {
  height: 7px;
  background: #edf0f5;
  border-radius: var(--radius-small);
  margin: 9px 0;
}
.progress i {
  background: linear-gradient(90deg,#3158d6,#6380eb);
}
.btn {
  min-height: 46px;
  padding: 11px 15px;
  border-radius: var(--radius-control);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0;
  transition: transform .12s,filter .12s;
}
.btn:active {
  transform: scale(.985);
}
.btn.primary {
  background: var(--primary);
  box-shadow: 0 5px 12px #3158d622;
}
.btn.primary:hover {
  background: var(--primary-dark);
}
.btn.gold {
  background: #f2c66f;
  color: #29344a;
}
.btn.soft {
  background: #edf2ff;
  color: #3158b7;
}
.btn.outline {
  background: #fff;
  border: 1px solid #dce3ed;
  color: #44546d;
}
.btn.danger {
  background: #fbecee;
  color: #a83f4a;
}
.btn.small {
  min-height: 36px;
  padding: 7px 11px;
  font-size: 10px;
  border-radius: var(--radius-control);
}
.btn.full {
  width: 100%;
}
.btn:disabled {
  box-shadow: none;
}
.row {
  gap: 11px;
}
.avatar {
  height: 40px;
  width: 40px;
  border-radius: var(--radius-control);
  background: #edf2ff;
  color: #3158b7;
  font-size: 14px;
}
.avatar.gold {
  background: #fff3df;
  color: #94651d;
}
.avatar.dark {
  background: #263958;
  color: #fff;
}
.listrow {
  border-color: #edf0f5;
}
.listrow strong {
  font-size: 12px;
  font-weight: 800;
}
.listrow small {
  font-size: 10px;
  line-height: 1.65;
  color: #78869a;
}
.amount {
  font-size: 12px;
  font-weight: 850;
  color: var(--ink);
}
.field label {
  font-size: 11px;
  font-weight: 800;
  color: #35445d;
}
.field input {
  border: 1px solid #dfe5ee;
  background: #fbfcfe;
  border-radius: var(--radius-control);
  font-size: 12px;
  color: var(--ink);
}
.field select {
  border: 1px solid #dfe5ee;
  background: #fbfcfe;
  border-radius: var(--radius-control);
  font-size: 12px;
  color: var(--ink);
}
.field textarea {
  border: 1px solid #dfe5ee;
  background: #fbfcfe;
  border-radius: var(--radius-control);
  font-size: 12px;
  color: var(--ink);
}
.searchbox {
  min-height: 48px;
  padding: 12px 13px;
  border: 1px solid #dfe5ee;
  background: #fbfcfe;
  border-radius: var(--radius-control);
  font-size: 12px;
  color: var(--ink);
}
.field input:focus {
  border-color: #6c87e8;
  box-shadow: 0 0 0 3px #3158d61c;
}
.field select:focus {
  border-color: #6c87e8;
  box-shadow: 0 0 0 3px #3158d61c;
}
.field textarea:focus {
  border-color: #6c87e8;
  box-shadow: 0 0 0 3px #3158d61c;
}
.segmented {
  background: #eef1f7;
  border-radius: var(--radius-control);
  padding: 4px;
  gap: 4px;
}
.segmented button {
  padding: 10px 7px;
  border-radius: var(--radius-control);
  font-size: 10px;
}
.segmented button.active {
  color: var(--primary);
  box-shadow: 0 2px 8px #20355b10;
}
.tabs {
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs button {
  white-space: nowrap;
  font-size: 11px;
  padding: 11px 2px;
  color: #78869a;
  min-height: 42px;
}
.tabs button.active {
  color: var(--primary);
  border-color: var(--primary);
}
.searchbox {
  min-width: 0;
}
.keyvalue {
  padding: 11px 0;
  border-color: #edf0f5;
  font-size: 11px;
}
.keyvalue b {
  color: #26364f;
  font-weight: 800;
}
.keyvalue span {
  color: #7a879a;
}
.receipt {
  border-color: #d5deea;
  background: #fcfdff;
}
.chatbubble {
  background: #edf2ff;
  font-size: 11px;
  padding: 10px 13px;
}
.chatbubble.mine {
  background: #e8f4ee;
}
.empty .big {
  font-size: 31px;
  color: #8290a6;
}
.empty b {
  font-size: 13px;
}
.empty p {
  font-size: 10px;
  line-height: 1.8;
}
.overlay {
  background: #172338a8;
  backdrop-filter: blur(4px);
}
.dialog {
  border-radius: var(--radius-card);
  padding: 19px;
  max-height: 88%;
}
.dialog h3 {
  font-size: 16px;
  font-weight: 850;
}
.dialog .dialog-body {
  font-size: 11px;
  line-height: 1.9;
}
.toast {
  bottom: 88px;
  border-radius: var(--radius-control);
  padding: 12px 16px;
  font-size: 11px;
  max-width: calc(100% - 36px);
  white-space: normal;
  text-align: center;
}
.auth-screen {
  background: radial-gradient(circle at 50% 0%,#3d65d0 0,#20345f 48%,#172843 100%);
}
.auth-brand .brand-mark {
  background: #fff;
  color: var(--primary);
  box-shadow: 0 12px 25px #0b1d3e55;
}
.auth-brand h1 {
  font-size: 28px;
  letter-spacing: -.4px;
}
.auth-card {
  box-shadow: 0 15px 35px #0c1d3b20;
}
.role-chip {
  font-size: 10px;
  padding: 6px 10px;
}
.manager-chip {
  background: #e9efff;
  color: #3153b4;
}
.member-chip {
  background: #eaf5f1;
  color: #26745e;
}
.manager-identity {
  background: linear-gradient(135deg,#202f53,#365bc0);
  color: #fff;
  border: 0;
}
.member-identity {
  background: linear-gradient(135deg,#eaf0ff,#fff);
  color: #263755;

}
.group-card {

  border-right: 1px solid var(--line);
  cursor: pointer;
  transition: transform .15s,box-shadow .15s;
}
.group-card:active {
  transform: scale(.99);
}


.manager-panel {
  border-color: #e0e7f2;
}
.member-panel {
  border-color: #e2e9f4;
  background: #fff;
}
.manager-action {
  border: 1px solid #e2e8f1;
  background: #fafbfe;
  color: #273954;
  align-items: flex-start;
  justify-content: center;
}
.member-action {
  border: 1px solid #e2e8f1;
  align-items: flex-start;
  justify-content: center;
}
.member-action {
  background: #fbfcff;
  color: #34465f;
  border-color: #e2e8f1;
}
.manager-action span {
  color: var(--primary);
}
.member-action span {
  color: var(--primary);
}
.manager-action b {
  font-weight: 850;
}
.member-action b {
  font-weight: 850;
}
.manager-action small {
  font-size: 10px;
  color: #7a8799;

.member-action small {
  font-size: 10px;
  color: #7a8799;

}

}
.group-identity .eyebrow {

  opacity: .75;
}

button:focus-visible {
  outline: 3px solid #8da4f4;
  outline-offset: 2px;
}
a:focus-visible {
  outline: 3px solid #8da4f4;
  outline-offset: 2px;
}
input:focus-visible {
  outline: 3px solid #8da4f4;
  outline-offset: 2px;
}
select:focus-visible {
  outline: 3px solid #8da4f4;
  outline-offset: 2px;
}
textarea:focus-visible {
  outline: 3px solid #8da4f4;
  outline-offset: 2px;
}
@media(max-width:600px) {
  .workspace {
  background: var(--bg);
}
  .phone {
  max-width: none;
  box-shadow: none;
}
  .topbar {
    height: 66px;
    padding-inline: 17px;
  }
  .screen {
    padding: 19px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .bottomnav {
    height: calc(76px + env(safe-area-inset-bottom));
    min-height: 76px;
    flex: 0 0 auto;
    position: relative;
    z-index: 10;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }
  .auth-screen {
    padding-top: calc(20px + env(safe-area-inset-top));

function ticketOwners(g){
 const participants=(db.participants||[]).filter(m=>m.group===g.id);
 const tickets=[];
 for(const member of participants){
  for(let n=0;n<Math.max(0,Number(member.shares)||0);n++)tickets.push({ticketNo:tickets.length+1,owner:member.name});
 }
 return tickets;
}
function eligibleTickets(g){
 const excluded=new Set((g.draws||[]).map(d=>Number(d.ticketNo)).filter(Boolean));
 return ticketOwners(g).filter(t=>!excluded.has(t.ticketNo));
}
function secureIndex(n){
 if(!n)throw new Error('No eligible tickets');
 if(!window.crypto||!window.crypto.getRandomValues)throw new Error('Secure random generator unavailable');
 const a=new Uint32Array(1),limit=Math.floor(0x100000000/n)*n;let x;
 do{window.crypto.getRandomValues(a);x=a[0]}while(x>=limit);
 return x%n;
}

function createReceipt(p){const id='SH-2026-'+String(db.receipts.length+9).padStart(4,'0');db.receipts.unshift({id,group:p.group,person:p.person,amount:p.amount,cycle:p.cycle,ref:p.ref,date:today()});db.wall.unshift({group:p.group,type:'system',text:`تم اعتماد إيصال سداد ${p.person} للدورة ${p.cycle}`,date:today(),reactions:0});log('اعتماد إثبات سداد وإصدار إيصال',db.user.name);return id}
// One delegated click router keeps visible controls and auxiliary actions in one place.
function handleAuxiliaryClick(e){
 const el=e.target.closest('[data-action="submit-join"]');
 if(el){
  const code=$('#modal-root').dataset.group,g=db.groups.find(x=>x.id===code),n=Math.max(1,Math.min(g.maxPer,+$('#joinShares').value||1));
  const pending=db.invites.filter(i=>i.group===g.id&&i.status==='PENDING').reduce((a,i)=>a+i.shares,0);
  if(g.shares+pending+n>g.total){toast('لا يتوفر هذا العدد من الأسهم');return true}
  db.invites.unshift({id:'I-'+Date.now(),group:g.id,name:db.user.name,phone:db.user.phone,shares:n,status:'PENDING'});
  log('إرسال طلب انضمام إلى '+g.name);save();closeModal();toast('أرسل طلب الانضمام وينتظر موافقة المدير');return true;
 }
 if(e.target.id==='notifToggle'){db.user.notifications=e.target.checked;save();toast('تم تحديث إعداد التنبيهات');return true}
 if(e.target.id==='bioToggle'){db.user.biometric=e.target.checked;save();toast('تم تحديث إعداد حماية الجلسة');return true}
 const filter=e.target.closest('[data-action="installment-filter"]');
 if(filter){
  document.querySelectorAll('[data-action="installment-filter"]').forEach(x=>x.classList.toggle('active',x===filter));
  const value=filter.dataset.filter;
  document.querySelectorAll('#installmentRows .listrow').forEach(row=>{const tx=row.textContent;const visible=value==='all'||(value==='pending'?/غير مسدد|متأخر|قيد المراجعة/.test(tx):tx.includes(statusText(value)));row.style.display=visible?'':'none'});
  return true;
 }
 const action=e.target.closest('[data-action]')?.dataset.action;
 if(action==='send-otp'){
  const phone=$('#phoneInput').value.trim();if(phone.length<8){toast('أدخل رقم هاتف صحيحاً');return true}
  db.user.phone=phone;save();toast('تم إرسال رمز التحقق');go('otp');return true;
 }
 if(action==='verify-otp'){
  if($('#otpInput').value.trim()!==db.otp){toast('رمز التحقق غير صحيح. حاول مجدداً');return true}
  db.verified=true;save();go('profile-setup');return true;
 }
 if(action==='resend-otp'){toast('تمت إعادة إرسال الرمز التجريبي 246810');return true}
 return false;
}
document.addEventListener('keydown',e=>{const card=e.target.closest?.('.group-card[role="button"]');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();card.click()}});
document.addEventListener('click',e=>{if(handleAuxiliaryClick(e))return;const el=e.target.closest('[data-go],[data-action]');if(!el)return;const goTo=el.dataset.go,act=el.dataset.action;if(goTo){if(goTo==='group-detail')db.currentGroup=el.dataset.id||db.currentGroup;if(goTo==='groups')groupTab='all';go(goTo);return}if(act==='back'){back();return}if(act==='overlay-close'){closeModal();return}if(act==='close'){closeModal();return}switch(act){case'open-manager-review':{const g=db.groups.find(x=>x.role==='manager'&&db.payments.some(p=>p.group===x.id&&['PROOF_SUBMITTED','UNDER_REVIEW'].includes(p.status)));if(g){db.currentGroup=g.id;go('review')}else toast('لا توجد إثباتات معلقة في جمعياتك');break}case'open-group':db.currentGroup=el.dataset.id;groupDetailTab='overview';save();go('group-detail');break;case'home-managed':groupTab='manager';go('groups');break;case'home-member':groupTab='member';go('groups');break;case'home-slide':setHomeSlide(Number(el.dataset.index)||0);break;case'group-tab':groupTab=el.dataset.tab;groups();break;case'detail-tab':groupDetailTab=el.dataset.tab;groupDetail();break;case'invite-mode':if(el.dataset.mode==='link'){$('#inviteContent').innerHTML=`<div class="card"><div class="eyebrow">رابط الانضمام العام</div><b style="font-size:12px">${currentGroup().publicLink}</b><button class="btn primary full" style="margin-top:12px" data-action="share-link">نسخ رابط الدعوة</button><button class="btn outline full" style="margin-top:8px" data-action="whatsapp-link">مشاركة عبر واتساب</button></div>`}else{$('#inviteContent').innerHTML=`<form id="inviteForm"><div class="field"><label>اسم المدعو</label><input name="name" required></div><div class="field"><label>رقم الهاتف</label><input name="phone" required inputmode="tel"></div><div class="field"><label>عدد الأسهم</label><input name="shares" type="number" min="1" max="${currentGroup().maxPer}" value="1" required></div><button class="btn primary full" type="submit">إرسال الدعوة</button></form>`}document.querySelectorAll('[data-action="invite-mode"]').forEach(b=>b.classList.toggle('active',b===el));break;case'share-link':if(navigator.clipboard?.writeText){navigator.clipboard.writeText(currentGroup().publicLink).then(()=>toast('تم نسخ رابط الدعوة')).catch(()=>toast(currentGroup().publicLink))}else toast(currentGroup().publicLink);break;case'whatsapp-link':window.open('https://wa.me/?text='+encodeURIComponent('انضم إلى جمعية '+currentGroup().name+' عبر الرابط '+currentGroup().publicLink),'_blank');break;case'invite-accept':{if(!isManager()){toast('لا تملك صلاحية إدارة العضويات');break}let i=db.invites.find(x=>x.id===el.dataset.id);if(i){let g=db.groups.find(x=>x.id===i.group);if(g.shares+i.shares>g.total){toast('اكتمل عدد الأسهم المستهدف');break}i.status='ACCEPTED';g.members++;g.shares+=i.shares;db.participants=db.participants||[];db.participants.push({group:g.id,name:i.name,shares:i.shares,role:'member',present:false});if(g.shares>=g.total)g.status='READY_FOR_DRAW';log('قبول دعوة '+i.name);save();invites()}break}case'invite-reject':{if(!isManager()){toast('لا تملك صلاحية إدارة العضويات');break}let i=db.invites.find(x=>x.id===el.dataset.id);if(i){i.status='REJECTED_INV';log('رفض دعوة '+i.name);save();invites()}break}case'pause-group':{if(!isManager()){toast('لا تملك صلاحية إدارة هذه الجمعية');break}const g=currentGroup();if(g.status==='PAUSED_DEFAULT'){g.status=g.statusBeforePause||'ACTIVE_REVOLVING';delete g.statusBeforePause;log('إعادة تفعيل الجمعية')}else{g.statusBeforePause=g.status;g.status='PAUSED_DEFAULT';log('إيقاف الجمعية مؤقتاً')}save();groupDetail();break}case'start-review':{let p=db.payments.find(x=>x.id===el.dataset.id);if(p){p.status='UNDER_REVIEW';log('بدء مراجعة إثبات السداد');save();review()}break}case'approve-payment':{if(!isManager()){toast('لا تملك صلاحية مراجعة السداد');break}let p=db.payments.find(x=>x.id===el.dataset.id);if(p){p.status='VERIFIED_PAID';let id=createReceipt(p);save();showModal('تم اعتماد السداد',`تم إنشاء الإيصال رقم <b>${id}</b>. يمكنك فتحه من سجل الإيصالات.`,[['عرض الإيصال','open-new-receipt','primary'],['إغلاق','close','outline']]);$('#modal-root').dataset.receipt=id}break}case'open-new-receipt':{const id=$('#modal-root').dataset.receipt;closeModal();go('receipt-detail',{id});break}case'reject-payment':{if(!isManager()){toast('لا تملك صلاحية مراجعة السداد');break}const p=db.payments.find(x=>x.id===el.dataset.id);if(p){p.status='REJECTED';log('رفض إثبات السداد');save();toast('تم رفض الإثبات');review()}break}case'member-vote':{const g=currentGroup();db.memberVotes=db.memberVotes||{};db.memberVotes[g.id]=true;const me=(db.participants||[]).find(m=>m.group===g.id&&m.name===db.user.name);if(me)me.present=true;save();memberVote();toast('تم تسجيل حضورك وتصويتك بعدد أسهمك');break;}case'vote-draw':{const g=currentGroup(),participants=(db.participants||[]).filter(m=>m.group===g.id);const present=participants.reduce((n,m)=>n+(m.present===false?0:(Number(m.shares)||0)),0)||1;const yes=Math.max(1,Math.ceil(present*.6)),no=Math.max(0,present-yes);db.drawVotes=db.drawVotes||{};db.drawVotes[g.id]={yes,no,simulation:true};save();drawRoom();toast('تم تحديث محاكاة التصويت');break;}case'run-draw':{const g=currentGroup(),wheel=$('#wheel');if(wheel){wheel.classList.add('spin');el.disabled=true;setTimeout(()=>{const eligible=eligibleTickets(g);if(!eligible.length){toast('لا توجد أسهم مؤهلة متبقية');return}let picked;try{picked=eligible[secureIndex(eligible.length)]}catch(err){toast('تعذر توفير عشوائية آمنة في هذا المتصفح');return}const winner=picked.owner;const shareNo=ticketOwners(g).filter(t=>t.owner===winner&&t.ticketNo<=picked.ticketNo).length;const cycle=(g.cycle||0)+1;const d={cycle,winner,shareNo,ticketNo:picked.ticketNo,date:today()};g.draws.push(d);g.cycle=cycle;g.status='ACTIVE_REVOLVING';db.wall.unshift({group:g.id,type:'system',text:`أعلنت نتيجة قرعة الدورة ${cycle}: فاز ${winner} بالسهم رقم ${d.shareNo}`,date:today(),reactions:0});log('تنفيذ قرعة الدورة '+cycle,'النظام');if(db.drawVotes)delete db.drawVotes[g.id];save();showModal('نتيجة القرعة',`<div style="text-align:center"><div class="receipt-mark">★</div><div style="font-size:17px;font-weight:800;color:var(--ink);margin:8px">${winner}</div><div>السهم الفائز رقم ${d.shareNo}</div></div>`,[['عرض المحضر','open-draw-history','primary'],['إغلاق','close','outline']])},2050)}break}case'open-draw-history':closeModal();go('draw-history');break;case'replay-draw':showModal('إعادة محاكاة النتيجة',`هذه إعادة عرض للنتيجة المسجلة للدورة ${el.dataset.cycle}. لا يتم إجراء سحب جديد ولا تغيير النتيجة.`,[['عرض النتيجة','replay-animation','primary'],['إغلاق','close','outline']]);$('#modal-root').dataset.cycle=el.dataset.cycle;break;case'replay-animation':{const c=$('#modal-root').dataset.cycle;const d=currentGroup().draws.find(x=>x.cycle==c);closeModal();showModal('نتيجة الدورة '+c,`الفائز المسجل: <b>${d?.winner||'—'}</b> · السهم رقم ${d?.shareNo||'—'}.<div class="wheel-wrap"><div class="wheel"></div></div>`,[['إغلاق','close','primary']]);break}case'receipt-open':go('receipt-detail',{id:el.dataset.id});break;case'verify-receipt':showModal('نتيجة التحقق',`الإيصال موجود ضمن بيانات المعاينة ورقمه ${params.id||''}. لا يمكن إجراء تحقق تشفيري حقيقي دون خدمة الخادم.`,[['حسناً','close','primary']]);break;case'react':{const idx=Number(el.dataset.index);const arr=db.wall.filter(w=>w.group===currentGroup().id);if(arr[idx])arr[idx].reactions=(arr[idx].reactions||0)+1;save();wall();toast('تم تسجيل تفاعلك');break}case'logout-confirm':showModal('تسجيل الخروج',`هل تريد إنهاء جلستك الحالية؟ لن يتم حذف بيانات المعاينة المحفوظة على هذا الجهاز.`,[['نعم، تسجيل الخروج','logout-now','danger'],['إلغاء','close','outline']]);break;case'logout-now':db.session=false;save();stack=[];closeModal();screenName='logged-out';render();break;default:break}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='createForm'){const d=Object.fromEntries(new FormData(f));const newId='G-'+Math.floor(2404+Math.random()*500);const g={id:newId,name:d.name,currency:d.currency,share:+d.share,total:+d.total,maxPer:+d.maxPer,start:d.start,first:d.first,period:d.period,quorum:+d.quorum,role:'manager',myShares:1,status:'PENDING_MEMBERS',members:1,shares:1,paid:0,cycle:0,admin:db.user.name,contrib:+d.share,publicLink:'sahm.app/join/'+newId,draws:[]};db.groups.unshift(g);db.participants=db.participants||[];db.participants.unshift({group:g.id,name:db.user.name,shares:1,role:'manager',present:true});db.currentGroup=g.id;log('إنشاء جمعية جديدة: '+g.name);save();go('group-detail');toast('تم إنشاء الجمعية وتوليد رابط الدعوة');}

<script>
/* Sahm PWA: automatic activation and network-first app documents. */
if ('serviceWorker' in navigator) {
  let sahmReloading = false;
  const activateWaitingWorker = registration => {
    if (registration && registration.waiting) {
      registration.waiting.postMessage({ type: 'SKIP_WAITING' });
    }
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (sahmReloading) return;
    sahmReloading = true;
    window.location.reload();
  });
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('/sw.js', {
        scope: '/',
        updateViaCache: 'none'
      });
      activateWaitingWorker(registration);
      registration.addEventListener('updatefound', () => {
        const worker = registration.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed') activateWaitingWorker(registration);
        });
      });
      await registration.update();
      activateWaitingWorker(registration);
      window.setInterval(() => {
        if (document.visibilityState === 'visible') {
          registration.update().catch(error => console.warn('Sahm update check failed:', error));
        }
      }, 300000);
      window.addEventListener('focus', () => registration.update().catch(() => {}));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') registration.update().catch(() => {});
      });
    } catch (error) {
      console.warn('Sahm service worker registration failed:', error);
    }
  });
}</script></div></body></html>
