.role-chip{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:800}
.manager-chip{background:#203c42;color:#fff}
.member-chip{background:#e8f0ed;color:#315d53}
.manager-identity{background:linear-gradient(145deg,#18363d,#31565a);color:#fff;border:0}
.member-identity{background:linear-gradient(145deg,#f1e7d4,#faf5ea);color:#4c4233;border:1px solid #e8ddc8}
.group-card{border-right:4px solid transparent;cursor:pointer}
.manager-card{border-right-color:#203c42}
.member-card{border-right-color:#c6a36c}
.manager-panel{border-color:#d4e0de}
.member-panel{border-color:#e7dcc8;background:#fffdf9}
.manager-action-grid,.member-action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.manager-action,.member-action{min-height:108px;border-radius:15px;padding:13px 11px;text-align:right;display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid #dce6e3;background:#f7faf9;color:#203b40}
.member-action{border-color:#e9dfcf;background:#fffaf2;color:#514431}
.manager-action span,.member-action span{font-size:21px}

.manager-action small,.member-action small{font-size:9px;color:#788783}
.member-tabs button.active{color:#745b34;border-bottom-color:#c3a16a}

/* Sahm visual system — redesigned for a calm, finance-first Arabic experience */
:root{
 --ink:#172338;--ink2:#2b3d59;--teal:#3158d6;--mint:#edf2ff;--gold:#f1c56b;
 --bg:#f4f6fa;--card:#fff;--muted:#68778d;--line:#e5eaf1;--red:#b5434a;--blue:#41658d;
 --shadow:0 8px 28px rgba(25,44,78,.07);--radius:20px;
 --primary:#3158d6;--primary-dark:#2345b5;--surface:#fff;--surface-2:#f8f9fc;
}
html,body{background:#e9edf4;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.workspace{background:radial-gradient(ellipse at 50% 0%,#e4eaf7 0,#e9edf4 48%,#e9edf4 100%);padding:20px}
.phone{width:min(100%,480px);height:min(940px,calc(100dvh - 40px));min-height:660px;border:1px solid #d8dfeb;border-radius:30px;background:var(--bg);box-shadow:0 28px 90px rgba(23,38,69,.18)}
.statusbar{display:none}
.topbar{height:70px;background:#fff;color:var(--ink);padding:0 20px;border-bottom:1px solid var(--line);box-shadow:none}
.brand{gap:11px;font-size:15px}
.brand-mark{height:38px;width:38px;border-radius:13px;background:var(--primary);color:#fff;font-size:18px;box-shadow:0 5px 12px #3158d626}
.top-brand-copy{display:flex;flex-direction:column;gap:2px}
.top-brand-copy strong{font-size:15px;font-weight:850;line-height:1.2}
.top-brand-copy small{font-size:10px;color:var(--muted);font-weight:600}
.top-actions{gap:8px}
.icon-btn{width:42px;height:42px;min-width:42px;border-radius:14px;background:#f4f6fb;color:#3d4e68;display:grid;place-items:center;position:relative;border:1px solid #edf0f6}
.icon-btn svg{width:19px;height:19px}
.dot{width:8px;height:8px;background:#e25d67;border:2px solid #fff;top:7px;left:7px}
.screen{background:var(--bg);padding:22px 18px calc(28px + env(safe-area-inset-bottom));scrollbar-color:#cad3e1 transparent}
.screen::-webkit-scrollbar-thumb{background:#cad3e1}
.bottomnav{height:78px;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:4px;box-shadow:0 -8px 22px rgba(24,41,75,.035)}
.navitem{flex:1;min-width:0;min-height:54px;gap:4px;border-radius:15px;color:#8792a4;font-size:10px;font-weight:650;transition:background .18s,color .18s}
.navitem .ni{height:24px;line-height:24px;display:grid;place-items:center}
.navitem .ni svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.navitem.active{color:var(--primary);background:#edf2ff}
.navitem.active .ni{transform:none}
.page-title{font-size:21px;font-weight:850;letter-spacing:-.35px;margin:0 0 4px}
.page-sub{display:block;color:var(--muted);font-size:11px;line-height:1.8;margin:0;max-width:44ch}
.screen-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 17px}
.back-btn{height:40px;min-width:44px;padding:0 12px;border:1px solid var(--line);background:#fff;color:#4b5c73;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:750}
.back-btn svg{width:17px;height:17px}
.section-head{margin:21px 1px 11px}
.section-head h3{font-size:13px;font-weight:850}
.link-btn{font-size:11px;color:var(--primary);font-weight:800;padding:8px 4px;min-height:32px}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;margin-bottom:11px;box-shadow:0 3px 10px rgba(23,43,79,.025)}
.hero{background:linear-gradient(125deg,#1b2d53 0%,#3158d6 100%);color:#fff;border:0;border-radius:22px;padding:19px;box-shadow:0 12px 24px rgba(39,75,177,.16)}
.hero:after{content:"س";font-family:serif;left:12px;top:-36px;font-size:166px;color:#ffffff0b}
.hero .eyebrow{color:#d6e0ff}
.hero .page-sub{color:#dce5ff}
.hero-num{font-size:29px;font-weight:850;letter-spacing:-.7px;margin-top:7px}
.hero-row{align-items:center;margin-top:11px}
.hero .btn.gold{background:#f3ca76;color:#28324a}
.eyebrow{color:#7c899c;font-size:10px;font-weight:650;letter-spacing:0}
.pill{padding:6px 10px;border-radius:999px;font-size:10px;font-weight:750;background:#f0f2f6;color:#5d6b80}
.pill.green{background:#e5f5ed;color:#18744f}.pill.gold{background:#fff3dc;color:#93641b}
.pill.red{background:#fbecee;color:#a83f4a}.pill.blue{background:#eaf1ff;color:#3158a6}
.pill.dark{background:#e9edfa;color:#344a8c}
.grid2{gap:10px}
.stat{padding:14px;border-radius:17px;background:#fff;border:1px solid var(--line);min-width:0}
.stat b{font-size:23px;font-weight:850;color:var(--ink);margin:5px 0 2px;letter-spacing:-.4px}
.stat span{font-size:10px;color:var(--muted)}
.stat .sicon{float:left;color:var(--primary);font-size:18px}
.progress{height:7px;background:#edf0f5;border-radius:10px;margin:9px 0}
.progress i{background:linear-gradient(90deg,#3158d6,#6380eb)}
.btn{min-height:46px;padding:11px 15px;border-radius:14px;font-size:12px;font-weight:800;letter-spacing:0;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--primary);box-shadow:0 5px 12px #3158d622}
.btn.primary:hover{background:var(--primary-dark)}
.btn.gold{background:#f2c66f;color:#29344a}
.btn.soft{background:#edf2ff;color:#3158b7}
.btn.outline{background:#fff;border:1px solid #dce3ed;color:#44546d}
.btn.danger{background:#fbecee;color:#a83f4a}
.btn.small{min-height:36px;padding:7px 11px;font-size:10px;border-radius:11px}
.btn.full{width:100%}
.btn:disabled{box-shadow:none}
.row{gap:11px}
.avatar{height:40px;width:40px;border-radius:14px;background:#edf2ff;color:#3158b7;font-size:14px}
.avatar.gold{background:#fff3df;color:#94651d}.avatar.dark{background:#263958;color:#fff}
.listrow{gap:11px;padding:13px 0;border-color:#edf0f5}
.listrow strong{font-size:12px;font-weight:800}
.listrow small{font-size:10px;line-height:1.65;color:#78869a}
.amount{font-size:12px;font-weight:850;color:var(--ink)}
.field{margin:13px 0}
.field label{font-size:11px;font-weight:800;color:#35445d;margin-bottom:7px}
.field input,.field select,.field textarea,.searchbox{min-height:48px;padding:12px 13px;border:1px solid #dfe5ee;background:#fbfcfe;border-radius:13px;font-size:12px;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#6c87e8;box-shadow:0 0 0 3px #3158d61c}
.field textarea{min-height:88px}
.hint{display:block;font-size:10px;color:#738198;line-height:1.8;margin-top:6px}
.formgrid{gap:0 11px}
.segmented{background:#eef1f7;border-radius:14px;padding:4px;gap:4px}
.segmented button{padding:10px 7px;border-radius:11px;font-size:10px}
.segmented button.active{color:var(--primary);box-shadow:0 2px 8px #20355b10}

 return `<div class="screen-head"><div><h1 class="page-title">${escapeHtml(title)}</h1>${sub?`<p class="page-sub">${escapeHtml(sub)}</p>`:''}</div><button class="back-btn" data-action="back" aria-label="العودة إلى الشاشة السابقة">${uiIcon('back',17)}<span>رجوع</span></button></div>`
}
function renderTopbar(title='سهم'){
 const el=$('#topbar');el.style.display='flex';
 el.innerHTML=`<div class="brand"><span class="brand-mark">س</span><div class="top-brand-copy"><strong>سهم</strong><small>${escapeHtml(title)}</small></div></div><div class="top-actions"><button class="icon-btn" data-go="notifications" aria-label="التنبيهات">${uiIcon('bell')}${db.unread?'<i class="dot"></i>':''}</button><button class="icon-btn" data-go="profile" aria-label="حسابي">${uiIcon('user')}</button></div>`
}
function nav(active){
 const items=[['home','home','الرئيسية'],['groups','groups','جمعياتي'],['wall','wall','الحائط'],['notifications','bell','التنبيهات'],['profile','user','حسابي']];
 $('#bottomnav').style.display='flex';
 $('#bottomnav').innerHTML=items.map(([s,i,t])=>`<button class="navitem ${active===s?'active':''}" data-go="${s}" aria-label="${t}" ${active===s?'aria-current="page"':''}><span class="ni">${uiIcon(i,21)}</span><span>${t}</span></button>`).join('')
}
function shell(title,active,html){renderTopbar(title);nav(active);$('#screen').className='screen';$('#screen').innerHTML=html}
function auth(html){$('#topbar').style.display='none';$('#bottomnav').style.display='none';$('#screen').className='auth-screen';$('#screen').innerHTML=html}
function groupCard(g){
 const manager=g.role==='manager',total=Number(g.total)||0,shares=Number(g.shares)||0,percent=total?Math.min(100,Math.round(shares/total*100)):0;
 return `<article class="card group-card ${manager?'manager-card':'member-card'}" data-action="open-group" data-id="${escapeHtml(g.id)}" tabindex="0" role="button" aria-label="فتح جمعية ${escapeHtml(g.name)}">
 <div class="between"><div class="row"><div class="avatar ${manager?'dark':''}">${escapeHtml(g.name.slice(0,1))}</div><div class="grow"><strong>${escapeHtml(g.name)}</strong><small class="eyebrow">${escapeHtml(g.id)} · ${manager?'إدارة الجمعية':'عضوية مشاركة'}</small></div></div>${pill(g.status)}</div>
 <div class="group-card-metrics"><div><span>قيمة السهم</span><b>${money(g.share,g.currency)}</b></div><div><span>${manager?'الأسهم المكتملة':'أسهمك'}</span><b>${manager?`${shares} / ${total}`:`${g.myShares||1} سهم`}</b></div><div><span>المشاركون</span><b>${g.members}</b></div></div>
 ${manager?`<div class="progress"><i style="width:${percent}%"></i></div><div class="progress-caption"><span>اكتمال الأسهم</span><b>${percent}%</b></div>`:''}
 <div class="group-card-footer"><span>${escapeHtml(g.period||'')}</span><span>التفاصيل ${uiIcon('arrow',15)}</span></div></article>`
}

 const managed=db.groups.filter(g=>g.role==='manager'),joined=db.groups.filter(g=>g.role==='member');
 const pending=db.payments.filter(p=>managed.some(g=>g.id===p.group)&&['PROOF_SUBMITTED','UNDER_REVIEW'].includes(p.status)).length;
 const active=db.groups.filter(g=>['ACTIVE_REVOLVING','READY_FOR_DRAW'].includes(g.status)).length;
 shell('الرئيسية','home',`
 <section class="home-welcome"><div><span class="eyebrow">مساحتك في سهم</span><h1>مرحباً، ${escapeHtml(db.user.name.split(' ')[0])}</h1><p>إدارة ومتابعة جمعياتك من مكان واحد.</p></div><div class="home-user-mark">${escapeHtml(db.user.name.slice(0,1))}</div></section>
 <section class="card hero"><div class="hero-topline"><span class="hero-label">ملخص حسابك</span><span class="hero-live"><i></i> نظرة عامة</span></div><div class="hero-total">${managed.length+joined.length}<small>جمعية مرتبطة</small></div><div class="hero-stats"><div><b>${managed.length}</b><span>تديرها</span></div><div><b>${joined.length}</b><span>تشارك فيها</span></div><div><b>${active}</b><span>نشطة</span></div></div><button class="btn gold home-create" data-go="create-group">${uiIcon('plus',16)} إنشاء جمعية جديدة</button></section>
 ${pending?`<button class="card pending-task" data-action="open-manager-review"><span class="task-icon">${uiIcon('bell',20)}</span><span class="grow"><b>تحتاج إلى مراجعة</b><small>${pending} إثباتات سداد تنتظر قرارك</small></span><span class="task-arrow">${uiIcon('arrow',17)}</span></button>`:''}

 ${managed.slice(0,2).map(groupCard).join('')||`<div class="card empty"><div class="empty-icon">${uiIcon('groups',27)}</div><b>لم تنشئ جمعية بعد</b><p>ابدأ بإنشاء جمعية وحدد قيمة السهم وعدد الأسهم.</p><button class="btn primary" data-go="create-group">إنشاء أول جمعية</button></div>`}
 <div class="section-head"><h3>جمعيات تشارك فيها</h3><button class="link-btn" data-action="home-member">عرض الكل ${uiIcon('arrow',14)}</button></div>
 ${joined.slice(0,2).map(groupCard).join('')||`<div class="card empty"><div class="empty-icon">${uiIcon('user',27)}</div><b>لا توجد عضويات حالياً</b><p>يمكنك الانضمام باستخدام رمز أو رابط دعوة.</p><button class="btn outline" data-go="join-group">الانضمام إلى جمعية</button></div>`}
 <div class="home-footnote">سهم يوثّق المساهمات والقرارات؛ ولا يستقبل الأموال أو ينفّذ التحويلات.</div>`)
}
function groups(){const own=db.groups.filter(g=>groupTab==='managed'?g.role==='manager':g.role==='member');shell('جمعياتي','groups',`${header('جمعياتي','حسابك الموحد')}<div class="segmented"><button class="${groupTab==='managed'?'active':''}" data-action="group-tab" data-tab="managed">جمعيات أديرها (${db.groups.filter(g=>g.role==='manager').length})</button><button class="${groupTab==='member'?'active':''}" data-action="group-tab" data-tab="member">جمعيات أشارك فيها (${db.groups.filter(g=>g.role==='member').length})</button></div><div class="toolbar"><input class="searchbox" id="groupSearch" placeholder="ابحث باسم الجمعية أو رمزها..."><button class="btn primary small" data-go="create-group">＋ إنشاء</button></div><div id="groupList">${own.length?own.map(groupCard).join(''):'<div class="card empty"><div class="big">▤</div><b>لا توجد جمعيات في هذا القسم</b><p>يمكنك إنشاء جمعية أو الانضمام إلى جمعية بدعوة.</p><button class="btn primary" data-go="create-group">إنشاء جمعية</button></div>'}</div><button class="btn outline full" data-go="join-group">الانضمام إلى جمعية برمز أو رابط</button>`)}

<div class="listrow"><div class="avatar">⚙</div><div class="grow"><strong>حالة الجمعية</strong><small>إيقاف الجمعية أو إعادة تفعيلها</small></div><button class="btn outline small" data-action="pause-group">${g.status==='PAUSED_DEFAULT'?'إعادة التفعيل':'إيقاف مؤقت'}</button></div></div>`;
}else{

}

 const totalShares=list.reduce((n,m)=>n+(Number(m.shares)||0),0);
 shell('المشاركون','groups',`${header('المشاركون والأسهم',g.name)}
 <div class="member-summary"><div><span>المشاركون</span><b>${list.length||g.members}</b></div><div><span>الأسهم المسجلة</span><b>${totalShares||g.shares} / ${g.total}</b></div></div>

 <div class="card" id="membersList">${list.map(m=>`<div class="listrow"><div class="avatar ${m.role==='manager'?'dark':''}">${escapeHtml(m.name.slice(0,1))}</div><div class="grow"><strong>${escapeHtml(m.name)}</strong><small>${m.role==='manager'?'مدير الجمعية':'مشارك'} · ${m.shares} ${m.shares===1?'سهم':'أسهم'}</small></div><span class="pill ${m.role==='manager'?'blue':''}">${m.shares} سهم</span></div>`).join('')||'<div class="empty"><b>لا توجد سجلات مشاركين</b></div>'}</div>

function installments(){
 const g=currentGroup();

function ticketOwners(g){
 const participants=(db.participants||[]).filter(m=>m.group===g.id);
 const tickets=[];
 for(const member of participants){
  for(let n=0;n<Math.max(0,Number(member.shares)||0);n++)tickets.push({ticketNo:tickets.length+1,owner:member.name});
 }
 return tickets;
}
function eligibleTickets(g){
 const excluded=new Set((g.draws||[]).map(d=>Number(d.ticketNo)).filter(Boolean));
 return ticketOwners(g).filter(t=>!excluded.has(t.ticketNo));
}
function secureIndex(n){
 if(!n)throw new Error('No eligible tickets');
 if(!window.crypto||!window.crypto.getRandomValues)throw new Error('Secure random generator unavailable');
 const a=new Uint32Array(1),limit=Math.floor(0x100000000/n)*n;let x;
 do{window.crypto.getRandomValues(a);x=a[0]}while(x>=limit);
 return x%n;
}

function createReceipt(p){const id='SH-2026-'+String(db.receipts.length+9).padStart(4,'0');db.receipts.unshift({id,group:p.group,person:p.person,amount:p.amount,cycle:p.cycle,ref:p.ref,date:today()});db.wall.unshift({group:p.group,type:'system',text:`تم اعتماد إيصال سداد ${p.person} للدورة ${p.cycle}`,date:today(),reactions:0});log('اعتماد إثبات سداد وإصدار إيصال',db.user.name);return id}

document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-action]');if(!el)return;const goTo=el.dataset.go,act=el.dataset.action;if(goTo){if(goTo==='group-detail')db.currentGroup=el.dataset.id||db.currentGroup;go(goTo);return}if(act==='back'){back();return}if(act==='overlay-close'){closeModal();return}if(act==='close'){closeModal();return}switch(act){case'open-manager-review':{const g=db.groups.find(x=>x.role==='manager'&&db.payments.some(p=>p.group===x.id&&['PROOF_SUBMITTED','UNDER_REVIEW'].includes(p.status)));if(g){db.currentGroup=g.id;go('review')}else toast('لا توجد إثباتات معلقة في جمعياتك');break}case'open-group':db.currentGroup=el.dataset.id;groupDetailTab='overview';save();go('group-detail');break;case'home-managed':groupTab='managed';go('groups');break;case'home-member':groupTab='member';go('groups');break;case'group-tab':groupTab=el.dataset.tab;groups();break;case'detail-tab':groupDetailTab=el.dataset.tab;groupDetail();break;case'invite-mode':if(el.dataset.mode==='link'){$('#inviteContent').innerHTML=`<div class="card"><div class="eyebrow">رابط الانضمام العام</div><b style="font-size:12px">${currentGroup().publicLink}</b><div class="hint">افتح الرابط لعرض الجمعية واختيار عدد الأسهم وإرسال طلب الانضمام.</div><button class="btn primary full" style="margin-top:12px" data-action="share-link">نسخ رابط الدعوة</button><button class="btn outline full" style="margin-top:8px" data-action="whatsapp-link">مشاركة عبر واتساب</button></div>`}else{$('#inviteContent').innerHTML=`<form id="inviteForm"><div class="field"><label>اسم المدعو</label><input name="name" required></div><div class="field"><label>رقم الهاتف</label><input name="phone" required inputmode="tel"></div><div class="field"><label>عدد الأسهم</label><input name="shares" type="number" min="1" max="${currentGroup().maxPer}" value="1" required></div><button class="btn primary full" type="submit">إرسال الدعوة</button></form>`}document.querySelectorAll('[data-action="invite-mode"]').forEach(b=>b.classList.toggle('active',b===el));break;case'share-link':if(navigator.clipboard?.writeText){navigator.clipboard.writeText(currentGroup().publicLink).then(()=>toast('تم نسخ رابط الدعوة')).catch(()=>toast(currentGroup().publicLink))}else toast(currentGroup().publicLink);break;case'whatsapp-link':window.open('https://wa.me/?text='+encodeURIComponent('انضم إلى جمعية '+currentGroup().name+' عبر الرابط '+currentGroup().publicLink),'_blank');break;case'invite-accept':{if(!isManager()){toast('لا تملك صلاحية إدارة العضويات');break}let i=db.invites.find(x=>x.id===el.dataset.id);if(i){let g=db.groups.find(x=>x.id===i.group);if(g.shares+i.shares>g.total){toast('اكتمل عدد الأسهم المستهدف');break}i.status='ACCEPTED';g.members++;g.shares+=i.shares;db.participants=db.participants||[];db.participants.push({group:g.id,name:i.name,shares:i.shares,role:'member',present:false});if(g.shares>=g.total)g.status='READY_FOR_DRAW';log('قبول دعوة '+i.name);save();invites()}break}case'invite-reject':{if(!isManager()){toast('لا تملك صلاحية إدارة العضويات');break}let i=db.invites.find(x=>x.id===el.dataset.id);if(i){i.status='REJECTED_INV';log('رفض دعوة '+i.name);save();invites()}break}case'pause-group':{if(!isManager()){toast('لا تملك صلاحية إدارة هذه الجمعية');break}const g=currentGroup();if(g.status==='PAUSED_DEFAULT'){g.status=g.statusBeforePause||'ACTIVE_REVOLVING';delete g.statusBeforePause;log('إعادة تفعيل الجمعية')}else{g.statusBeforePause=g.status;g.status='PAUSED_DEFAULT';log('إيقاف الجمعية مؤقتاً')}save();groupDetail();break}case'start-review':{let p=db.payments.find(x=>x.id===el.dataset.id);if(p){p.status='UNDER_REVIEW';log('بدء مراجعة إثبات السداد');save();review()}break}case'approve-payment':{if(!isManager()){toast('لا تملك صلاحية مراجعة السداد');break}let p=db.payments.find(x=>x.id===el.dataset.id);if(p){p.status='VERIFIED_PAID';let id=createReceipt(p);save();showModal('تم اعتماد السداد',`تم إنشاء الإيصال رقم <b>${id}</b>. يمكنك فتحه من سجل الإيصالات.`,[['عرض الإيصال','open-new-receipt','primary'],['إغلاق','close','outline']]);$('#modal-root').dataset.receipt=id}break}case'open-new-receipt':{const id=$('#modal-root').dataset.receipt;closeModal();go('receipt-detail',{id});break}case'reject-payment':{if(!isManager()){toast('لا تملك صلاحية مراجعة السداد');break}const p=db.payments.find(x=>x.id===el.dataset.id);if(p){p.status='REJECTED';log('رفض إثبات السداد');save();toast('تم رفض الإثبات');review()}break}case'member-vote':{const g=currentGroup();db.memberVotes=db.memberVotes||{};db.memberVotes[g.id]=true;const me=(db.participants||[]).find(m=>m.group===g.id&&m.name===db.user.name);if(me)me.present=true;save();memberVote();toast('تم تسجيل حضورك وتصويتك بعدد أسهمك');break;}case'vote-draw':{const g=currentGroup(),participants=(db.participants||[]).filter(m=>m.group===g.id);const present=participants.reduce((n,m)=>n+(m.present===false?0:(Number(m.shares)||0)),0)||1;const yes=Math.max(1,Math.ceil(present*.6)),no=Math.max(0,present-yes);db.drawVotes=db.drawVotes||{};db.drawVotes[g.id]={yes,no,simulation:true};save();drawRoom();toast('تم تحديث محاكاة التصويت');break;}case'run-draw':{const g=currentGroup(),wheel=$('#wheel');if(wheel){wheel.classList.add('spin');el.disabled=true;setTimeout(()=>{const eligible=eligibleTickets(g);if(!eligible.length){toast('لا توجد أسهم مؤهلة متبقية');return}let picked;try{picked=eligible[secureIndex(eligible.length)]}catch(err){toast('تعذر توفير عشوائية آمنة في هذا المتصفح');return}const winner=picked.owner;const shareNo=ticketOwners(g).filter(t=>t.owner===winner&&t.ticketNo<=picked.ticketNo).length;const cycle=(g.cycle||0)+1;const d={cycle,winner,shareNo,ticketNo:picked.ticketNo,date:today()};g.draws.push(d);g.cycle=cycle;g.status='ACTIVE_REVOLVING';db.wall.unshift({group:g.id,type:'system',text:`أعلنت نتيجة قرعة الدورة ${cycle}: فاز ${winner} بالسهم رقم ${d.shareNo}`,date:today(),reactions:0});log('تنفيذ قرعة الدورة '+cycle,'النظام');if(db.drawVotes)delete db.drawVotes[g.id];save();showModal('نتيجة القرعة',`<div style="text-align:center"><div class="receipt-mark">★</div><div style="font-size:17px;font-weight:800;color:var(--ink);margin:8px">${winner}</div><div>السهم الفائز رقم ${d.shareNo}</div><div class="hint">الدورة ${cycle} · ${today()}</div></div><div class="notice warn">نتيجة محاكاة محلية وليست سحباً موثوقاً. يلزم تنفيذ CSPRNG والتحقق على الخادم في التطبيق الفعلي.</div>`,[['عرض المحضر','open-draw-history','primary'],['إغلاق','close','outline']])},2050)}break}case'open-draw-history':closeModal();go('draw-history');break;case'replay-draw':showModal('إعادة محاكاة النتيجة',`هذه إعادة عرض للنتيجة المسجلة للدورة ${el.dataset.cycle}. لا يتم إجراء سحب جديد ولا تغيير النتيجة.`,[['عرض النتيجة','replay-animation','primary'],['إغلاق','close','outline']]);$('#modal-root').dataset.cycle=el.dataset.cycle;break;case'replay-animation':{const c=$('#modal-root').dataset.cycle;const d=currentGroup().draws.find(x=>x.cycle==c);closeModal();showModal('نتيجة الدورة '+c,`الفائز المسجل: <b>${d?.winner||'—'}</b> · السهم رقم ${d?.shareNo||'—'}.<div class="wheel-wrap"><div class="wheel"></div></div>`,[['إغلاق','close','primary']]);break}case'receipt-open':go('receipt-detail',{id:el.dataset.id});break;case'verify-receipt':showModal('نتيجة التحقق',`الإيصال موجود ضمن بيانات المعاينة ورقمه ${params.id||''}. لا يمكن إجراء تحقق تشفيري حقيقي دون خدمة الخادم.`,[['حسناً','close','primary']]);break;case'react':{const idx=Number(el.dataset.index);const arr=db.wall.filter(w=>w.group===currentGroup().id);if(arr[idx])arr[idx].reactions=(arr[idx].reactions||0)+1;save();wall();toast('تم تسجيل تفاعلك');break}case'logout-confirm':showModal('تسجيل الخروج',`هل تريد إنهاء جلستك الحالية؟ لن يتم حذف بيانات المعاينة المحفوظة على هذا الجهاز.`,[['نعم، تسجيل الخروج','logout-now','danger'],['إلغاء','close','outline']]);break;case'logout-now':db.session=false;save();stack=[];closeModal();screenName='logged-out';render();break;default:break}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='createForm'){const d=Object.fromEntries(new FormData(f));const newId='G-'+Math.floor(2404+Math.random()*500);const g={id:newId,name:d.name,currency:d.currency,share:+d.share,total:+d.total,maxPer:+d.maxPer,start:d.start,first:d.first,period:d.period,quorum:+d.quorum,role:'manager',myShares:1,status:'PENDING_MEMBERS',members:1,shares:1,paid:0,cycle:0,admin:db.user.name,contrib:+d.share,publicLink:'sahm.app/join/'+newId,draws:[]};db.groups.unshift(g);db.participants=db.participants||[];db.participants.unshift({group:g.id,name:db.user.name,shares:1,role:'manager',present:true});db.currentGroup=g.id;log('إنشاء جمعية جديدة: '+g.name);save();go('group-detail');toast('تم إنشاء الجمعية وتوليد رابط الدعوة');}

<script>
/* Sahm PWA: announce updates in the open app and apply only on user action. */
if ('serviceWorker' in navigator) {
  let sahmReloadingForUpdate = false;
  let sahmRegistration = null;
  const updateBanner = () => document.getElementById('sahm-update-banner');
  const showUpdateAvailable = () => {
    const banner = updateBanner();
    if (banner && navigator.serviceWorker.controller) banner.hidden = false;
  };
  const watchWorker = worker => {
    if (!worker) return;
    if (worker.state === 'installed' && navigator.serviceWorker.controller) showUpdateAvailable();
    worker.addEventListener('statechange', () => {
      if (worker.state === 'installed' && navigator.serviceWorker.controller) showUpdateAvailable();
    });
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (sahmReloadingForUpdate) return;
    sahmReloadingForUpdate = true;
    window.location.reload();
  });
  window.addEventListener('load', async () => {
    try {
      sahmRegistration = await navigator.serviceWorker.register('/sw.js', {
        scope: '/',
        updateViaCache: 'none'
      });
      if (sahmRegistration.waiting && navigator.serviceWorker.controller) showUpdateAvailable();
      watchWorker(sahmRegistration.installing);
      sahmRegistration.addEventListener('updatefound', () => watchWorker(sahmRegistration.installing));
      await sahmRegistration.update();
      if (sahmRegistration.waiting && navigator.serviceWorker.controller) showUpdateAvailable();
      window.setInterval(async () => {
        if (document.visibilityState === 'visible' && sahmRegistration) {
          try { await sahmRegistration.update(); } catch (error) { console.warn('تعذر فحص تحديث سهم:', error); }
        }
      }, 60000);
    } catch (error) {
      console.warn('تعذر التحقق من تحديث سهم:', error);
    }
  });
  window.addEventListener('focus', () => {
    if (sahmRegistration) sahmRegistration.update().catch(() => {});
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && sahmRegistration) sahmRegistration.update().catch(() => {});
  });
  document.addEventListener('click', event => {
    if (event.target.closest('#sahm-apply-update')) {
      const waiting = sahmRegistration && sahmRegistration.waiting;
      if (!waiting) {
        if (sahmRegistration) sahmRegistration.update().catch(() => {});
        return;
      }
      const button = document.getElementById('sahm-apply-update');
      button.disabled = true;
      button.textContent = 'جارٍ التحديث…';
      waiting.postMessage({ type: 'SKIP_WAITING' });
    }
  });
}
</script></div></body></html>
