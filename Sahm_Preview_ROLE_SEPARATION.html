function ticketOwners(g){const base=['أحمد محمد','أحمد محمد','سارة أحمد','سارة أحمد','خالد عبدالله','مروان علي','مروان علي','علي حسن','ريم صالح','خالد عبدالله','مروان علي','سارة أحمد'];return Array.from({length:g.total},(_,i)=>({ticketNo:i+1,owner:base[i%base.length]}))}function eligibleTickets(g){const excluded=new Set(g.draws.map(d=>d.ticketNo).filter(Boolean));return ticketOwners(g).filter(t=>!excluded.has(t.ticketNo))}function secureIndex(n){if(!n)throw new Error('No eligible tickets');if(window.crypto?.getRandomValues){const a=new Uint32Array(1),limit=Math.floor(0x100000000/n)*n;let x;do{window.crypto.getRandomValues(a);x=a[0]}while(x>=limit);return x%n}return Math.floor(Math.random()*n)}function drawRoom(){if(!isManager()){toast('إجراء القرعة من صلاحيات مدير الجمعية');go('group-detail');return}const g=currentGroup(),present=Math.min(g.shares,Math.max(1,g.members-1)),percent=Math.round(present/g.total*100),quorum=percent>=g.quorum,tickets=eligibleTickets(g),canDraw=['READY_FOR_DRAW','ACTIVE_REVOLVING'].includes(g.status);shell('غرفة القرعة','groups',`${header('غرفة القرعة',g.name)}<div class="card"><div class="between"><b style="font-size:12px">نصاب الحضور</b>${pill(quorum?'ACTIVE_REVOLVING':'PENDING_MEMBERS')}</div><div class="hero-num" style="color:var(--ink);font-size:25px">${percent}%</div><div class="progress"><i style="width:${Math.min(100,percent)}%"></i></div><div class="between"><small class="eyebrow">${present} سهم حاضر من ${g.total}</small><small class="eyebrow">النصاب المطلوب ${g.quorum}%</small></div></div>${!quorum?`<div class="card"><b style="font-size:11px">النصاب غير مكتمل</b><p class="page-sub">يمكن التصويت على تنفيذ القرعة بمن حضر. يحتسب التصويت بعدد الأسهم لا بعدد الأشخاص.</p><div class="between"><span class="eyebrow">موافقة الأسهم المصوتة</span><b id="votePct">${db.drawVote?.yes?Math.round(db.drawVote.yes/(db.drawVote.yes+db.drawVote.no)*100)+'%':'—'}</b></div><button class="btn primary full" data-action="vote-draw">التصويت بالموافقة على التنفيذ</button><div class="hint">يلزم أكثر من 50% من الأسهم المصوتة. التصويت هنا محاكاة محلية مرجحة بالأسهم.</div></div>`:`<div class="notice">النصاب مكتمل. يمكن الانتقال لإجراء القرعة وفق موعد الدورة.</div>`}<div class="card"><div class="between"><b style="font-size:12px">الأسهم المؤهلة</b><span class="pill green">${tickets.length} سهم</span></div><p class="hint">لكل سهم رقم مستقل. يُستبعد رقم السهم الفائز وحده من السحب التالي، ولا تُستبعد بقية أسهم صاحبه.</p><div class="wheel-wrap"><div class="wheel" id="wheel"></div></div><button class="btn gold full" data-action="run-draw" ${(!canDraw||!tickets.length||(!quorum&&!(db.drawVote&&db.drawVote.yes/(db.drawVote.yes+db.drawVote.no)>.5)))?'disabled':''}>إجراء القرعة الآن</button>${!canDraw?'<div class="hint">لا يمكن إجراء القرعة قبل اكتمال العضوية والأسهم ووصول الجمعية إلى حالة الجاهزية.</div>':''}<div class="hint">تنبيه: السحب في هذه المعاينة محلي باستخدام عشوائية المتصفح. يجب أن يتم السحب النهائي باستخدام CSPRNG على الخادم.</div></div><button class="btn outline full" data-go="draw-history">محاضر ونتائج القرعات السابقة</button>`)}

function otp(){auth(`<div class="auth-brand" style="margin:20px 0"><div class="brand-mark">س</div><h1 style="font-size:22px">تحقق من رقمك</h1><p>أدخل الرمز المكوّن من 6 أرقام</p></div><div class="auth-card"><div class="notice info">أُرسل رمز تحقق تجريبي إلى ${db.user.phone}</div><div class="field"><label>رمز التحقق</label><input id="otpInput" inputmode="numeric" maxlength="6" value="${db.otp}" placeholder="••••••" style="text-align:center;letter-spacing:9px;font-size:20px"></div><button class="btn primary full" data-action="verify-otp">تحقق ومتابعة</button><button class="btn outline full" style="margin-top:8px" data-action="resend-otp">إعادة إرسال الرمز</button><button class="link-btn" style="width:100%;margin-top:8px" data-go="phone">تغيير رقم الهاتف</button></div><div class="auth-foot">للتجربة استخدم الرمز: <b>246810</b></div>`)}
function profileSetup(){auth(`<div class="auth-brand" style="margin:18px 0"><div class="brand-mark">س</div><h1 style="font-size:22px">أكمل ملفك الشخصي</h1><p>هذه البيانات تساعد أعضاء جمعياتك على التعرف عليك</p></div><div class="auth-card"><form id="setupForm"><div class="field"><label>الاسم الكامل</label><input name="name" required value="${escapeHtml(db.user.name)}"></div><div class="field"><label>المدينة</label><input name="city" required value="${escapeHtml(db.user.city)}"></div><button class="btn primary full" type="submit">حفظ وفتح حسابي</button></form></div>`)}
function logout(){auth(`<div class="auth-brand"><div class="brand-mark">✓</div><h1>تم إنهاء الجلسة</h1><p>تم تسجيل خروجك من حساب سهم على هذا الجهاز.</p></div><div class="auth-card"><button class="btn primary full" data-go="phone">تسجيل الدخول مجدداً</button><div class="hint" style="text-align:center;margin-top:10px">تبقى بيانات المعاينة المحلية محفوظة لتسهيل التجربة.</div></div>`)}
function render(){if(['welcome','phone','otp','profile-setup','logged-out'].includes(screenName)){({welcome,phone,otp,'profile-setup':profileSetup,'logged-out':logout}[screenName])();return}const funcs={home,groups,'create-group':createGroup,'group-detail':groupDetail,members,invite,invites,'join-group':joinGroup,installments,'payment-submit':paymentSubmit,review,'draw-room':drawRoom,'member-vote':memberVote,'draw-history':drawHistory,entitlements,receipts,'receipt-detail':receiptDetail,wall,chat,notifications,audit,profile,'edit-profile':editProfile,settings};(funcs[screenName]||home)()}
function showModal(title,body,buttons=[['إغلاق','close','outline']]){$('#modal-root').innerHTML=`<div class="overlay" data-action="overlay-close"><div class="dialog" onclick="event.stopPropagation()"><h3>${title}</h3><div class="dialog-body">${body}</div><div class="dialog-actions">${buttons.map(([label,act,style='primary'])=>`<button class="btn ${style}" data-action="${act}">${label}</button>`).join('')}</div></div></div>`}function closeModal(){$('#modal-root').innerHTML=''}
function createReceipt(p){const id='SH-2026-'+String(db.receipts.length+9).padStart(4,'0');db.receipts.unshift({id,group:p.group,person:p.person,amount:p.amount,cycle:p.cycle,ref:p.ref,date:today()});db.wall.unshift({group:p.group,type:'system',text:`تم اعتماد إيصال سداد ${p.person} للدورة ${p.cycle}`,date:today(),reactions:0});log('اعتماد إثبات سداد وإصدار إيصال',db.user.name);return id}

document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-action]');if(!el)return;const goTo=el.dataset.go,act=el.dataset.action;if(goTo){if(goTo==='group-detail')db.currentGroup=el.dataset.id||db.currentGroup;go(goTo);return}if(act==='back'){back();return}if(act==='overlay-close'){closeModal();return}if(act==='close'){closeModal();return}switch(act){case'open-manager-review':{const g=db.groups.find(x=>x.role==='manager'&&db.payments.some(p=>p.group===x.id&&['PROOF_SUBMITTED','UNDER_REVIEW'].includes(p.status)));if(g){db.currentGroup=g.id;go('review')}else toast('لا توجد إثباتات معلقة في جمعياتك');break}case'open-group':db.currentGroup=el.dataset.id;groupDetailTab='overview';save();go('group-detail');break;case'home-managed':groupTab='managed';go('groups');break;case'home-member':groupTab='member';go('groups');break;case'group-tab':groupTab=el.dataset.tab;groups();break;case'detail-tab':groupDetailTab=el.dataset.tab;groupDetail();break;case'invite-mode':if(el.dataset.mode==='link'){$('#inviteContent').innerHTML=`<div class="card"><div class="eyebrow">رابط الانضمام العام</div><b style="font-size:12px">${currentGroup().publicLink}</b><div class="hint">افتح الرابط لعرض الجمعية واختيار عدد الأسهم وإرسال طلب الانضمام.</div><button class="btn primary full" style="margin-top:12px" data-action="share-link">نسخ رابط الدعوة</button><button class="btn outline full" style="margin-top:8px" data-action="whatsapp-link">مشاركة عبر واتساب</button></div>`}else{$('#inviteContent').innerHTML=`<form id="inviteForm"><div class="field"><label>اسم المدعو</label><input name="name" required></div><div class="field"><label>رقم الهاتف</label><input name="phone" required inputmode="tel"></div><div class="field"><label>عدد الأسهم</label><input name="shares" type="number" min="1" max="${currentGroup().maxPer}" value="1" required></div><button class="btn primary full" type="submit">إرسال الدعوة</button></form>`}document.querySelectorAll('[data-action="invite-mode"]').forEach(b=>b.classList.toggle('active',b===el));break;case'share-link':if(navigator.clipboard?.writeText){navigator.clipboard.writeText(currentGroup().publicLink).then(()=>toast('تم نسخ رابط الدعوة')).catch(()=>toast(currentGroup().publicLink))}else toast(currentGroup().publicLink);break;case'whatsapp-link':window.open('https://wa.me/?text='+encodeURIComponent('انضم إلى جمعية '+currentGroup().name+' عبر الرابط '+currentGroup().publicLink),'_blank');break;case'invite-accept':{if(!isManager()){toast('لا تملك صلاحية إدارة العضويات');break}let i=db.invites.find(x=>x.id===el.dataset.id);if(i){let g=db.groups.find(x=>x.id===i.group);if(g.shares+i.shares>g.total){toast('اكتمل عدد الأسهم المستهدف');break}i.status='ACCEPTED';g.members++;g.shares+=i.shares;if(g.shares>=g.total)g.status='READY_FOR_DRAW';log('قبول دعوة '+i.name);save();invites()}break}case'invite-reject':{if(!isManager()){toast('لا تملك صلاحية إدارة العضويات');break}let i=db.invites.find(x=>x.id===el.dataset.id);if(i){i.status='REJECTED_INV';log('رفض دعوة '+i.name);save();invites()}break}case'pause-group':{if(!isManager()){toast('لا تملك صلاحية إدارة هذه الجمعية');break}const g=currentGroup();if(g.status==='PAUSED_DEFAULT'){g.status=g.statusBeforePause||'ACTIVE_REVOLVING';delete g.statusBeforePause;log('إعادة تفعيل الجمعية')}else{g.statusBeforePause=g.status;g.status='PAUSED_DEFAULT';log('إيقاف الجمعية مؤقتاً')}save();groupDetail();break}case'start-review':{let p=db.payments.find(x=>x.id===el.dataset.id);if(p){p.status='UNDER_REVIEW';log('بدء مراجعة إثبات السداد');save();review()}break}case'approve-payment':{if(!isManager()){toast('لا تملك صلاحية مراجعة السداد');break}let p=db.payments.find(x=>x.id===el.dataset.id);if(p){p.status='VERIFIED_PAID';let id=createReceipt(p);save();showModal('تم اعتماد السداد',`تم إنشاء الإيصال رقم <b>${id}</b>. يمكنك فتحه من سجل الإيصالات.`,[['عرض الإيصال','open-new-receipt','primary'],['إغلاق','close','outline']]);$('#modal-root').dataset.receipt=id}break}case'open-new-receipt':{const id=$('#modal-root').dataset.receipt;closeModal();go('receipt-detail',{id});break}case'reject-payment':{if(!isManager()){toast('لا تملك صلاحية مراجعة السداد');break}const p=db.payments.find(x=>x.id===el.dataset.id);if(p){p.status='REJECTED';log('رفض إثبات السداد');save();toast('تم رفض الإثبات');review()}break}case'member-vote':db.memberVotes=db.memberVotes||{};db.memberVotes[currentGroup().id]=true;save();memberVote();toast('تم تسجيل تصويتك بعدد أسهمك');break;case'vote-draw':db.drawVote=true;$('#votePct').textContent='100% موافقة';toast('اكتمل التصويت بالموافقة');break;case'run-draw':{const g=currentGroup(),wheel=$('#wheel');if(wheel){wheel.classList.add('spin');el.disabled=true;setTimeout(()=>{const eligible=eligibleTickets(g);if(!eligible.length){toast('لا توجد أسهم مؤهلة متبقية');return}const picked=eligible[secureIndex(eligible.length)];const winner=picked.owner;const shareNo=ticketOwners(g).filter(t=>t.owner===winner&&t.ticketNo<=picked.ticketNo).length;const cycle=(g.cycle||0)+1;const d={cycle,winner,shareNo,ticketNo:picked.ticketNo,date:today()};g.draws.push(d);g.cycle=cycle;g.status='ACTIVE_REVOLVING';db.wall.unshift({group:g.id,type:'system',text:`أعلنت نتيجة قرعة الدورة ${cycle}: فاز ${winner} بالسهم رقم ${d.shareNo}`,date:today(),reactions:0});log('تنفيذ قرعة الدورة '+cycle,'النظام');delete db.drawVote;save();showModal('نتيجة القرعة',`<div style="text-align:center"><div class="receipt-mark">★</div><div style="font-size:17px;font-weight:800;color:var(--ink);margin:8px">${winner}</div><div>السهم الفائز رقم ${d.shareNo}</div><div class="hint">الدورة ${cycle} · ${today()}</div></div><div class="notice warn">نتيجة محاكاة محلية وليست سحباً موثوقاً. يلزم تنفيذ CSPRNG والتحقق على الخادم في التطبيق الفعلي.</div>`,[['عرض المحضر','open-draw-history','primary'],['إغلاق','close','outline']])},2050)}break}case'open-draw-history':closeModal();go('draw-history');break;case'replay-draw':showModal('إعادة محاكاة النتيجة',`هذه إعادة عرض للنتيجة المسجلة للدورة ${el.dataset.cycle}. لا يتم إجراء سحب جديد ولا تغيير النتيجة.`,[['عرض النتيجة','replay-animation','primary'],['إغلاق','close','outline']]);$('#modal-root').dataset.cycle=el.dataset.cycle;break;case'replay-animation':{const c=$('#modal-root').dataset.cycle;const d=currentGroup().draws.find(x=>x.cycle==c);closeModal();showModal('نتيجة الدورة '+c,`الفائز المسجل: <b>${d?.winner||'—'}</b> · السهم رقم ${d?.shareNo||'—'}.<div class="wheel-wrap"><div class="wheel"></div></div>`,[['إغلاق','close','primary']]);break}case'receipt-open':go('receipt-detail',{id:el.dataset.id});break;case'verify-receipt':showModal('نتيجة التحقق',`الإيصال موجود ضمن بيانات المعاينة ورقمه ${params.id||''}. لا يمكن إجراء تحقق تشفيري حقيقي دون خدمة الخادم.`,[['حسناً','close','primary']]);break;case'react':{const idx=Number(el.dataset.index);const arr=db.wall.filter(w=>w.group===currentGroup().id);if(arr[idx])arr[idx].reactions=(arr[idx].reactions||0)+1;save();wall();toast('تم تسجيل تفاعلك');break}case'logout-confirm':showModal('تسجيل الخروج',`هل تريد إنهاء جلستك الحالية؟ لن يتم حذف بيانات المعاينة المحفوظة على هذا الجهاز.`,[['نعم، تسجيل الخروج','logout-now','danger'],['إلغاء','close','outline']]);break;case'logout-now':db.session=false;save();stack=[];closeModal();screenName='logged-out';render();break;default:break}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='createForm'){const d=Object.fromEntries(new FormData(f));const newId='G-'+Math.floor(2404+Math.random()*500);const g={id:newId,name:d.name,currency:d.currency,share:+d.share,total:+d.total,maxPer:+d.maxPer,start:d.start,first:d.first,period:d.period,quorum:+d.quorum,role:'manager',myShares:1,status:'PENDING_MEMBERS',members:1,shares:0,paid:0,cycle:0,admin:db.user.name,contrib:+d.share,publicLink:'sahm.app/join/'+newId,draws:[]};db.groups.unshift(g);db.currentGroup=g.id;log('إنشاء جمعية جديدة: '+g.name);save();go('group-detail');toast('تم إنشاء الجمعية وتوليد رابط الدعوة');}
else if(f.id==='inviteForm'){const d=Object.fromEntries(new FormData(f));const g=currentGroup(),pending=db.invites.filter(i=>i.group===g.id&&i.status==='PENDING').reduce((n,i)=>n+i.shares,0);if(g.shares+pending+(+d.shares)>g.total){toast('عدد الأسهم المطلوبة يتجاوز الأسهم المتبقية');return}db.invites.unshift({id:'I-'+Date.now(),group:g.id,name:d.name,phone:d.phone,shares:+d.shares,status:'PENDING'});log('إرسال دعوة إلى '+d.name);save();go('invites');toast('تم إرسال الدعوة');}
else if(f.id==='joinForm'){const code=f.code.value.toUpperCase().match(/G-\d+/)?.[0];const g=db.groups.find(x=>x.id===code);if(!g){toast('لم نعثر على جمعية بهذا الرمز');return}showModal('تفاصيل الجمعية',`<b>${g.name}</b><div class="keyvalue"><span>العملة</span><b>${g.currency}</b></div><div class="keyvalue"><span>قيمة السهم</span><b>${money(g.share,g.currency)}</b></div><div class="keyvalue"><span>الأسهم المستهدفة</span><b>${g.shares}/${g.total}</b></div><div class="field"><label>عدد الأسهم التي ترغب بها</label><input type="number" id="joinShares" min="1" max="${g.maxPer}" value="1"></div>`,[['إرسال طلب الانضمام','submit-join','primary'],['إغلاق','close','outline']]);$('#modal-root').dataset.group=code;}
else if(f.id==='paymentForm'){const d=Object.fromEntries(new FormData(f));const p={id:'P-'+Date.now(),group:currentGroup().id,person:db.user.name,cycle:+d.cycle,amount:+d.shares*currentGroup().share,ref:d.ref,status:'PROOF_SUBMITTED',date:today(),proof:f.proof.files[0]?.name||'إشعار التحويل'};db.payments.unshift(p);log('إرسال إثبات سداد '+p.ref);save();go('installments');toast('تم إرسال الإثبات إلى مدير الجمعية');}
else if(f.id==='chatForm'){const t=f.text.value.trim();if(!t||t.length>300)return;db.messages.push({group:currentGroup().id,name:db.user.name,mine:true,text:t,time:new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})});log('إرسال رسالة في حائط الجمعية');save();chat();toast('تم إرسال الرسالة');}
else if(f.id==='profileForm'){const d=Object.fromEntries(new FormData(f));db.user.name=d.name;db.user.city=d.city;log('تعديل الملف الشخصي');save();profile();toast('تم حفظ بياناتك');}
else if(f.id==='setupForm'){const d=Object.fromEntries(new FormData(f));db.user.name=d.name;db.user.city=d.city;db.session=true;db.verified=true;log('إكمال إعداد الملف الشخصي');save();stack=[];screenName='home';render();}
});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action="submit-join"]');if(el){const code=$('#modal-root').dataset.group,g=db.groups.find(x=>x.id===code),n=Math.max(1,Math.min(g.maxPer,+$('#joinShares').value||1));const pending=db.invites.filter(i=>i.group===g.id&&i.status==='PENDING').reduce((a,i)=>a+i.shares,0);if(g.shares+pending+n>g.total){toast('لا يتوفر هذا العدد من الأسهم');return}db.invites.unshift({id:'I-'+Date.now(),group:g.id,name:db.user.name,phone:db.user.phone,shares:n,status:'PENDING'});log('إرسال طلب انضمام إلى '+g.name);save();closeModal();toast('أرسل طلب الانضمام وينتظر موافقة المدير')}});
