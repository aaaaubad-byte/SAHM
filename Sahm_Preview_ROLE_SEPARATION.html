<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#3158d6">
<meta name="application-name" content="سهم">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سهم">

<link rel="manifest" href="/manifest.webmanifest">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>سهم | إدارة الجمعيات التساهمية</title>
<style>

/* Consolidated Sahm CSS — one current theme and one authoritative layout. */
* {
  box-sizing: border-box;
}
button {
  cursor: pointer;
  border: 0;
}
.phone {
  max-width: 430px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.brand-mark {
  display: grid;
  place-items: center;
  font-weight: 800;
}
.dot {
  position: absolute;
  border-radius: 50%;
}
.screen {
  overflow: auto;
  flex: 1;
  min-height: 0;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}
.screen::-webkit-scrollbar {
  width: 3px;
}
.screen::-webkit-scrollbar-thumb {
  border-radius: var(--radius-small);
}
.bottomnav {
  display: flex;
  justify-content: space-around;
}
.navitem {
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.navitem .ni {
  font-size: 21px;
}
.navitem.active {
  font-weight: 700;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-head h3 {
  margin: 0;
}
.link-btn {
  background: transparent;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.stat b {
  display: block;
}
.progress {
  overflow: hidden;
}
.progress i {
  height: 100%;
  display: block;
  border-radius: var(--radius-small);
}
.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  background: var(--ink);
  color: #fff;
}
.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.row {
  display: flex;
  align-items: center;
}
.between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.avatar {
  display: grid;
  place-items: center;
  font-weight: 800;
  flex: none;
}
.listrow {
  display: flex;
  align-items: center;
  border-bottom: 1px solid #eff2f1;
}
.listrow:last-child {
  border: 0;
  padding-bottom: 0;
}
.listrow:first-child {
  padding-top: 0;
}
.grow {
  flex: 1;
  min-width: 0;
}
.listrow strong {
  display: block;
}
.listrow small {
  display: block;
  margin-top: 3px;
}
.amount {
  white-space: nowrap;
}
.field label {
  display: block;
}
.field input {
  width: 100%;
  outline: none;
}
.field select {
  width: 100%;
  outline: none;
}
.field textarea {
  width: 100%;
  outline: none;
}
.searchbox {
  width: 100%;
  outline: none;
}
.field textarea {
  resize: vertical;
  line-height: 1.8;
}
.formgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.segmented {
  display: flex;
}
.segmented button {
  flex: 1;
  background: transparent;
  color: #697b7d;
  font-weight: 700;
}
.segmented button.active {
  background: #fff;
}
.tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
}
.tabs button {
  background: none;
  border-bottom: 2px solid transparent;
}
.tabs button.active {
  font-weight: 800;
}
.toolbar {
  display: flex;
  align-items: center;
}
.searchbox {
  flex: 1;
}
.keyvalue {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid #eff2f1;
}
.keyvalue:last-child {
  border: 0;
}
.wheel-wrap {
  display: grid;
  place-items: center;
}
.wheel {
  width: 190px;
  height: 190px;
  border: 9px solid #e9efec;
  border-radius: 50%;
  background: conic-gradient(#1b827a 0 45deg,#d7a54c 45deg 90deg,#244d59 90deg 135deg,#87b8aa 135deg 180deg,#e6c27d 180deg 225deg,#32616a 225deg 270deg,#9bc8ba 270deg 315deg,#c38e39 315deg);
  box-shadow: inset 0 0 0 5px #fff,0 5px 14px #173b4318;
  display: grid;
  place-items: center;
  position: relative;
}
.wheel::before {
  content: 'سهم';
  background: white;
  border-radius: 50%;
  width: 66px;
  height: 66px;
  display: grid;
  place-items: center;
  font-weight: 800;
  color: var(--ink);
  box-shadow: 0 2px 8px #102d351c;
}
.wheel.spin {
  animation: spin 2s cubic-bezier(.13,.72,.22,1);
}
@keyframes spin{to{transform:rotate(1440deg)}}
.receipt {
  border: 1px dashed #afc1bc;
  border-radius: var(--radius-card);
}
.chatbubble {
  border-radius: var(--radius-control) var(--radius-control) 3px var(--radius-control);
  line-height: 1.8;
  max-width: 85%;
  margin: 5px 0 5px auto;
}
.chatbubble.mine {
  border-radius: var(--radius-control) var(--radius-control) var(--radius-control) 3px;
  margin-right: auto;
  margin-left: 0;
}
.empty {
  text-align: center;
  color: var(--muted);
}
.empty .big {
  margin-bottom: 8px;
}
.empty b {
  color: var(--ink);
  display: block;
  margin-bottom: 4px;
}
.empty p {
  margin: 0 0 12px;
}
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
}
.dialog {
  background: #fff;
  width: 100%;
  overflow: auto;
  box-shadow: 0 15px 50px #061b2255;
}
.dialog h3 {
  margin: 0 0 6px;
}
.dialog .dialog-body {
  color: #4d6267;
}
.dialog-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.dialog-actions>* {
  flex: 1;
}
.toast {
  position: absolute;
  left: 50%;
  transform: translate(-50%,20px);
  background: #173941;
  color: white;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  box-shadow: var(--shadow);
}
.toast.show {
  opacity: 1;
  transform: translate(-50%,0);
}
.auth-screen {
  color: white;
  flex: 1;
  overflow: auto;
}
.auth-brand {
  text-align: center;
}
.auth-brand .brand-mark {
  margin: auto;
}
.auth-brand h1 {
  margin: 13px 0 3px;
}
.auth-brand p {
  font-size: 10px;
  color: #d2e0dc;
}
.auth-card {
  background: white;
  color: var(--ink);
}
.auth-card .field input {
  background: #f8fbfa;
}
.role-chip {
  display: inline-flex;
  align-items: center;
  border-radius: var(--radius-small);
  font-weight: 800;
}


.manager-action-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
}
.member-action-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
}
.manager-action {
  text-align: right;
  display: flex;
  flex-direction: column;
}
.member-action {
  text-align: right;
  display: flex;
  flex-direction: column;
}
:root {
  --ink: #172338;
  --ink2: #2b3d59;
  --teal: #3158d6;
  --mint: #edf2ff;
  --gold: #f1c56b;
  --bg: #f4f6fa;
  --card: #fff;
  --muted: #68778d;
  --line: #e5eaf1;
  --red: #b5434a;
  --blue: #41658d;
  --shadow: 0 8px 28px rgba(25,44,78,.07);
  --radius: var(--radius-card);
  --primary: #3158d6;
  --primary-dark: #2345b5;
  --surface: #fff;
  --surface-2: #f8f9fc;
  --radius-card: 12px;
  --radius-control: 10px;
  --radius-small: 8px;
  --radius-shell: 16px;
}
html {
  background: #e9edf4;
  color: var(--ink);
}
body {
  background: #e9edf4;
  color: var(--ink);
}
button {
  font: inherit;
}
input {
  font: inherit;
}
select {
  font: inherit;
}
textarea {
  font: inherit;
}
button {
  touch-action: manipulation;
}
.workspace {
  background: radial-gradient(ellipse at 50% 0%,#e4eaf7 0,#e9edf4 48%,#e9edf4 100%);
}
.phone {
  border: 1px solid #d8dfeb;
  border-radius: var(--radius-shell);
  background: var(--bg);
  box-shadow: 0 28px 90px rgba(23,38,69,.18);
}

.topbar {
  height: 70px;
  background: #fff;
  color: var(--ink);
  border-bottom: 1px solid var(--line);
  box-shadow: none;
}
.brand-mark {
  height: 38px;
  width: 38px;
  border-radius: var(--radius-control);
  background: var(--primary);
  color: #fff;
  font-size: 18px;
  box-shadow: 0 5px 12px #3158d626;
}
.dot {
  width: 8px;
  height: 8px;
  background: #e25d67;
  border: 2px solid #fff;
  top: 7px;
  left: 7px;
}
.screen {
  background: var(--bg);
  scrollbar-color: #cad3e1 transparent;
}
.screen::-webkit-scrollbar-thumb {
  background: #cad3e1;
}
.bottomnav {
  height: 78px;
  min-height: 78px;
  flex: 0 0 auto;
  position: relative;
  z-index: 10;
  visibility: visible;
  background: #fff;
  border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  gap: 4px;
  box-shadow: 0 -8px 22px rgba(24,41,75,.035);
}
.navitem {
  min-height: 54px;
  border-radius: 0;
  color: #8792a4;
  font-weight: 650;
  transition: background .18s,color .18s;
}
.navitem .ni {
  line-height: 24px;
}
.navitem .ni svg {
  stroke: currentColor;
  stroke-width: 1.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.navitem.active {
  color: var(--primary);
  background: #edf2ff;
}
.navitem.active .ni {
  transform: none;
}
.section-head h3 {
  font-size: 13px;
  font-weight: 850;
}
.link-btn {
  font-size: 11px;
  color: var(--primary);
  font-weight: 800;
  padding: 8px 4px;
  min-height: 32px;
}
.card {
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: 0 3px 10px rgba(23,43,79,.025);
}
.hero-num {
  font-size: 29px;
  font-weight: 850;
  letter-spacing: -.7px;
  margin-top: 7px;
}
.eyebrow {
  color: #7c899c;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0;
}
.pill {
  padding: 6px 10px;
  border-radius: var(--radius-small);
  font-size: 10px;
  font-weight: 750;
  background: #f0f2f6;
  color: #5d6b80;
}
.pill.green {
  background: #e5f5ed;
  color: #18744f;
}
.pill.gold {
  background: #fff3dc;
  color: #93641b;
}
.pill.red {
  background: #fbecee;
  color: #a83f4a;
}
.pill.blue {
  background: #eaf1ff;
  color: #3158a6;
}
.pill.dark {
  background: #e9edfa;
  color: #344a8c;
}
.stat {
  background: #fff;
  border: 1px solid var(--line);
  min-width: 0;
}
.stat b {
  font-size: 23px;
  font-weight: 850;
  color: var(--ink);
  margin: 5px 0 2px;
  letter-spacing: -.4px;
}
.stat span {
  font-size: 10px;
  color: var(--muted);
}
.progress {
  height: 7px;
  background: #edf0f5;
  border-radius: var(--radius-small);
  margin: 9px 0;
}
.progress i {
  background: linear-gradient(90deg,#3158d6,#6380eb);
}
.btn {
  min-height: 46px;
  padding: 11px 15px;
  border-radius: var(--radius-control);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0;
  transition: transform .12s,filter .12s;
}
.btn:active {
  transform: scale(.985);
}
.btn.primary {
  background: var(--primary);
  box-shadow: 0 5px 12px #3158d622;
}
.btn.primary:hover {
  background: var(--primary-dark);
}
.btn.gold {
  background: #f2c66f;
  color: #29344a;
}
.btn.soft {
  background: #edf2ff;
  color: #3158b7;
}
.btn.outline {
  background: #fff;
  border: 1px solid #dce3ed;
  color: #44546d;
}
.btn.danger {
  background: #fbecee;
  color: #a83f4a;
}
.btn.small {
  min-height: 36px;
  padding: 7px 11px;
  font-size: 10px;
  border-radius: var(--radius-control);
}
.btn.full {
  width: 100%;
}
.btn:disabled {
  box-shadow: none;
}
.row {
  gap: 11px;
}
.avatar {
  height: 40px;
  width: 40px;
  border-radius: var(--radius-control);
  background: #edf2ff;
  color: #3158b7;
  font-size: 14px;
}
.avatar.gold {
  background: #fff3df;
  color: #94651d;
}
.avatar.dark {
  background: #263958;
  color: #fff;
}
.listrow {
  border-color: #edf0f5;
}
.listrow strong {
  font-size: 12px;
  font-weight: 800;
}
.listrow small {
  font-size: 10px;
  line-height: 1.65;
  color: #78869a;
}
.amount {
  font-size: 12px;
  font-weight: 850;
  color: var(--ink);
}
.field label {
  font-size: 11px;
  font-weight: 800;
  color: #35445d;
}
.field input {
  border: 1px solid #dfe5ee;
  background: #fbfcfe;
  border-radius: var(--radius-control);
  font-size: 12px;
  color: var(--ink);
}
.field select {
  border: 1px solid #dfe5ee;
  background: #fbfcfe;
  border-radius: var(--radius-control);
  font-size: 12px;
  color: var(--ink);
}
.field textarea {
  border: 1px solid #dfe5ee;
  background: #fbfcfe;
  border-radius: var(--radius-control);
  font-size: 12px;
  color: var(--ink);
}
.searchbox {
  min-height: 48px;
  padding: 12px 13px;
  border: 1px solid #dfe5ee;
  background: #fbfcfe;
  border-radius: var(--radius-control);
  font-size: 12px;
  color: var(--ink);
}
.field input:focus {
  border-color: #6c87e8;
  box-shadow: 0 0 0 3px #3158d61c;
}
.field select:focus {
  border-color: #6c87e8;
  box-shadow: 0 0 0 3px #3158d61c;
}
.field textarea:focus {
  border-color: #6c87e8;
  box-shadow: 0 0 0 3px #3158d61c;
}
.segmented {
  background: #eef1f7;
  border-radius: var(--radius-control);
  padding: 4px;
  gap: 4px;
}
.segmented button {
  padding: 10px 7px;
  border-radius: var(--radius-control);
  font-size: 10px;
}
.segmented button.active {
  color: var(--primary);
  box-shadow: 0 2px 8px #20355b10;
}
.tabs {
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs button {
  white-space: nowrap;
  font-size: 11px;
  padding: 11px 2px;
  color: #78869a;
  min-height: 42px;
}
.tabs button.active {
  color: var(--primary);
  border-color: var(--primary);
}
.searchbox {
  min-width: 0;
}
.keyvalue {
  padding: 11px 0;
  border-color: #edf0f5;
  font-size: 11px;
}
.keyvalue b {
  color: #26364f;
  font-weight: 800;
}
.keyvalue span {
  color: #7a879a;
}
.receipt {
  border-color: #d5deea;
  background: #fcfdff;
}
.chatbubble {
  background: #edf2ff;
  font-size: 11px;
  padding: 10px 13px;
}
.chatbubble.mine {
  background: #e8f4ee;
}
.empty .big {
  font-size: 31px;
  color: #8290a6;
}
.empty b {
  font-size: 13px;
}
.empty p {
  font-size: 10px;
  line-height: 1.8;
}
.overlay {
  background: #172338a8;
  backdrop-filter: blur(4px);
}
.dialog {
  border-radius: var(--radius-card);
  padding: 19px;
  max-height: 88%;
}
.dialog h3 {
  font-size: 16px;
  font-weight: 850;
}
.dialog .dialog-body {
  font-size: 11px;
  line-height: 1.9;
}
.toast {
  bottom: 88px;
  border-radius: var(--radius-control);
  padding: 12px 16px;
  font-size: 11px;
  max-width: calc(100% - 36px);
  white-space: normal;
  text-align: center;
}
.auth-screen {
  background: radial-gradient(circle at 50% 0%,#3d65d0 0,#20345f 48%,#172843 100%);
}
.auth-brand .brand-mark {
  background: #fff;
  color: var(--primary);
  box-shadow: 0 12px 25px #0b1d3e55;
}
.auth-brand h1 {
  font-size: 28px;
  letter-spacing: -.4px;
}
.auth-card {
  box-shadow: 0 15px 35px #0c1d3b20;
}
.role-chip {
  font-size: 10px;
  padding: 6px 10px;
}
.manager-chip {
  background: #e9efff;
  color: #3153b4;
}
.member-chip {
  background: #eaf5f1;
  color: #26745e;
}
.manager-identity {
  background: linear-gradient(135deg,#202f53,#365bc0);
  color: #fff;
  border: 0;
}
.member-identity {
  background: linear-gradient(135deg,#eaf0ff,#fff);
  color: #263755;

}
.group-card {

  border-right: 1px solid var(--line);
  cursor: pointer;
  transition: transform .15s,box-shadow .15s;
}
.group-card:active {
  transform: scale(.99);
}


.manager-panel {
  border-color: #e0e7f2;
}
.member-panel {
  border-color: #e2e9f4;
  background: #fff;
}
.manager-action {
  border: 1px solid #e2e8f1;
  background: #fafbfe;
  color: #273954;
  align-items: flex-start;
  justify-content: center;
}
.member-action {
  border: 1px solid #e2e8f1;
  align-items: flex-start;
  justify-content: center;
}
.member-action {
  background: #fbfcff;
  color: #34465f;
  border-color: #e2e8f1;
}
.manager-action span {
  color: var(--primary);
}
.member-action span {
  color: var(--primary);
}
.manager-action b {
  font-weight: 850;
}
.member-action b {
  font-weight: 850;
}
.manager-action small {
  font-size: 10px;
  color: #7a8799;

.member-action small {
  font-size: 10px;
  color: #7a8799;

}

}
.group-identity .eyebrow {

  opacity: .75;
}

button:focus-visible {
  outline: 3px solid #8da4f4;
  outline-offset: 2px;
}
a:focus-visible {
  outline: 3px solid #8da4f4;
  outline-offset: 2px;
}
input:focus-visible {
  outline: 3px solid #8da4f4;
  outline-offset: 2px;
}
select:focus-visible {
  outline: 3px solid #8da4f4;
  outline-offset: 2px;
}
textarea:focus-visible {
  outline: 3px solid #8da4f4;
  outline-offset: 2px;
}
@media(max-width:600px) {
  .workspace {
  background: var(--bg);
}
  .phone {
  max-width: none;
  box-shadow: none;
}
  .topbar {
    height: 66px;
    padding-inline: 17px;
  }
  .screen {
    padding: 19px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .bottomnav {
    height: calc(76px + env(safe-area-inset-bottom));
    min-height: 76px;
    flex: 0 0 auto;
    position: relative;
    z-index: 10;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }
  .auth-screen {
    padding-top: calc(20px + env(safe-area-inset-top));

function installments(){
 const g=currentGroup();if(!g){go('groups');return}
 const detail=SahmApp.groupDetail(g.id);if(!detail||!detail.ok){toast(detail&&detail.message||'تعذر تحميل الجمعية');return}
 const manager=!!detail.role.manager,rounds=detail.rounds||g.shares||0;
 if(!selectedInstallmentCycle||selectedInstallmentCycle>rounds)selectedInstallmentCycle=detail.cycle||1;
 const options=Array.from({length:Math.max(0,rounds)},(_,i)=>'<option value="'+(i+1)+'" '+(selectedInstallmentCycle===i+1?'selected':'')+'>الدورة '+(i+1)+'</option>').join('');
 const reminderOptions=Array.from({length:g.installments},(_,i)=>'<option value="'+(i+1)+'">القسط '+(i+1)+'</option>').join('');
 const result=rounds?SahmApp.installmentRows(g.id,{cycle:selectedInstallmentCycle,status:selectedInstallmentStatus}):{ok:true,rows:[],counts:{paid:0,due:0,late:0,upcoming:0}};
 if(!result||!result.ok){shell('الأقساط','groups',header('أقساط الدورة',g.name)+'<div class="card empty"><b>'+escapeHtml(result&&result.message||'لا توجد أقساط لعرضها')+'</b></div>');return}
 const rows=result.rows||[],counts=result.counts||{paid:0,due:0,late:0,upcoming:0},filters=[['all','الكل'],['due','مستحق'],['paid','مدفوع'],['late','متأخر']];

  const canRecord=manager&&(x.status==='due'||x.status==='late');
  const actions=canRecord?'<div class="dialog-actions"><button class="btn primary small" data-action="record-paid" data-member="'+x.memberId+'" data-cycle="'+x.cycle+'" data-no="'+x.no+'">تسجيل مدفوع</button><button class="btn outline small" data-action="send-reminder" data-member="'+x.memberId+'" data-cycle="'+x.cycle+'" data-no="'+x.no+'">تذكير</button></div>':'';
  return '<div class="listrow installment-row"><div class="grow"><strong>'+escapeHtml(x.memberName)+' · القسط '+x.no+' من '+x.of+'</strong><small>'+dateLabel(x.periodStart)+' — '+dateLabel(x.periodEnd)+'</small><small>'+x.shares+' أسهم · '+minorMoney(x.total,g.currency)+'</small></div>'+pill(x.status)+'<div class="installment-actions">'+actions+'</div></div>';
 }).join('');
 const reminderTools=manager?'<div class="card reminder-tools"><div class="field"><label>تذكير جميع المشاركين بالقسط</label><select id="reminderInstallment">'+reminderOptions+'</select></div><button class="btn outline full" data-action="send-reminder-all">إرسال التذكير للمستحقين والمتأخرين</button><small>لن يصل التذكير لمن سجل القسط مدفوعًا أو لم يحن موعده بعد.</small></div>':'';
 shell('الأقساط','groups',header('أقساط الدورة',g.name)+
 '<div class="member-summary three"><div><span>مدفوعة</span><b>'+counts.paid+'</b></div><div><span>مستحقة</span><b>'+counts.due+'</b></div><div><span>متأخرة</span><b>'+counts.late+'</b></div></div>'+
 '<div class="field"><label>الدورة</label><select id="installmentCycle">'+options+'</select></div>'+reminderTools+
 '<div class="segmented">'+filters.map(f=>'<button class="'+(selectedInstallmentStatus===f[0]?'active':'')+'" data-action="installment-filter" data-filter="'+f[0]+'">'+f[1]+'</button>').join('')+'</div>'+
 '<div class="card" id="installmentRows">'+(rowsHtml||'<div class="empty"><b>لا توجد أقساط مطابقة لهذا المرشح</b></div>')+'</div>'+
 '<button class="btn outline full" data-go="receipts">سجل الاستلام والتصحيحات</button>'+

}

function avatarPicker(){
 return '<div class="avatar-picker" role="group" aria-label="اختر أيقونة الحساب">'+AVATAR_OPTIONS.map(([key,icon])=>'<button type="button" class="avatar-option '+(selectedAvatarKey===key?'selected':'')+'" data-action="choose-avatar" data-avatar="'+key+'" aria-pressed="'+(selectedAvatarKey===key)+'">'+uiIcon(icon,22)+'</button>').join('')+'</div>';

  <div class="field"><label for="profileFullName">الاسم الكامل (ثلاثي)</label><input id="profileFullName" name="fullName" required minlength="5" maxlength="120" autocomplete="name" value="${escapeHtml(chosen.fullName||'')}" placeholder="الاسم الأول، الأب، العائلة"><small class="field-hint">أدخل ثلاثة مقاطع على الأقل.</small></div>

 }

 if(action==='run-draw'){
  const r=await SahmApp.performDraw(g.id,{});if(r&&r.ok){refreshData();const winner=r.winner&&r.winner.label||'—';showModal('تم تثبيت نتيجة القرعة','<div class="receipt-mark">★</div><div style="text-align:center"><b>'+escapeHtml(winner)+'</b><p>تم حفظ النتيجة وقفل العضويات والأسهم عند كونها القرعة الأولى.</p></div>',[['عرض المحضر','open-draw-history','primary'],['إغلاق','close','outline']])}return;
 }
 if(action==='open-draw-history'){closeModal();go('draw-history');return}if(action==='receipt-open'){go('receipt-detail',{id:el.dataset.id});return}
 if(action==='receipt-correct'){showModal('تصحيح سجل الاستلام','<p>سيبقى السجل الأصلي محفوظًا في سجل التدقيق.</p><div class="field"><label>سبب التصحيح</label><textarea id="receiptCorrectionReason" rows="3" maxlength="200" required></textarea></div>',[['تأكيد التصحيح','receipt-correct-confirm','danger'],['إلغاء','close','outline']]);$('#modal-root').dataset.receiptId=el.dataset.id;return}
 if(action==='receipt-correct-confirm'){
  const root=$('#modal-root'),reason=$('#receiptCorrectionReason')?.value||'';if(reason.trim().length<3){toast('اكتب سبب التصحيح (3 أحرف على الأقل)');return}
  const r=await SahmApp.correctReceipt(root.dataset.receiptId,{action:'void',reason});if(r&&r.ok){const id=root.dataset.receiptId;closeModal();refreshData();params={id};receiptDetail();toast('تم توثيق التصحيح')}return;
 }
 if(action==='logout-confirm'){showModal('تسجيل الخروج','هل تريد إنهاء الجلسة الحالية؟ ستبقى بيانات المعاينة المحفوظة كما هي.',[['نعم، تسجيل الخروج','logout-now','danger'],['إلغاء','close','outline']]);return}

}
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-go],[data-action]');if(!el)return;const route=el.dataset.go,action=el.dataset.action;
 if(route){
  const context={};
  if(route==='group-detail'&&el.dataset.id)Object.assign(context,{currentGroupId:el.dataset.id,groupDetailTab:'overview'});
  if(route==='chat'&&el.dataset.id)context.currentGroupId=el.dataset.id;
  if(route==='groups')context.groupTab='all';
  go(route,{},context);return;
 }
 await handleAppAction(action,el);
});

document.addEventListener('submit',async e=>{
 const form=e.target;
 if(!['loginForm','registerForm','setupForm','createForm','inviteForm','joinForm','chatForm','profileForm'].includes(form.id))return;
 e.preventDefault();
 const setBusy=(on,label)=>{const b=form.querySelector('button[type="submit"]');if(b){b.disabled=!!on;if(on){b.dataset.oldLabel=b.textContent;b.textContent=label||'جارٍ التنفيذ...'}else if(b.dataset.oldLabel){b.textContent=b.dataset.oldLabel;delete b.dataset.oldLabel}}};
 if(form.id==='loginForm'){
  if(authBusy)return;const d=Object.fromEntries(new FormData(form));
  if(!d.email||!d.password){toast('أدخل البريد الإلكتروني وكلمة المرور');return}
  authBusy=true;setBusy(true,'جارٍ تسجيل الدخول...');
  try{
   const signed=await SahmSupabase.signIn(d.email,d.password);
   activeProfile=await SahmSupabase.profile(signed.user.id);
   await SahmSupabaseData.init(activeProfile);SahmSupabaseData.install();db=load();currentGroupId=(db.groups[0]||{}).id||null;
   db.session=true;db.verified=!!signed.user.email_confirmed_at;db.user=Object.assign(db.user,{id:signed.user.id,email:signed.user.email,name:activeProfile.fullName,phone:activeProfile.phone,city:activeProfile.city});
   if(!activeProfile.completed){resetNavigation('profile-setup',{});}
   else{resetNavigation(new URLSearchParams(location.search).get('invite')?'join-group':'home',{});toast('تم تسجيل الدخول بنجاح');}
  }catch(err){toast(SahmSupabase.friendlyError(err));}
  finally{authBusy=false;setBusy(false);}
  return;
 }
 if(form.id==='registerForm'){
  if(authBusy)return;const d=Object.fromEntries(new FormData(form));
  if(!d.terms){toast('يجب الموافقة على الشروط والأحكام');return}
  if(String(d.password||'').length<8){toast('كلمة المرور يجب ألا تقل عن 8 أحرف');return}
  if(d.password!==d.confirmPassword){toast('كلمتا المرور غير متطابقتين');return}
  authBusy=true;setBusy(true,'جارٍ إنشاء الحساب...');
  try{
   const created=await SahmSupabase.signUp(d.email,d.password,true);
   if(created.session){
    activeProfile=await SahmSupabase.profile(created.user.id);
    await SahmSupabaseData.init(activeProfile);SahmSupabaseData.install();db=load();currentGroupId=(db.groups[0]||{}).id||null;
    db.session=true;db.user=Object.assign(db.user,{id:created.user.id,email:created.user.email});
    selectedAvatarKey=activeProfile.avatarKey||'avatar-01';resetNavigation('profile-setup',{});
   }else{
    toast('تم إنشاء الحساب. افتح رسالة التأكيد التي أرسلناها إلى بريدك الإلكتروني، ثم ارجع لتسجيل الدخول.');
    resetNavigation('welcome',{});
   }
  }catch(err){toast(SahmSupabase.friendlyError(err));}
  finally{authBusy=false;setBusy(false);}
  return;
 }
 if(form.id==='setupForm'){
  if(authBusy)return;const d=Object.fromEntries(new FormData(form));
  const parts=String(d.fullName||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length<3){toast('أدخل الاسم الثلاثي على الأقل');return}
  const digits=String(d.phone||'').replace(/[٠-٩]/g,ch=>'٠١٢٣٤٥٦٧٨٩'.indexOf(ch)).replace(/\D/g,'').replace(/^0+/,'');
  if(digits.length<7||digits.length>14){toast('أدخل رقم هاتف صحيحاً');return}
  const dial=String(d.country||'+967'),dialDigits=dial.replace(/\D/g,'');const national=digits.startsWith(dialDigits)?digits.slice(dialDigits.length):digits;const phoneE164=dial+national;
  authBusy=true;setBusy(true,'جارٍ حفظ بياناتك...');
  try{
   await SahmSupabase.completeProfile(d.fullName,phoneE164,selectedAvatarKey);
   activeProfile=await SahmSupabase.profile();
   db.session=true;db.verified=true;db.user=Object.assign(db.user,{id:activeProfile.id,name:activeProfile.fullName,phone:activeProfile.phone,city:activeProfile.city,avatarKey:activeProfile.avatarKey});
   resetNavigation(new URLSearchParams(location.search).get('invite')?'join-group':'home',{});
   toast('اكتمل ملفك الشخصي');
  }catch(err){toast(SahmSupabase.friendlyError(err));}
  finally{authBusy=false;setBusy(false);}
  return;
 }
 e.preventDefault();
 if(form.id==='createForm'){
  if(createWizardStep<3){if(validateCreateStep(createWizardStep))setCreateWizardStep(createWizardStep+1);return}
  if(!validateCreateStep(1)||!validateCreateStep(2)||!validateCreateStep(3))return;

 }
 if(form.id==='inviteForm'){
  const g=currentGroup();if(!g||!isManager())return;const d=Object.fromEntries(new FormData(form)),r=await SahmApp.createInvite(g.id,{name:d.name,phone:d.phone,shares:Number(d.shares)});
  if(r&&r.ok){refreshData();const link=r.invite&&r.invite.link||'';showModal('تم إنشاء الدعوة','<p>تم إنشاء دعوة فردية لهذا العضو. شارك الرابط معه ليقبل الدعوة بعد إنشاء حسابه وتأكيد بريده.</p><div class="field"><input id="newInviteLink" readonly value="'+escapeHtml(link)+'"></div>',[['نسخ الرابط','copy-new-invite','primary'],['إغلاق','close','outline']]);}
  return;
 }
 if(form.id==='joinForm'){
  const d=new FormData(form),raw=String(d.get('code')||'').trim();

  showModal('بيانات الجمعية','<b>'+escapeHtml(info.name)+'</b><div class="keyvalue"><span>المدير</span><b>'+escapeHtml(info.managerName)+'</b></div><div class="keyvalue"><span>العملة</span><b>'+escapeHtml(info.currency)+'</b></div><div class="keyvalue"><span>مدة الدورة</span><b>'+info.cycleDays+' يومًا</b></div><div class="keyvalue"><span>عدد الأقساط</span><b>'+info.installments+'</b></div><div class="keyvalue"><span>قيمة السهم</span><b>'+minorMoney(info.shareAmountMinor,info.currency)+'</b></div><div class="keyvalue"><span>الأسهم المسجلة</span><b>'+info.assignedShares+' / '+info.targetShares+'</b></div><div class="keyvalue"><span>أسهم الدعوة</span><b>'+info.sharesRequested+'</b></div><p>سيتم التحقق من صلاحية الدعوة وتسجيل عضويتك في الجمعية.</p>',[['تأكيد الانضمام','join-confirm','primary'],['إغلاق','close','outline']]);$('#modal-root').dataset.joinCode=token;return;
 }
 if(form.id==='chatForm'){
  const txt=String(new FormData(form).get('text')||'').trim();if(!txt||txt.length>SahmApp.maxMessage()){toast('الحد الأقصى للرسالة '+SahmApp.maxMessage()+' حرفًا');return}

 }
 if(form.id==='profileForm'){toast('لتعديل الاسم ورقم الهاتف استخدم إعدادات الملف الشخصي المرتبطة بالحساب');return}
});

async function bootSahm(){
 try{
  const session=await SahmSupabase.session();
  if(session&&session.user){
   activeProfile=await SahmSupabase.profile(session.user.id);
   await SahmSupabaseData.init(activeProfile);SahmSupabaseData.install();db=load();currentGroupId=(db.groups[0]||{}).id||null;
   db.session=true;db.verified=!!session.user.email_confirmed_at;
   db.user=Object.assign(db.user,{id:session.user.id,email:session.user.email,name:activeProfile.fullName,phone:activeProfile.phone,city:activeProfile.city,avatarKey:activeProfile.avatarKey});
   selectedAvatarKey=activeProfile.avatarKey||'avatar-01';
   screenName=activeProfile.completed?(new URLSearchParams(location.search).get('invite')?'join-group':'home'):'profile-setup';
  }else{db.session=false;screenName='welcome'}
  SahmSupabase.onAuthStateChange((event,sess)=>{
   if(event==='SIGNED_OUT'){db.session=false;screenName='welcome';resetNavigation('welcome',{});}
  });
 }catch(err){
  db.session=false;screenName='welcome';
  console.warn('SAHM authentication bootstrap:',err);
  setTimeout(()=>toast(SahmSupabase.friendlyError(err)),350);
